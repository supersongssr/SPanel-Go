server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https (标准 443 端口; 走 xray reality 透明回落到 nginx 8443)
    return 301 https://$host$request_uri;
}

server {
    # 8443: reality 偷自己的 dest + 非法探测/普通浏览器回落目标.
    # xray (443) realitySettings.dest=127.0.0.1:8443 把 TLS 握手与未认证流量都转到这里,
    # nginx 用泛域名证书应答, 让 reality 校验通过 + 对外像一个真实站点.
    listen 8443 ssl;
    listen [::]:8443 ssl; #无 IPv6，此项可删除。
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain (reality SNI / serverNames = s{id}.nodeDomain)
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书, reality 偷此证书完成 TLS 握手)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;

    # ── 后量子 (PQ) 限制: 仅允许 X25519MLKEM768 混合曲线 ──────────────────────
    # 本组 (vision-reality-pq) 的实验目的: 当 reality 偷本地 nginx 时, 若被偷的 nginx
    # (8443) 仅允许 X25519MLKEM768 后量子曲线, reality 会怎么做?
    #   - reality 握手由 xray 终止 (xray 443 realitySettings, 用 Go crypto/tls, 不依赖
    #     nginx 的 OpenSSL), 但 reality 的 dest (本 8443) 是它"偷"握手特征的真实站点 —
    #     reality 会先把 ClientHello 转发到 dest 取回真实站点的 ServerHello/Certificate 再回放.
    #   - 故 dest nginx 锁死 PQ 曲线后, reality 内部与 dest 的那次 TLS 协商能否成立, 取决于
    #     xray 链接的 Go 是否提供 X25519MLKEM768 — 这正是本组要验证的核心问题.
    #   - 非法探测/普通浏览器 (非 reality 客户端) 也会回落到本 8443: 仅提供 PQ 曲线 → 不支持
    #     PQ 的客户端 (旧 OpenSSL/BoringSSL) 直接握手失败, 观察其探测特征是否变化.
    #
    # 运行前置 (仅服务端 nginx): 节点 nginx 须链接 OpenSSL >= 3.5 (X25519MLKEM768 始于 3.5.0).
    #   Debian 13 (trixie) 系统库自带 OpenSSL 3.5+, 但 nginx 实际链接版本以 `nginx -V` 为准
    #   (nginx.org 官方包常静态链接旧版 OpenSSL, 系统库新 != nginx 用新版).
    #   proxyInstall.sh 已对 vision-reality-pq + OpenSSL<3.5 在 register 前做了拦截 (回退到
    #   默认 v2_name); 否则低版本节点 nginx -t 会报 unknown curve 拒绝加载 -> 节点下线.
    # X25519MLKEM768 仅 TLS 1.3 可用, 故强制 ssl_protocols TLSv1.3
    # (TLS 1.2 无可用曲线, 保留会让 TLS 1.2 客户端握手失败, 直接禁用更干净).
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 默认回落 / 伪装站: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
