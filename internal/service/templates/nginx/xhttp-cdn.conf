# ============================================================================
# xhttp-cdn: Cloudflare CDN 模式 (灰云 host + 橙云随机 add, 独立 token + 独立域名池)
# ----------------------------------------------------------------------------
# 与普通 xhttp 的 nginx 配置完全一致:
#   - nginx 仍然在本机 443 终结 TLS 并把 /{xhttp_path} 反代到本地 xray.
#   - CDN 的差异在 DNS / 客户端 add 字段, 不在 nginx.
# 数据路径:
#   client --(解析随机橙云 add {rand8}c{id}.{域名} → CF anycast IP)--> CF 边缘
#         --(SNI/Host=灰云 host {rand8}s{id}.{域名}, grey 记录→节点真实 IP)--> 节点 443
#         --> 本 nginx --> 本地 xray
# host 必须灰云 (橙云代管代理流量有 CF 封号风险); add 只负责解析出 CF 的 IP.
# 因此 server_name 必须匹配 CDN 域名 (__nodeDomainRegex__ 由 host 解析得到).
# ============================================================================

server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

server {
    listen __nginxPort__ ssl;
    listen [::]:__nginxPort__ ssl;
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # XHTTP 分流
    location /__xhttpPath__ {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:__xhttpPort__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认回落: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
