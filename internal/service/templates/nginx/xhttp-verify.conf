server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

server {
    listen __nginxPort__ ssl;
    listen [::]:__nginxPort__ ssl;
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # XHTTP 分流: 同时检测 path 与 Xhttp-Verify 自定义 header
    #   - path 必须命中 /__xhttpPath__ (本 location)
    #   - Xhttp-Verify 头 (nginx 变量 $http_xhttp_verify) 必须等于 register 时生成的
    #     随机 UUID (__xhttpVerify__)
    # 任一不匹配 (主动探测 / 低版本客户端 / 扫描器) → 内部跳转到首页,
    # 返回本地 AriaNg 静态站, 提前一层过滤, 避免请求到达 xray.
    # 用自定义 header 而非 User-Agent: 客户端不会自动改写自定义 header.
    location /__xhttpPath__ {
        if ($http_xhttp_verify != "__xhttpVerify__") {
            rewrite ^ / last;
        }

        proxy_redirect off;
        proxy_pass http://127.0.0.1:__xhttpPort__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认回落: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    # Xhttp-Verify 校验失败的请求经 rewrite ^ / last 后也落到这里.
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
