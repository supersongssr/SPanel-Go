# ============================================================================
# xhttp-cdn-hy2: CDN (TCP) + 直连 Hysteria2 (UDP) 混合模式
# ----------------------------------------------------------------------------
# nginx 在本配置里 只负责 xhttp 的 TCP 443:
#   - nginx 终结 443 TLS 并把 /{xhttp_path} 反代到本地 xray (10013).
#   - xhttp 客户端走 CF (随机橙云 add 解析出 CF anycast IP; 差异在 DNS / 客户端 add, 不在 nginx).
#
# hy2 (UDP/QUIC) 由 xray 直接监听 443 UDP (见 xhttp-cdn-hy2.json 的 hy2 inbound),
#   CF 免费版不代理 UDP, 所以 hy2 不经 nginx / 不经 CDN, 客户端直连节点真实 IP.
#   TCP 443 (nginx) 与 UDP 443 (xray) 是不同 socket, 可共存.
#
# 数据路径 (xhttp):
#   client --(解析随机橙云 add {rand8}c{id}.{域名} → CF anycast IP)--> CF 边缘
#         --(SNI/Host=灰云 host {rand8}s{id}.{域名}, grey 记录→节点真实 IP)--> 节点 443
#         --> 本 nginx --> 本地 xray
# 因此 server_name 必须匹配 CDN 域名 (__nodeDomainRegex__ 由 host 解析得到).
# ============================================================================

server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

server {
    listen __nginxPort__ ssl;
    listen [::]:__nginxPort__ ssl;
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # XHTTP 分流
    location /__xhttpPath__ {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:__xhttpPort__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认回落: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
