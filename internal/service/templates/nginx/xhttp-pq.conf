server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

server {
    listen __nginxPort__ ssl;
    listen [::]:__nginxPort__ ssl;
    http2 on;

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # SSL 证书 (泛域名证书)
    ssl_certificate     /etc/ssl/__nodeDomain__.pem;
    ssl_certificate_key /etc/ssl/__nodeDomain__.key;

    # ── 后量子 (PQ) 限制: 仅允许 X25519MLKEM768 混合曲线 ──────────────
    # 运行前置: 节点 nginx 须链接 OpenSSL >= 3.5 (Debian 13/trixie 系统库自带 3.5+).
    #   注意: nginx 实际链接版本以 `nginx -V` 为准 — nginx.org 官方包常静态链接旧版 OpenSSL,
    #         系统库新 != nginx 用新版. 低版本节点 nginx -t 会因 unknown curve 拒绝加载 -> 节点下线.
    #   proxyInstall.sh 已对 xhttp-pq + Debian<13 在结尾做了拦截; 仍建议运维用 nginx -V 复核.
    # X25519MLKEM768 仅 TLS 1.3 可用, 故强制 ssl_protocols TLSv1.3
    # (TLS 1.2 无可用曲线, 保留会让 TLS 1.2 客户端握手失败, 直接禁用更干净).
    # 与 vision-curvePreferences 的区别: vision 由 xray 终止 TLS (曲线写在 xray tlsSettings),
    # xhttp 由 nginx 终止 TLS 再反代 xhttp path 到 xray 本地端口 (xray security=none),
    # 故曲线限制必须写在 nginx (ssl_ecdh_curve), 不能写在 xray.
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # XHTTP 分流
    location /__xhttpPath__ {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:__xhttpPort__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认回落: 本地 AriaNg 静态站 (纯静态, 所有 conf 共用 /var/www/ariang)
    location / {
        root /var/www/ariang;
        index index.html;
    }
}
