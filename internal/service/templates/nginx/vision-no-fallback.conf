server {
    listen 80;
    listen [::]:80; #无 IPv6，此项可删除。

    # 泛域名匹配: 匹配 *.nodeDomain
    server_name .__nodeDomainRegex__;

    # 301 永久重定向到 https
    return 301 https://$host$request_uri;
}

# vision-no-fallback: 不使用 fallbacks, xray 直接监听 443 (VLESS + Vision + TLS).
# 非 VLESS 流量 (如浏览器直接访问该域名) 由 xray 直接返回错误 / 切断连接, 不再回落到 nginx.
# 故不再需要 vision.conf 里 127.0.0.1:8088 的 AriaNg 回落 server — 已移除.
