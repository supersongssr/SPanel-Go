<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快速注册 - SPanel</title>
  <!-- M7.2: 防闪现拦截守卫 - 必须在 head 顶部同步执行 -->
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="auth" class="sp-auth-body" x-data="registerForm()">

  <div class="sp-authpage">
    <form action="javascript:void(0);" method="POST" @submit.prevent="submitRegister" style="width:100%;display:flex;justify-content:center;">
      <div class="sp-auth-main">
        <div class="sp-auth-top">
          <a class="sp-board-btn sp-left" href="/"><div>首 页</div></a>
          <div class="sp-auth-logo">
            <img src="/images/authlogo.jpg" alt="">
          </div>
          <a href="/auth/login.html" class="sp-board-btn sp-right"><div>登 录</div></a>
        </div>

        <div class="sp-auth-body">
          <!-- 昵称 -->
          <div class="sp-field">
            <input class="maxwidth-auth" id="name" type="text" name="UserName" placeholder=" " x-model="userName">
            <label class="floating-label" for="name">昵称 (选填)</label>
          </div>

          <!-- 邮箱 -->
          <div class="sp-field">
            <input class="maxwidth-auth" id="email" type="email" name="Email" placeholder=" " required x-model="email">
            <label class="floating-label" for="email">邮箱 (唯一凭证)</label>
          </div>

          <!-- 密码 -->
          <div class="sp-field">
            <input class="maxwidth-auth" id="passwd" type="password" name="Password" placeholder=" " required x-model="password">
            <label class="floating-label" for="passwd">密码 (至少 8 位数字与字母)</label>
          </div>

          <!-- 联络方式类型 -->
          <div class="sp-field">
            <select class="maxwidth-auth sp-has-value" id="imtype" name="ImType" x-model="imType">
              <option value="1">WeChat (微信)</option>
              <option value="2">QQ</option>
              <option value="3">Facebook</option>
              <option value="4">Telegram</option>
            </select>
            <label class="floating-label" for="imtype">选择您的联络方式</label>
          </div>

          <!-- 联络方式账号 -->
          <div class="sp-field">
            <input class="maxwidth-auth" id="wechat" type="text" name="Wechat" placeholder=" " required x-model="imValue">
            <label class="floating-label" for="wechat">在这输入联络方式账号</label>
          </div>

          <!-- 邀请码 (?code= / ?ref= 由 init 自动读取) -->
          <div class="sp-field">
            <input class="maxwidth-auth" id="code" type="text" name="Code" placeholder=" " x-model="code">
            <label class="floating-label" for="code">邀请码 (选填 / 由链接自动读取)</label>
          </div>

          <!-- 图形验证码 (captchaProvider === 'graphic') -->
          <div x-show="captchaProvider === 'graphic'">
            <div class="sp-auth-captcha">
              <div class="sp-field">
                <input id="captcha" type="text" placeholder=" " :required="captchaProvider === 'graphic'" x-model="captchaCode">
                <label for="captcha">图形验证码 (人机防爆破)</label>
              </div>
              <div class="sp-captcha-svg" @click="refreshCaptcha" title="点击刷新验证码" x-html="captchaSvg"></div>
            </div>
          </div>

          <!-- 极验验证码 (captchaProvider === 'geetest') -->
          <div x-show="captchaProvider === 'geetest'" x-cloak>
            <div id="geetest-captcha" class="sp-field" style="min-height:48px;display:flex;align-items:center;">
              <span class="sp-text-hint" style="font-size:12px;">正在载入极验安全组件...</span>
            </div>
          </div>

          <!-- 邮箱验证码发送 & 输入 (enableEmailVerify) -->
          <div x-show="enableEmailVerify">
            <div style="display:flex;gap:12px;align-items:flex-end;">
              <div class="sp-field" style="flex:1;">
                <input id="email_code" type="text" placeholder=" " :required="enableEmailVerify" x-model="emailCode">
                <label for="email_code">邮箱验证码 (6 位数字)</label>
              </div>
              <button type="button" @click="sendVerificationCode" :disabled="sending || cooldown > 0"
                      class="sp-btn" style="margin-bottom:14px;min-width:118px;">
                <template x-if="cooldown === 0">
                  <span x-text="sending ? '发送中...' : '获取验证码'"></span>
                </template>
                <template x-if="cooldown > 0">
                  <span x-text="`重新发送 (${cooldown}s)`"></span>
                </template>
              </button>
            </div>
          </div>

          <!-- 提交 -->
          <div class="sp-auth-btn">
            <button id="tos" type="submit" class="sp-btn sp-btn-brand sp-btn-block" :disabled="loading">
              <template x-if="!loading">
                <span>确认注册</span>
              </template>
              <template x-if="loading">
                <span><i class="mi">refresh</i>&nbsp;<span x-text="statusText">正在提交...</span></span>
              </template>
            </button>
          </div>

          <div class="sp-auth-links">
            <p>注册即代表同意<a href="/tos">服务条款</a>，以及保证所录入信息的真实性，如有不实信息会导致账号被删除。</p>
            <p>已有账户？<a href="/auth/login.html">立即登入</a></p>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- API Communication Core -->
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function registerForm() {
      return {
        email: '',
        password: '',
        userName: '',
        imType: '1',
        imValue: '',
        code: '',
        captchaCode: '',
        captchaId: '',
        captchaSvg: '',
        captchaProvider: 'graphic',
        geetestId: '',
        geetestValidate: null,
        geetestCaptchaObj: null,
        emailCode: '',
        enableEmailVerify: true,
        loading: false,
        sending: false,
        cooldown: 0,
        statusText: '正在提交...',
        timer: null,

        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          this.code = urlParams.get('ref') || urlParams.get('code') || '';
          await this.loadCaptcha();
        },

        async loadCaptcha() {
          try {
            const res = await SPanelAPI.request('/auth/captcha', { method: 'GET' });
            if (res.captcha_provider === 'none' || res.enable_reg_captcha === false) {
              this.captchaProvider = 'none';
            } else {
              this.captchaProvider = 'graphic';
            }
            this.enableEmailVerify = !!res.enable_email_verify;
            if (this.captchaProvider === 'graphic') {
              this.captchaId = res.captchaId;
              this.captchaSvg = res.svg;
              this.captchaCode = '';
            }
          } catch (err) {
            console.error('拉取验证码配置失败:', err);
          }
        },

        async refreshCaptcha() {
          if (this.captchaProvider !== 'graphic') return;
          try {
            const res = await SPanelAPI.request('/auth/captcha', { method: 'GET' });
            this.captchaId = res.captchaId;
            this.captchaSvg = res.svg;
            this.captchaCode = '';
          } catch (err) {
            SPUI.msg('图形验证码拉取失败，请检查网络。');
          }
        },

        /**
         * 发送验证码 (强验证人机 + 获取算力盐 + Web Worker 碰撞算力)
         */
        async sendVerificationCode() {
          if (!this.email) {
            SPUI.msg('请先输入您的电子邮箱。');
            return;
          }
          if (this.captchaProvider === 'graphic' && !this.captchaCode) {
            SPUI.msg('请先填写图形验证码以完成人机防刷预检。');
            return;
          }

          this.sending = true;
          try {
            await SPanelAPI.request('/auth/send-code', {
              method: 'POST',
              body: JSON.stringify({
                email: this.email,
                captchaId: this.captchaId,
                captchaCode: this.captchaCode,
              })
            });

            SPUI.msg('邮箱验证码发送成功，请前往收件箱（或垃圾箱）查看！');

            this.cooldown = 60;
            this.timer = setInterval(() => {
              this.cooldown--;
              if (this.cooldown <= 0) {
                clearInterval(this.timer);
              }
            }, 1000);

          } catch (err) {
            SPUI.msg(err.message || '发送失败，请重试。');
            this.refreshCaptcha();
          } finally {
            this.sending = false;
          }
        },

        /**
         * 提交最终的注册表单
         */
        async submitRegister() {
          if (this.captchaProvider === 'graphic' && !this.captchaCode) {
            SPUI.msg('请先填写图形验证码以完成人机防刷预检。');
            return;
          }
          if (this.password.length < 8) {
            SPUI.msg('密码长度至少 8 位。');
            return;
          }

          this.loading = true;
          this.statusText = '正在创建账户...';

          try {
            await SPanelAPI.request('/auth/register', {
              method: 'POST',
              body: JSON.stringify({
                email: this.email,
                password: this.password,
                repassword: this.password,
                userName: this.userName,
                imType: Number(this.imType),
                imValue: this.imValue,
                code: this.code,
                emailCode: this.emailCode,
                captchaId: this.captchaId,
                captchaCode: this.captchaCode,
              })
            });

            // 注册即自动登录 (HttpOnly Cookie 已由服务端签发), 存非凭证摘要
            localStorage.removeItem('spanel_jwt');
            localStorage.setItem('spanel_user', JSON.stringify({
              user_name: this.userName || this.email.split('@')[0],
              email: this.email,
              isAdmin: false,
            }));

            this.statusText = '注册成功，正在进入控制台...';
            setTimeout(() => {
              window.location.replace('/user/dashboard.html');
            }, 1200);

          } catch (err) {
            SPUI.msg(err.message || '注册异常，请刷新重试。');
            this.refreshCaptcha();
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
