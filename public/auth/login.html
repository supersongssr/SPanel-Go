<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统登录 - SPanel</title>
  <!-- M7.2: 防闪现拦截守卫 - 必须在 head 顶部同步执行 -->
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="auth" class="sp-auth-body" x-data="loginForm()">

  <div class="sp-authpage">
    <form action="javascript:void(0);" method="POST" style="width:100%;display:flex;justify-content:center;">
      <div class="sp-auth-main">
        <div class="sp-auth-top">
          <a class="sp-board-btn sp-left" href="/"><div>首 页</div></a>
          <div class="sp-auth-logo">
            <img src="/images/authlogo.jpg" alt="">
          </div>
          <a href="/auth/register.html" class="sp-board-btn sp-right"><div>注 册</div></a>
        </div>

        <div class="sp-auth-body">
          <div class="sp-field">
            <input class="maxwidth-auth" id="email" type="text" name="Email" placeholder=" " autocomplete="username"
                   x-model="email" @blur="validateEmail()">
            <label class="floating-label" for="email">邮箱</label>
          </div>
          <div class="sp-field">
            <input class="maxwidth-auth" id="passwd" type="password" name="Password" placeholder=" " autocomplete="current-password" x-model="password">
            <label class="floating-label" for="passwd">密码</label>
          </div>
          <div class="sp-field">
            <input class="maxwidth-auth" id="code" type="text" name="Code" placeholder=" " maxlength="6" inputmode="numeric" autocomplete="one-time-code" x-model="gaCode">
            <label class="floating-label" for="code">两步验证码（未设置请忽略）</label>
          </div>

          <!-- 图形验证码 (captchaProvider === 'graphic') -->
          <template x-if="captchaProvider === 'graphic'">
            <div class="sp-field">
              <div class="sp-auth-captcha">
                <div class="sp-field" style="flex:1">
                  <input id="captcha" type="text" placeholder=" " x-model="captchaCode">
                  <label for="captcha">图形验证码</label>
                </div>
                <div @click="refreshCaptcha" title="点击刷新验证码" x-html="captchaSvg"></div>
              </div>
            </div>
          </template>

          <div class="sp-auth-btn">
            <button id="login" type="submit" class="sp-btn sp-btn-brand sp-btn-block" :disabled="loading">
              <span x-show="!loading">确认登录</span>
              <span x-show="loading" x-cloak><i class="mi">refresh</i>正在提交...</span>
            </button>
          </div>

          <div class="sp-auth-help">
            <label class="sp-check">
              <input type="checkbox" id="remember_me" x-model="rememberMe">记住我
            </label>
            <a href="/auth/reset.html">忘记密码？</a>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- API Communication Core -->
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function loginForm() {
      return {
        email: '',
        emailError: false,
        // M: 邮箱格式严格校验 (与后端 binding:"required,email" 双重强制, 仅允许邮箱登录)
        emailRegex: /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/,
        password: '',
        captchaCode: '',
        captchaId: '',
        captchaSvg: '',
        captchaProvider: 'graphic',
        gaCode: '',
        rememberMe: false,
        loading: false,

        async init() {
          await this.loadCaptcha();
        },

        async loadCaptcha() {
          try {
            const res = await SPanelAPI.request('/auth/captcha', { method: 'GET' });
            if (res.captcha_provider === 'none' || res.enable_login_captcha === false) {
              this.captchaProvider = 'none';
              return;
            }
            this.captchaProvider = 'graphic';
            this.captchaId = res.captchaId;
            this.captchaSvg = res.svg;
            this.captchaCode = '';
          } catch (err) {
            console.error('[Captcha] load failed:', err.message);
          }
        },

        async refreshCaptcha() {
          if (this.captchaProvider !== 'graphic') return;
          try {
            const res = await SPanelAPI.request('/auth/captcha', { method: 'GET' });
            this.captchaId = res.captchaId;
            this.captchaSvg = res.svg;
            this.captchaCode = '';
          } catch (err) {
            SPUI.msg('图形验证码拉取失败，请检查网络。');
          }
        },

        // M: 失焦即校验, 强制提示邮箱格式
        validateEmail() {
          this.email = this.email.trim();
          this.emailError = this.email.length > 0 && !this.emailRegex.test(this.email);
          return !this.emailError;
        },

        async submitLogin() {
          // M: 提交前强制邮箱校验 — 非邮箱格式一律拦截 (后端另有一层 binding:email 兜底)
          this.email = this.email.trim();
          if (!this.emailRegex.test(this.email)) {
            this.emailError = true;
            SPUI.msg('登录账号必须是有效的邮箱地址，例如 name@domain.com');
            return;
          }
          this.emailError = false;
          this.loading = true;

          try {
            const loginResult = await SPanelAPI.request('/auth/login', {
              method: 'POST',
              body: JSON.stringify({
                email: this.email,
                password: this.password,
                code: this.gaCode,
                remember_me: this.rememberMe,
                captchaId: this.captchaId,
                captchaCode: this.captchaCode,
              })
            });

            // 凭据由 HttpOnly Cookie 携带; localStorage 仅存非凭证摘要 (导航渲染用)
            localStorage.removeItem('spanel_jwt');
            localStorage.setItem('spanel_user', JSON.stringify(loginResult.data.user));

            SPUI.msg('登录成功，正在进入用户中心...');
            setTimeout(() => {
              const u = loginResult.data.user;
              if (u.isAdmin === true || u.isAdmin === 1 || u.is_admin === 1) {
                window.location.replace('/admin/dashboard.html');
              } else {
                window.location.replace('/user/dashboard.html');
              }
            }, 800);

          } catch (err) {
            SPUI.msg(err.message || '登录异常，请重试。');
            this.refreshCaptcha();
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
