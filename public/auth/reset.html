<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { outfit: ['Outfit','sans-serif'], inter: ['Inter','sans-serif'] } } } }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(15,23,42,.45); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.05); }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 flex items-center justify-center px-4 py-12" x-data="resetPage()">
  <div class="w-full max-w-md">
    <div class="glass-card rounded-3xl p-8 md:p-10 shadow-2xl">
      <div class="text-center mb-8">
        <a href="/auth/login.html" class="font-outfit text-3xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SPanel</a>
        <h1 class="mt-4 text-xl font-semibold">找回密码</h1>
        <p class="mt-2 text-xs text-slate-500">输入注册邮箱，我们将向您发送重置链接 (24 小时内仅限一次)</p>
      </div>

      <form @submit.prevent="submit" class="space-y-5" x-show="!sent">
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">注册邮箱</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" required x-model="email" placeholder="you@example.com" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-300">
          </div>
        </div>

        <!-- 图形验证码 -->
        <div x-show="captchaProvider === 'graphic'">
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">图形验证码</label>
          <div class="flex space-x-3">
            <input type="text" x-model="captchaCode" placeholder="验证码" class="flex-1 bg-slate-950/80 border border-slate-800 rounded-xl py-3 px-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
            <div @click="refreshCaptcha" class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden cursor-pointer h-12 w-28 flex items-center justify-center hover:border-indigo-500 transition" x-html="captchaSvg" title="点击刷新"></div>
          </div>
        </div>

        <button type="submit" :disabled="loading" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white rounded-xl py-3.5 text-sm font-semibold shadow-lg shadow-indigo-500/20 hover:brightness-110 active:scale-[0.98] transition disabled:opacity-50">
          <span x-show="!loading">发送重置邮件</span>
          <span x-show="loading"><i class="fa-solid fa-spinner animate-spin mr-1"></i>正在发送...</span>
        </button>
      </form>

      <div x-show="sent" class="text-center space-y-4 py-6">
        <i class="fa-solid fa-paper-plane text-5xl text-indigo-400"></i>
        <p class="text-sm text-slate-300">重置邮件已发送至 <span class="text-indigo-400 font-semibold" x-text="email"></span></p>
        <p class="text-xs text-slate-500">请在 24 小时内完成重置；若未收到请检查垃圾箱。</p>
      </div>

      <div class="mt-8 text-center text-xs text-slate-500">
        想起密码了？<a href="/auth/login.html" class="text-indigo-400 font-semibold hover:text-indigo-300 transition">返回登录</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    function resetPage() {
      return {
        email: '',
        captchaProvider: 'none',
        captchaId: '',
        captchaSvg: '',
        captchaCode: '',
        loading: false,
        sent: false,
        async init() {
          try {
            const res = await SPanelAPI.request('/auth/captcha', { method: 'GET' });
            if (res.captcha_provider === 'graphic' && res.enable_reg_captcha) {
              this.captchaProvider = 'graphic';
              this.captchaId = res.captchaId;
              this.captchaSvg = res.svg;
            }
          } catch (e) {}
        },
        async refreshCaptcha() {
          const res = await SPanelAPI.request('/auth/captcha', { method: 'GET' });
          this.captchaId = res.captchaId;
          this.captchaSvg = res.svg;
          this.captchaCode = '';
        },
        async submit() {
          this.loading = true;
          try {
            const qs = this.captchaProvider === 'graphic'
              ? `?captchaId=${encodeURIComponent(this.captchaId)}&captchaCode=${encodeURIComponent(this.captchaCode)}` : '';
            await SPanelAPI.request('/auth/password/reset' + qs, {
              method: 'POST',
              body: JSON.stringify({ email: this.email })
            });
            this.sent = true;
          } catch (err) {
            alert(err.message || '发送失败，请稍后重试。');
            this.refreshCaptcha();
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
