<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 - SPanel</title>
  <!-- M7.2: 防闪现拦截守卫 - 必须在 head 顶部同步执行 -->
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="auth" class="sp-auth-body" x-data="resetPage()">

  <div class="sp-authpage">
    <form action="javascript:void(0);" method="POST" @submit.prevent="submit" style="width:100%;display:flex;justify-content:center;">
      <div class="sp-auth-main">
        <div class="sp-auth-top">
          <a class="sp-board-btn sp-left" href="/"><div>首 页</div></a>
          <div class="sp-auth-logo">
            <img src="/images/authlogo.jpg" alt="">
          </div>
          <a href="/auth/login.html" class="sp-board-btn sp-right"><div>登 录</div></a>
        </div>

        <div class="sp-auth-body">
          <!-- 表单 (未发送态) -->
          <div x-show="!sent">
            <div class="sp-field">
              <input class="maxwidth-auth" id="email" type="email" placeholder=" " required x-model="email">
              <label class="floating-label" for="email">注册邮箱 (24 小时内仅限一次)</label>
            </div>

            <!-- 图形验证码 (captchaProvider === 'graphic') -->
            <div x-show="captchaProvider === 'graphic'" x-cloak>
              <div class="sp-auth-captcha">
                <div class="sp-field">
                  <input id="captcha" type="text" placeholder=" " x-model="captchaCode">
                  <label for="captcha">图形验证码</label>
                </div>
                <div class="sp-captcha-svg" @click="refreshCaptcha" title="点击刷新验证码" x-html="captchaSvg"></div>
              </div>
            </div>

            <div class="sp-auth-btn">
              <button id="reset" type="submit" class="sp-btn sp-btn-brand sp-btn-block" :disabled="loading">
                <span x-show="!loading">重置密码</span>
                <span x-show="loading" x-cloak><i class="mi">refresh</i>正在发送...</span>
              </button>
            </div>
          </div>

          <!-- 发送成功态 -->
          <div x-show="sent" x-cloak style="text-align:center;padding:24px 0 8px;">
            <i class="mi" style="font-size:44px;display:block;margin-bottom:12px;">send</i>
            <p style="margin:0 0 8px;">重置邮件已发送至 <b x-text="email"></b></p>
            <p class="sp-text-hint" style="font-size:12px;margin:0;">请在 24 小时内完成重置；若未收到请检查垃圾箱。</p>
          </div>

          <div class="sp-auth-links">
            <p>请妥善保管好自己的登录密码</p>
            <p>想起密码了？<a href="/auth/login.html">返回登录</a></p>
          </div>
        </div>
      </div>
    </form>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function resetPage() {
      return {
        email: '',
        captchaProvider: 'none',
        captchaId: '',
        captchaSvg: '',
        captchaCode: '',
        loading: false,
        sent: false,
        async init() {
          try {
            const res = await SPanelAPI.request('/auth/captcha', { method: 'GET' });
            if (res.captcha_provider === 'graphic' && res.enable_reg_captcha) {
              this.captchaProvider = 'graphic';
              this.captchaId = res.captchaId;
              this.captchaSvg = res.svg;
            }
          } catch (e) {}
        },
        async refreshCaptcha() {
          const res = await SPanelAPI.request('/auth/captcha', { method: 'GET' });
          this.captchaId = res.captchaId;
          this.captchaSvg = res.svg;
          this.captchaCode = '';
        },
        async submit() {
          this.loading = true;
          try {
            const qs = this.captchaProvider === 'graphic'
              ? `?captchaId=${encodeURIComponent(this.captchaId)}&captchaCode=${encodeURIComponent(this.captchaCode)}` : '';
            await SPanelAPI.request('/auth/password/reset' + qs, {
              method: 'POST',
              body: JSON.stringify({ email: this.email })
            });
            this.sent = true;
          } catch (err) {
            SPUI.msg(err.message || '发送失败，请稍后重试。');
            this.refreshCaptcha();
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
