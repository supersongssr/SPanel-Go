<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { outfit: ['Outfit','sans-serif'], inter: ['Inter','sans-serif'] } } } }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(15,23,42,.45); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.05); }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 flex items-center justify-center px-4 py-12" x-data="tokenPage()">
  <div class="w-full max-w-md">
    <div class="glass-card rounded-3xl p-8 md:p-10 shadow-2xl">
      <div class="text-center mb-8">
        <a href="/auth/login.html" class="font-outfit text-3xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SPanel</a>
        <h1 class="mt-4 text-xl font-semibold">设置新密码</h1>
        <p class="mt-2 text-xs text-slate-500">重置成功后将自动关闭两步验证，并使所有已登录设备下线</p>
      </div>

      <form @submit.prevent="submit" class="space-y-5">
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">新密码</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-lock"></i></span>
            <input type="password" required minlength="8" x-model="password" placeholder="至少 8 位" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
          </div>
        </div>
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">确认新密码</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-lock"></i></span>
            <input type="password" required minlength="8" x-model="repassword" placeholder="再输入一次" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
          </div>
        </div>
        <button type="submit" :disabled="loading" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white rounded-xl py-3.5 text-sm font-semibold shadow-lg shadow-indigo-500/20 hover:brightness-110 active:scale-[0.98] transition disabled:opacity-50">
          <span x-show="!loading">重置密码</span>
          <span x-show="loading"><i class="fa-solid fa-spinner animate-spin mr-1"></i>正在重置...</span>
        </button>
      </form>

      <div x-show="done" class="text-center space-y-4 py-6">
        <i class="fa-solid fa-circle-check text-5xl text-emerald-400"></i>
        <p class="text-sm text-slate-300">密码重置成功！</p>
        <a href="/auth/login.html" class="inline-block bg-indigo-500 hover:bg-indigo-400 text-white rounded-xl px-8 py-3 text-sm font-semibold transition">前往登录</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    function tokenPage() {
      return {
        password: '',
        repassword: '',
        loading: false,
        done: false,
        token: '',
        init() {
          const params = new URLSearchParams(window.location.search);
          this.token = params.get('token') || window.location.pathname.split('/').pop();
          if (!this.token) {
            alert('重置链接无效');
            window.location.replace('/auth/reset.html');
          }
        },
        async submit() {
          if (this.password !== this.repassword) {
            alert('两次输入的密码不一致');
            return;
          }
          this.loading = true;
          try {
            await SPanelAPI.request('/auth/password/token/' + encodeURIComponent(this.token), {
              method: 'POST',
              body: JSON.stringify({ password: this.password, repassword: this.repassword })
            });
            this.done = true;
          } catch (err) {
            alert(err.message || '重置失败，请重新申请');
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
