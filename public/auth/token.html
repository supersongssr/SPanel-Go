<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 - SPanel</title>
  <!-- M7.2: 防闪现拦截守卫 - 必须在 head 顶部同步执行 -->
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="auth" class="sp-auth-body" x-data="tokenPage()">

  <div class="sp-authpage">
    <form action="javascript:void(0);" method="POST" @submit.prevent="submit" style="width:100%;display:flex;justify-content:center;">
      <div class="sp-auth-main">
        <div class="sp-auth-top">
          <a class="sp-board-btn sp-left" href="/"><div>首 页</div></a>
          <div class="sp-auth-logo">
            <img src="/images/authlogo.jpg" alt="">
          </div>
          <a href="/auth/login.html" class="sp-board-btn sp-right"><div>登 录</div></a>
        </div>

        <div class="sp-auth-body">
          <!-- 表单 (未完成态) -->
          <div x-show="!done">
            <div class="sp-field">
              <input class="maxwidth-auth" id="password" type="password" placeholder=" " required minlength="8" x-model="password">
              <label class="floating-label" for="password">新密码 (至少 8 位)</label>
            </div>
            <div class="sp-field">
              <input class="maxwidth-auth" id="repasswd" type="password" placeholder=" " required minlength="8" x-model="repassword">
              <label class="floating-label" for="repasswd">重复密码</label>
            </div>

            <div class="sp-auth-btn">
              <button id="reset" type="submit" class="sp-btn sp-btn-brand sp-btn-block" :disabled="loading">
                <span x-show="!loading">重置密码</span>
                <span x-show="loading" x-cloak><i class="mi">refresh</i>正在重置...</span>
              </button>
            </div>
          </div>

          <!-- 重置成功态 -->
          <div x-show="done" x-cloak style="text-align:center;padding:24px 0 8px;">
            <i class="mi" style="font-size:44px;display:block;margin-bottom:12px;">check_circle</i>
            <p style="margin:0 0 8px;">密码重置成功！</p>
            <p class="sp-text-hint" style="font-size:12px;margin:0 0 16px;">两步验证已自动关闭，所有已登录设备均已下线。</p>
            <a href="/auth/login.html" class="sp-btn sp-btn-brand">前往登录</a>
          </div>

          <div class="sp-auth-links">
            <p>请妥善保管好自己的登录密码</p>
            <p>甚至想要重新注册？<a href="/auth/register.html">点此注册</a></p>
          </div>
        </div>
      </div>
    </form>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function tokenPage() {
      return {
        password: '',
        repassword: '',
        loading: false,
        done: false,
        token: '',
        init() {
          const params = new URLSearchParams(window.location.search);
          this.token = params.get('token') || window.location.pathname.split('/').pop();
          if (!this.token) {
            SPUI.msg('重置链接无效');
            window.location.replace('/auth/reset.html');
          }
        },
        async submit() {
          if (this.password !== this.repassword) {
            SPUI.msg('两次输入的密码不一致');
            return;
          }
          this.loading = true;
          try {
            await SPanelAPI.request('/auth/password/token/' + encodeURIComponent(this.token), {
              method: 'POST',
              body: JSON.stringify({ password: this.password, repassword: this.repassword })
            });
            this.done = true;
          } catch (err) {
            SPUI.msg(err.message || '重置失败，请重新申请');
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
