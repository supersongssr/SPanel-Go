<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统概览 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="dashboard" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">系统概览</h1></div>
    </div>
    <div class="sp-content-inner" x-data="adminIndexPage()">
      <div class="sp-grid">
        <div class="sp-col-3">
          <div class="sp-card sp-adm-stat">
            <div class="sp-adm-stat-num c-dark" x-text="d.total_users ?? '—'"></div>
            <div class="sp-adm-stat-label">总用户</div>
          </div>
        </div>
        <div class="sp-col-3">
          <div class="sp-card sp-adm-stat">
            <div class="sp-adm-stat-num c-blue" x-text="d.online_30m ?? '—'"></div>
            <div class="sp-adm-stat-label">30 分钟在线</div>
          </div>
        </div>
        <div class="sp-col-3">
          <div class="sp-card sp-adm-stat">
            <div class="sp-adm-stat-num c-orange" x-text="d.today_traffic ?? '—'"></div>
            <div class="sp-adm-stat-label">今日流量</div>
          </div>
        </div>
        <div class="sp-col-3">
          <div class="sp-card sp-adm-stat">
            <div class="sp-adm-stat-num c-green" x-text="d.real_nodes ?? '—'"></div>
            <div class="sp-adm-stat-label">真实节点</div>
          </div>
        </div>
      </div>

      <div class="sp-grid sp-mt-6">
        <div class="sp-col-12">
          <div class="sp-card sp-adm-stat-cta">
            <p>分组/等级决策数据(节点池防墙红线 · 组流量利用率 · 用户超编 · G5 迁移候选)已迁移至节点决策台</p>
            <a class="sp-btn sp-btn-brand" href="/admin/node-decision.html"><i class="mi">assessment</i>进入节点决策台</a>
            &nbsp;
            <a class="sp-btn sp-btn-flat" href="/admin/node-group-traffic.html"><i class="mi">show_chart</i>组流量统计</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function adminIndexPage() {
      return {
        d: {},
        init() {
          SPanelAPI.request('/api/v2/admin/dashboard')
            .then(res => { this.d = res.data; })
            .catch(e => SPUI.msg(e.message || '加载失败'));
        }
      };
    }
  </script>
</body>
</html>
