<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统概览 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="dashboard">
  <main class="sp-content">
    <div class="page-header d-print-none">
      <div class="row align-items-center">
        <div class="col">
          <h2 class="page-title">系统概览</h2>
        </div>
      </div>
    </div>
    <div x-data="adminIndexPage()">
      <div class="row row-cards">
        <div class="col-sm-6 col-xl-3">
          <div class="card">
            <div class="card-body">
              <div class="subheader">总用户</div>
              <div class="h1 mb-0" x-text="d.total_users ?? '—'"></div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="card">
            <div class="card-body">
              <div class="subheader">30 分钟在线</div>
              <div class="h1 mb-0 text-blue" x-text="d.online_30m ?? '—'"></div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="card">
            <div class="card-body">
              <div class="subheader">今日流量</div>
              <div class="h1 mb-0 text-orange" x-text="d.today_traffic ?? '—'"></div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="card">
            <div class="card-body">
              <div class="subheader">真实节点</div>
              <div class="h1 mb-0 text-green" x-text="d.real_nodes ?? '—'"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card mt-3">
        <div class="card-body text-center">
          <p class="text-secondary">分组/等级决策数据(节点池防墙红线 · 组流量利用率 · 用户超编 · G5 迁移候选)已迁移至节点决策台</p>
          <div class="d-flex flex-wrap justify-content-center gap-2">
            <a class="btn btn-primary" href="/admin/node-decision.html"><i class="mi">assessment</i>进入节点决策台</a>
            <a class="btn" href="/admin/node-group-traffic.html"><i class="mi">show_chart</i>组流量统计</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function adminIndexPage() {
      return {
        d: {},
        init() {
          SPanelAPI.request('/api/v2/admin/dashboard')
            .then(res => { this.d = res.data; })
            .catch(e => SPUI.msg(e.message || '加载失败'));
        }
      };
    }
  </script>
</body>
</html>
