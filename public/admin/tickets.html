<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工单管理 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="tickets">
  <main class="sp-content">
    <div class="page-header d-print-none">
      <div class="row align-items-center">
        <div class="col">
          <h2 class="page-title">工单管理</h2>
        </div>
      </div>
    </div>
    <div id="ticketTable"></div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function statusTag(s) {
      // 0 关闭 / 1 开启 / 3 公开 (PHP ajax 三值口径)
      if (s === 0) return '<span class="badge bg-secondary-lt">关闭</span>';
      if (s === 3) return '<span class="badge bg-blue-lt">公开</span>';
      return '<span class="badge bg-green-lt">开启</span>';
    }
    function fmtTs(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }

    AdminTable('#ticketTable', {
      api: '/api/v2/admin/ticket',
      stateKey: 'adm:tickets',
      search: '搜索标题/用户名/用户ID',
      defaultOrder: ['sort', 'desc'],
      columns: [
        { key: 'status',   title: '状态', sortable: true, render: r => statusTag(r.status) },
        { key: 'title',    title: '标题', sortable: true },
        { key: 'id',       title: 'ID', sortable: true },
        { key: 'userid',   title: '用户ID', sortable: true,
          render: r => '<a href="/admin/user-edit.html?id=' + r.userid + '">' + r.userid + '</a>' },
        { key: 'datetime', title: '时间', sortable: true, render: r => esc(fmtTs(r.datetime)) },
        { key: 'sort',     title: '优先分', sortable: true,
          render: r => r.sort >= 5 ? '<span class="badge bg-red-lt">' + r.sort + '</span>' : esc(r.sort) },
        { key: 'user_name', title: '用户名', sortable: true },
      ],
      ops: r => '<a class="btn btn-sm" href="/admin/ticket-view.html?id=' + r.id + '">查看</a>'
    });
  </script>
</body>
</html>
