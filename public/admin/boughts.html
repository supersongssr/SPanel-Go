<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购买记录 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="boughts" data-sp-active="boughts" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">购买记录</h1></div>
    </div>
    <div class="sp-content-inner">
      <div id="boughtTable"></div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    function fmtTs(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    var tbl = AdminTable('#boughtTable', {
      api: '/api/v2/admin/bought',
      stateKey: 'adm:boughts',
      search: '搜索用户名/ID/价格',
      defaultOrder: ['id', 'desc'],
      columns: [
        { key: 'id',       title: 'ID', sortable: true },
        { key: 'datetime', title: '购买日期', sortable: true, render: r => fmtTs(r.datetime) },
        { key: 'content_text', title: '内容' },
        { key: 'price',    title: '价格', sortable: true },
        { key: 'user_id',  title: '用户ID', sortable: true,
          render: r => '<a href="/admin/user-edit.html?id=' + r.user_id + '">' + r.user_id + '</a>' },
        { key: 'user_name', title: '用户名', sortable: true },
        { key: 'renew',    title: '自动续费时间', sortable: true,
          render: r => r.renew === 0 ? '<span class="sp-tag sp-tag-grey">已中止</span>' :
            '<span class="sp-tag sp-tag-blue">' + fmtTs(r.renew) + '</span>' },
        { key: 'auto_reset_bandwidth', title: '续费时重置流量',
          render: r => r.auto_reset_bandwidth === 0 ? '不重置' : '重置' },
        { key: 'coupon',   title: '优惠码' },
      ],
      ops: r => (r.renew === 0
        ? '<button class="sp-btn sp-btn-sm" disabled>已中止</button>'
        : '<button class="sp-btn sp-btn-sm sp-btn-danger" data-stop="' + r.id + '">中止续费</button>')
    });
    document.getElementById('boughtTable').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-stop]');
      if (!btn) return;
      SPUI.confirm('确认中止该购买记录的自动续费?', function () {
        SPanelAPI.request('/api/v2/admin/bought/' + btn.getAttribute('data-stop'), { method: 'DELETE' })
          .then(res => { SPUI.toast(res.msg || '退订成功', 'success'); tbl.reload(); })
          .catch(err => SPUI.msg(err.message));
      }, { danger: true, okText: '中止' });
    });
  </script>
</body>
</html>
