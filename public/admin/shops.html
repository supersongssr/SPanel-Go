<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="shops">
  <main class="sp-content">
    <div class="page-header d-print-none">
      <div class="row align-items-center">
        <div class="col">
          <h2 class="page-title">商品</h2>
        </div>
        <div class="col-auto ms-auto d-print-none d-flex gap-2">
          <a class="btn btn-primary" href="/admin/shop-edit.html"><i class="mi">add</i>添加商品</a>
          <a class="btn" href="/admin/boughts.html"><i class="mi">shopping_cart</i>购买记录</a>
        </div>
      </div>
    </div>
    <div id="shopTable"></div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    var tbl = AdminTable('#shopTable', {
      api: '/api/v2/admin/shop',
      stateKey: 'adm:shops',
      search: '搜索商品名',
      defaultOrder: ['id', 'asc'],
      columns: [
        { key: 'id',    title: 'ID', sortable: true },
        { key: 'name',  title: '名称', sortable: true },
        { key: 'price', title: '价格', sortable: true },
        { key: 'content_text', title: '内容' },
        { key: 'auto_renew', title: '自动续费', sortable: true,
          render: r => r.auto_renew === 0 ? '不自动续费' : r.auto_renew + ' 天后续费' },
        { key: 'auto_reset_bandwidth', title: '重置流量', sortable: true,
          render: r => r.auto_reset_bandwidth === 0 ? '不自动重置' : '自动重置' },
        { key: 'status', title: '状态', sortable: true,
          render: r => r.status === 1 ? '<span class="badge bg-green-lt">上架</span>' : '<span class="badge bg-secondary-lt">下架</span>' },
        { key: 'period_sales', title: '周期销量' },
      ],
      ops: r =>
        '<a class="btn btn-sm" href="/admin/shop-edit.html?id=' + r.id + '">编辑</a>' +
        (r.status === 1
          ? '<button class="btn btn-sm btn-danger" data-off="' + r.id + '" data-name="' + r.name + '">下架</button>'
          : '')
    });
    document.getElementById('shopTable').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-off]');
      if (!btn) return;
      SPUI.confirm('确认下架商品 <b>' + btn.getAttribute('data-name') + '</b>?<br>下架后该商品的全部购买记录将停止自动续费。', function () {
        SPanelAPI.request('/api/v2/admin/shop/' + btn.getAttribute('data-off'), { method: 'DELETE' })
          .then(res => { SPUI.toast(res.msg || '下架成功', 'success'); tbl.reload(); })
          .catch(err => SPUI.msg(err.message));
      }, { danger: true, okText: '下架' });
    });
  </script>
</body>
</html>
