<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下发命令 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="autos">
  <main class="sp-content">
    <div class="page-header d-print-none">
      <div class="row align-items-center">
        <div class="col">
          <h2 class="page-title">下发命令</h2>
        </div>
      </div>
    </div>
    <!-- 下发表单 (PHP auto/create 页内联) -->
    <div class="card mb-3" x-data="autoCreatePage()">
      <div class="card-header"><h3 class="card-title"><i class="mi me-2">flash_auto</i>新命令</h3></div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6"><div class="mb-3">
            <label class="form-label">命令内容 (value)</label>
            <textarea class="form-control" rows="3" x-model="content" placeholder="节点侧执行的命令"></textarea>
          </div></div>
          <div class="col-sm-6 col-xl-3"><div class="mb-3">
            <label class="form-label">签名 (sign)</label>
            <input class="form-control" type="text" x-model="sign">
          </div></div>
          <div class="col-sm-6 col-xl-3 d-flex align-items-end">
            <button class="btn btn-primary" @click="create()" :disabled="saving"><i class="mi">send</i>下发</button>
          </div>
        </div>
      </div>
    </div>
    <div id="autoTable"></div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmtTs(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    var tbl;
    function autoCreatePage() {
      return {
        content: '', sign: '', saving: false,
        create() {
          if (!this.content) { SPUI.toast('请输入命令内容'); return; }
          this.saving = true;
          SPanelAPI.request('/api/v2/admin/auto', { method: 'POST', body: JSON.stringify({ content: this.content, sign: this.sign }) })
            .then(res => { SPUI.toast(res.msg || '添加成功', 'success'); this.content = ''; this.sign = ''; tbl.reload(); })
            .catch(e => SPUI.msg(e.message))
            .finally(() => { this.saving = false; });
        }
      };
    }
    tbl = AdminTable('#autoTable', {
      api: '/api/v2/admin/auto',
      stateKey: 'adm:autos',
      search: '搜索内容/签名',
      defaultOrder: ['id', 'desc'],
      columns: [
        { key: 'id',       title: 'ID', sortable: true },
        { key: 'datetime', title: '时间', sortable: true, render: r => fmtTs(r.datetime) },
        { key: 'type',     title: '类型', sortable: true,
          render: r => r.type === 1 ? '<span class="badge bg-blue-lt">命令下发</span>' : '<span class="badge bg-green-lt">命令被执行</span>' },
        { key: 'value',    title: '内容', sortable: true, tdClass: 'text-wrap' },
        { key: 'sign',     title: '签名' },
      ],
      ops: r => '<button class="btn btn-sm btn-danger" data-del="' + r.id + '">删除</button>'
    });
    document.getElementById('autoTable').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-del]');
      if (!btn) return;
      SPUI.confirm('确认删除该命令?', function () {
        SPanelAPI.request('/api/v2/admin/auto/' + btn.getAttribute('data-del'), { method: 'DELETE' })
          .then(res => { SPUI.toast(res.msg || '删除成功', 'success'); tbl.reload(); })
          .catch(err => SPUI.msg(err.message));
      }, { danger: true, okText: '删除' });
    });
  </script>
</body>
</html>
