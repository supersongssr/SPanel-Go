<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充值统计 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="recharge-stats" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">充值统计</h1></div>
    </div>
    <div class="sp-content-inner" x-data="rechargeStatsPage()" x-init="load()">
      <div class="sp-card sp-mb-6">
        <div class="sp-grid">
          <div class="sp-col-6"><div class="sp-dl-row"><dt>用户总数</dt><dd x-text="d.sum_total ?? '—'"></dd></div></div>
          <div class="sp-col-6"><div class="sp-dl-row"><dt>最近一笔充值</dt><dd x-text="d.latest_recharge ? fmtTs(d.latest_recharge) : '无记录'"></dd></div></div>
        </div>
        <p class="sp-text-hint" style="font-size:12px">
          口径: code 表 type=-1 (金额充值) 且 isused=1; 窗口内去重用户数按分组统计, 占比 = 该组去重充值数 ÷ 该组用户总数。
        </p>
      </div>

      <div class="sp-card">
        <div class="sp-card-title"><i class="mi">equalizer</i>窗口 × 分组</div>
        <div class="sp-table-wrap">
          <table class="sp-table">
            <thead><tr>
              <th>窗口</th>
              <template x-for="g in groups" :key="g">
                <th x-text="'G' + g + ' (共' + (groupTotals[g] || 0) + ')'"></th>
              </template>
              <th>合计</th><th>金额 (元)</th>
            </tr></thead>
            <tbody>
              <template x-for="w in windows" :key="w.days">
                <tr>
                  <td><b x-text="w.days + ' 天'"></b></td>
                  <template x-for="g in groups" :key="g">
                    <td>
                      <span x-text="((w.stats || {})[g] || 0)"></span>
                      <span class="sp-text-hint" style="margin-left:4px" x-text="('(' + ((w.pct || {})[g] || 0) + '%)')"></span>
                    </td>
                  </template>
                  <td><b x-text="w.sum"></b></td>
                  <td class="sp-num" x-text="w.amount"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function rechargeStatsPage() {
      return {
        d: {}, groups: [], windows: [], groupTotals: {},
        fmtTs(ts) {
          const d = new Date(ts * 1000);
          const p = n => String(n).padStart(2, '0');
          return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        },
        load() {
          SPanelAPI.request('/api/v2/admin/stats/recharge')
            .then(res => {
              this.d = res.data;
              this.groups = res.data.groups || [];
              this.windows = res.data.windows || [];
              this.groupTotals = res.data.group_totals || {};
            })
            .catch(e => SPUI.msg(e.message));
        }
      };
    }
  </script>
</body>
</html>
