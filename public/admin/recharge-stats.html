<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充值统计 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="recharge-stats">
  <main class="sp-content">
    <div x-data="rechargeStatsPage()" x-init="load()">
      <div class="page-header d-print-none">
        <div class="row align-items-center">
          <div class="col">
            <h2 class="page-title">充值统计</h2>
          </div>
        </div>
      </div>
      <div class="card mb-3">
        <div class="card-body">
          <div class="row">
            <div class="col-md-6"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">用户总数</span><span class="text-break" x-text="d.sum_total ?? '—'"></span></div></div>
            <div class="col-md-6"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">最近一笔充值</span><span class="text-break" x-text="d.latest_recharge ? fmtTs(d.latest_recharge) : '无记录'"></span></div></div>
          </div>
          <p class="text-secondary small mb-0">
            口径: code 表 type=-1 (金额充值) 且 isused=1; 窗口内去重用户数按分组统计, 占比 = 该组去重充值数 ÷ 该组用户总数。
          </p>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3 class="card-title"><i class="mi me-2">equalizer</i>窗口 × 分组</h3></div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table">
            <thead><tr>
              <th>窗口</th>
              <template x-for="g in groups" :key="g">
                <th x-text="'G' + g + ' (共' + (groupTotals[g] || 0) + ')'"></th>
              </template>
              <th>合计</th><th>金额 (元)</th>
            </tr></thead>
            <tbody>
              <template x-for="w in windows" :key="w.days">
                <tr>
                  <td><b x-text="w.days + ' 天'"></b></td>
                  <template x-for="g in groups" :key="g">
                    <td>
                      <span x-text="((w.stats || {})[g] || 0)"></span>
                      <span class="text-secondary ms-1" x-text="('(' + ((w.pct || {})[g] || 0) + '%)')"></span>
                    </td>
                  </template>
                  <td><b x-text="w.sum"></b></td>
                  <td class="font-monospace" x-text="w.amount"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function rechargeStatsPage() {
      return {
        d: {}, groups: [], windows: [], groupTotals: {},
        fmtTs(ts) {
          const d = new Date(ts * 1000);
          const p = n => String(n).padStart(2, '0');
          return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        },
        load() {
          SPanelAPI.request('/api/v2/admin/stats/recharge')
            .then(res => {
              this.d = res.data;
              this.groups = res.data.groups || [];
              this.windows = res.data.windows || [];
              this.groupTotals = res.data.group_totals || {};
            })
            .catch(e => SPUI.msg(e.message));
        }
      };
    }
  </script>
</body>
</html>
