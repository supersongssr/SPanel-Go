<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优惠码 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="coupons" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">优惠码</h1></div>
    </div>
    <div class="sp-content-inner">
      <!-- 页内生成表单 (PHP coupon.tpl) -->
      <div class="sp-card sp-mb-6" x-data="couponGenPage()">
        <div class="sp-card-title"><i class="mi">card_giftcard</i>生成优惠码</div>
        <div class="sp-grid">
          <div class="sp-col-3"><div class="sp-form-row">
            <label class="sp-form-label">生成方式</label>
            <select class="sp-select" x-model.number="generate_type">
              <option value="1">定制 (使用输入的码)</option>
              <option value="2">随机 8 位</option>
              <option value="3">前缀 + 随机 8 位</option>
            </select>
          </div></div>
          <div class="sp-col-3"><div class="sp-form-row">
            <label class="sp-form-label">优惠码/前缀 (方式 1/3 必填)</label>
            <input class="sp-input" type="text" x-model="prefix">
          </div></div>
          <div class="sp-col-3"><div class="sp-form-row">
            <label class="sp-form-label">有效期 (小时)</label>
            <input class="sp-input" type="text" x-model="expire">
          </div></div>
          <div class="sp-col-3"><div class="sp-form-row">
            <label class="sp-form-label">限定商品 ID (空 = 全部)</label>
            <input class="sp-input" type="text" x-model="shop">
          </div></div>
          <div class="sp-col-3"><div class="sp-form-row">
            <label class="sp-form-label">折扣额度 (%, 如 25 = 75 折)</label>
            <input class="sp-input" type="text" x-model.number="credit">
          </div></div>
          <div class="sp-col-3"><div class="sp-form-row">
            <label class="sp-form-label">次数 (0 = 不限, 1 = 一次性)</label>
            <input class="sp-input" type="text" x-model.number="onetime">
          </div></div>
          <div class="sp-col-3" style="display:flex;align-items:flex-end">
            <button class="sp-btn sp-btn-brand" @click="gen()" :disabled="saving"><i class="mi">add</i>生成</button>
          </div>
        </div>
      </div>
      <div id="couponTable"></div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    var tbl;
    function couponGenPage() {
      return {
        generate_type: 1, prefix: '', expire: 1, shop: '', credit: 25, onetime: 1, saving: false, // 旧版默认有效期 1 小时
        gen() {
          this.saving = true;
          SPanelAPI.request('/api/v2/admin/coupon', {
            method: 'POST',
            body: JSON.stringify({
              generate_type: this.generate_type, prefix: this.prefix.trim(),
              expire: parseFloat(this.expire) || 0, shop: this.shop.trim(),
              credit: parseInt(this.credit) || 0, onetime: parseInt(this.onetime) || 0,
            })
          })
            .then(res => {
              SPUI.msg('优惠码添加成功: <b>' + (res.data && res.data.code || '') + '</b>');
              this.prefix = '';
              tbl && tbl.reload();
            })
            .catch(e => SPUI.msg(e.message))
            .finally(() => { this.saving = false; });
        }
      };
    }
    tbl = AdminTable('#couponTable', {
      api: '/api/v2/admin/coupon',
      stateKey: 'adm:coupons',
      search: '搜索优惠码',
      defaultOrder: ['id', 'desc'],
      columns: [
        { key: 'id',      title: 'ID', sortable: true },
        { key: 'code',    title: '优惠码', sortable: true, tdClass: 'sp-num' },
        { key: 'expire',  title: '过期时间', sortable: true,
          render: r => r.expired
            ? '<span class="sp-tag sp-tag-grey">' + r.expire + ' 已过期</span>'
            : '<span class="sp-tag sp-tag-green">' + r.expire + '</span>' },
        { key: 'shop',    title: '限定商品ID', sortable: true, render: r => r.shop || '全部' },
        { key: 'credit',  title: '额度(%)', sortable: true },
        { key: 'onetime', title: '次数', sortable: true, render: r => r.onetime === 0 ? '不限' : r.onetime },
      ],
      ops: r => '<button class="sp-btn sp-btn-sm sp-btn-danger" data-del="' + r.id + '" data-code="' + r.code + '">删除</button>'
    });
    document.getElementById('couponTable').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-del]');
      if (!btn) return;
      SPUI.confirm('确认删除优惠码 <b>' + btn.getAttribute('data-code') + '</b>?', function () {
        SPanelAPI.request('/api/v2/admin/coupon/' + btn.getAttribute('data-del'), { method: 'DELETE' })
          .then(res => { SPUI.toast(res.msg || '删除成功', 'success'); tbl.reload(); })
          .catch(err => SPUI.msg(err.message));
      }, { danger: true, okText: '删除' });
    });
  </script>
</body>
</html>
