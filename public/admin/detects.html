<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计规则 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="detects" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">审计规则</h1></div>
    </div>
    <div class="sp-content-inner">
      <div class="sp-mb-6">
        <a class="sp-btn sp-btn-brand" href="/admin/detect-edit.html"><i class="mi">add</i>添加规则</a>
        <a class="sp-btn sp-btn-flat" href="/admin/detect-log.html"><i class="mi">assignment_late</i>审计记录</a>
      </div>
      <div id="detectTable"></div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    var tbl = AdminTable('#detectTable', {
      api: '/api/v2/admin/detect',
      stateKey: 'adm:detects',
      search: '搜索名称/描述/正则',
      defaultOrder: ['id', 'asc'],
      columns: [
        { key: 'id',    title: 'ID', sortable: true },
        { key: 'name',  title: '名称', sortable: true },
        { key: 'text',  title: '介绍', sortable: true },
        { key: 'regex', title: '正则表达式', sortable: true, tdClass: 'sp-num' },
        { key: 'type',  title: '类型', sortable: true,
          render: r => r.type === 1 ? '<span class="sp-tag sp-tag-blue">数据包明文匹配</span>' : '<span class="sp-tag sp-tag-orange">数据包十六进制匹配</span>' },
      ],
      ops: r =>
        '<a class="sp-btn sp-btn-sm" href="/admin/detect-edit.html?id=' + r.id + '">编辑</a>' +
        '<button class="sp-btn sp-btn-sm sp-btn-danger" data-del="' + r.id + '" data-name="' + esc(r.name) + '">删除</button>'
    });
    document.getElementById('detectTable').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-del]');
      if (!btn) return;
      SPUI.confirm('确认删除审计规则 <b>' + btn.getAttribute('data-name') + '</b>?', function () {
        SPanelAPI.request('/api/v2/admin/detect/' + btn.getAttribute('data-del'), { method: 'DELETE' })
          .then(res => { SPUI.toast(res.msg || '删除成功', 'success'); tbl.reload(); })
          .catch(err => SPUI.msg(err.message));
      }, { danger: true, okText: '删除' });
    });
  </script>
</body>
</html>
