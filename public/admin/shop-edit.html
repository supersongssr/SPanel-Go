            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">销售价格 (元)</label>
              <input type="text" required x-model="form.price" placeholder="例如：19.90" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
            </div>
          </div>
        </div>

        <!-- 流量与有效期设定 -->

          <h3 class="text-sm font-semibold text-purple-400 mb-4 flex items-center"><i class="fa-solid fa-chart-simple mr-2"></i>流量与有效期设定</h3>

              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">流量 (GB)</label>
              <input type="number" required x-model.number="form.bandwidth" placeholder="例如：100" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">账户有效期天数 (expire，0代表不过期)</label>
              <input type="number" required x-model.number="form.expire" placeholder="例如：30" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">自动续订天数 (0为关闭)</label>
              <input type="number" required x-model.number="form.auto_renew" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">

            </div>
            <div class="flex items-center pt-6">
              <label class="flex items-center space-x-3 cursor-pointer">
                <input type="checkbox" x-model="form.auto_reset_bandwidth" class="rounded border-slate-800 text-purple-600 bg-slate-900 focus:ring-purple-500">
                <span class="text-xs text-slate-300 select-none">续费时自动重置用户流量为上面配置的流量值</span>
              </label>
            </div>
          </div>
        </div>

        <!-- 等级配置 -->
        <div class="border-b border-slate-800/60 pb-6">
          <h3 class="text-sm font-semibold text-purple-400 mb-4 flex items-center"><i class="fa-solid fa-crown mr-2"></i>会员等级与权益</h3>

            </div>
            <div>

              <input type="number" required x-model.number="form.reset" placeholder="0" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">重置流量为多少 G (reset_value)</label>
              <input type="number" required x-model.number="form.reset_value" placeholder="0" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
            </div>

        <!-- 限速与IP -->

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>

              <input type="number" required x-model.number="form.speedlimit" placeholder="0" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">IP 限制连接数 (0为无限制)</label>

            <span class="text-[10px] text-slate-500 mt-1 block">例：<code>check-全球节点分布;clear-快速客服响应</code>，减号左边为 icon 代号右边为文字，以分号隔开。</span>
          </div>
        </div>

        <div class="pt-2">
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="checkbox" x-model="form.status" class="rounded border-slate-800 text-purple-600 bg-slate-900 focus:ring-purple-500">
            <span class="text-xs text-slate-300 select-none">立即上架在售</span>
          </label>
        </div>

        <div class="pt-6 border-t border-slate-800 flex justify-end space-x-4">
          <a href="/admin/shops.html" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-850 px-6 py-3 rounded-xl text-xs font-semibold transition">取消</a>
          <button type="submit" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-6 py-3 rounded-xl text-xs font-semibold transition shadow-lg shadow-purple-600/20">保存商品套餐</button>
        </div>
      </form>
    </div>

  <script src="/assets/js/api.js"></script>
  <script>
    function adminShopEditPage() {
      return {
        shopId: null,
        form: {
          name: '',
          price: '',
          bandwidth: 0,
          expire: 0,
          auto_renew: 0,
          auto_reset_bandwidth: false,
          class: 0,
          class_expire: 0,
          reset_exp: 0,
          reset: 0,
          reset_value: 0,
          speedlimit: 0,
          connector: 0,
          content_extra: '',
          status: false
        },

        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          const id = urlParams.get('id');
          if (!id) {
            alert('缺少商品 ID，无法编辑！');
            window.location.replace('/admin/shops.html');
            return;
          }
          this.shopId = id;
          await this.fetchShopDetails();
        },

        async fetchShopDetails() {
          try {
            const res = await SPanelAPI.request(`/admin/shop/${this.shopId}`);
            const data = res.data;

            // Map basic fields
            this.form.name = data.name;
            this.form.price = data.price;
            this.form.auto_renew = data.auto_renew || 0;
            this.form.auto_reset_bandwidth = data.auto_reset_bandwidth === 1;
            this.form.status = data.status === 1;

            // Initialize default values for the JSON parameters
            this.form.bandwidth = 0;
            this.form.expire = 0;
            this.form.class = 0;
            this.form.class_expire = 0;
            this.form.reset_exp = 0;
            this.form.reset = 0;
            this.form.reset_value = 0;
            this.form.speedlimit = 0;
            this.form.connector = 0;
            this.form.content_extra = '';

            // Try parsing the JSON string inside content
            try {
              if (data.content) {
                const parsedContent = JSON.parse(data.content);
                if (typeof parsedContent === 'object' && parsedContent !== null) {
                  this.form.bandwidth = parsedContent.bandwidth || 0;
                  this.form.expire = parsedContent.expire || 0;
                  this.form.class = parsedContent.class || 0;
                  this.form.class_expire = parsedContent.class_expire || 0;
                  this.form.reset_exp = parsedContent.reset_exp || 0;
                  this.form.reset = parsedContent.reset || 0;
                  this.form.reset_value = parsedContent.reset_value || 0;
                  this.form.speedlimit = parsedContent.speedlimit || 0;
                  this.form.connector = parsedContent.connector || 0;
                  this.form.content_extra = parsedContent.content_extra || '';
                } else {
                  this.form.content_extra = data.content;
                }
              }
            } catch (jsonErr) {
              this.form.content_extra = data.content;
            }
          } catch (err) {
            alert('获取商品详情失败: ' + err.message);
            window.location.replace('/admin/shops.html');
          }
        },

        async submitForm() {
          try {
            const contentObj = {
              bandwidth: parseInt(this.form.bandwidth) || 0,
              expire: parseInt(this.form.expire) || 0,
              class: parseInt(this.form.class) || 0,
              class_expire: parseInt(this.form.class_expire) || 0,
              reset_exp: parseInt(this.form.reset_exp) || 0,
              reset: parseInt(this.form.reset) || 0,
              reset_value: parseInt(this.form.reset_value) || 0,
              speedlimit: parseInt(this.form.speedlimit) || 0,
              connector: parseInt(this.form.connector) || 0,
              content_extra: this.form.content_extra || ''
            };

            const payload = {
              name: this.form.name,
              price: this.form.price,
              content: JSON.stringify(contentObj),
              auto_renew: parseInt(this.form.auto_renew) || 0,
              auto_reset_bandwidth: this.form.auto_reset_bandwidth ? 1 : 0,
              status: this.form.status ? 1 : 0
            };

            await SPanelAPI.request(`/admin/shop/${this.shopId}`, {
              method: 'PUT',
              body: JSON.stringify(payload)
            });
            alert('商品套餐配置成功更新！');
            window.location.replace('/admin/shops.html');
          } catch (err) {
            alert('更新失败: ' + err.message);
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
