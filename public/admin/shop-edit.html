<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品编辑 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="shops" data-sp-active="shops" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading" x-text="isEdit ? '商品编辑 #' + (f.id||'') : '添加商品'"></h1></div>
    </div>
    <div class="sp-content-inner" x-data="shopFormPage()" x-init="init()">
      <form @submit.prevent="save()" x-show="loaded || !isEdit" x-cloak>
        <div class="sp-card sp-mb-6">
          <div class="sp-card-title"><i class="mi">shop</i>基本</div>
          <div class="sp-grid">
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">名称</label>
              <input class="sp-input" type="text" x-model="f.name">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">价格 (元)</label>
              <input class="sp-input" type="text" x-model="f.price">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">自动续费 (0=不续费 / N 天后续费)</label>
              <input class="sp-input" type="text" x-model.number="f.auto_renew">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">续费时重置流量 (0/1)</label>
              <select class="sp-select" x-model.number="f.auto_reset_bandwidth">
                <option value="0">不自动重置</option><option value="1">自动重置</option>
              </select>
            </div></div>
            <div class="sp-col-9"><div class="sp-form-row">
              <label class="sp-form-label">附加说明 (content_extra, 购买页展示)</label>
              <input class="sp-input" type="text" x-model="f.content_extra">
            </div></div>
          </div>
        </div>

        <div class="sp-card sp-mb-6">
          <div class="sp-card-title"><i class="mi">card_membership</i>内容效果 (留空/0 = 不生效)</div>
          <div class="sp-grid">
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">添加流量 (G)</label>
              <input class="sp-input" type="text" x-model="f.bandwidth">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">有效期 (天)</label>
              <input class="sp-input" type="text" x-model="f.expire">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">升级等级</label>
              <input class="sp-input" type="text" x-model="f.class">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">等级有效期 (天)</label>
              <input class="sp-input" type="text" x-model="f.class_expire">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">重置周期 (每 N 天)</label>
              <input class="sp-input" type="text" x-model="f.reset">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">每次重置流量 (G)</label>
              <input class="sp-input" type="text" x-model="f.reset_value">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">重置持续 (天)</label>
              <input class="sp-input" type="text" x-model="f.reset_exp">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">限速 (Mbps)</label>
              <input class="sp-input" type="text" x-model="f.speedlimit">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">连接数</label>
              <input class="sp-input" type="text" x-model="f.connector">
            </div></div>
          </div>
        </div>

        <div class="sp-mb-6">
          <button type="submit" class="sp-btn sp-btn-brand" :disabled="saving"><i class="mi">save</i>保存</button>
          <a class="sp-btn sp-btn-flat" href="/admin/shops.html">返回列表</a>
        </div>
      </form>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function shopFormPage() {
      const id = new URLSearchParams(location.search).get('id');
      return {
        isEdit: !!id, loaded: false, saving: false,
        f: { name:'', price:'', auto_renew:0, auto_reset_bandwidth:0, content_extra:'',
             bandwidth:0, expire:0, class:0, class_expire:0, reset:0, reset_value:0, reset_exp:0,
             speedlimit:0, connector:0 },
        init() {
          if (!this.isEdit) { this.loaded = true; return; }
          SPanelAPI.request('/api/v2/admin/shop/' + id)
            .then(res => { this.f = Object.assign({}, this.f, res.data); this.loaded = true; })
            .catch(e => SPUI.msg(e.message));
        },
        save() {
          this.saving = true;
          const num = k => parseFloat(this.f[k]) || 0;
          const p = Object.assign({}, this.f, {
            bandwidth: num('bandwidth'), expire: num('expire'), class: num('class'),
            class_expire: num('class_expire'), reset: num('reset'), reset_value: num('reset_value'),
            reset_exp: num('reset_exp'), speedlimit: num('speedlimit'), connector: num('connector'),
          });
          const req = this.isEdit
            ? SPanelAPI.request('/api/v2/admin/shop/' + this.f.id, { method: 'PUT', body: JSON.stringify(p) })
            : SPanelAPI.request('/api/v2/admin/shop', { method: 'POST', body: JSON.stringify(p) });
          req.then(res => { SPUI.toast(res.msg || '保存成功', 'success'); if (!this.isEdit) setTimeout(() => location.href = '/admin/shops.html', 600); })
            .catch(e => SPUI.msg(e.message))
            .finally(() => { this.saving = false; });
        }
      };
    }
  </script>
</body>
</html>
