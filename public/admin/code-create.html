<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成充值码 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="codes" data-sp-active="codes">
  <main class="sp-content">
    <div class="page-header d-print-none">
      <div class="row align-items-center">
        <div class="col">
          <h2 class="page-title">生成充值码</h2>
        </div>
      </div>
    </div>
    <div x-data="codeCreatePage()">
      <div class="card">
        <div class="card-header"><h3 class="card-title"><i class="mi me-2">qr_code</i>批量生成</h3></div>
        <div class="card-body">
          <div class="row">
            <div class="col-sm-6 col-xl-3"><div class="mb-3">
              <label class="form-label">生成数量 (个)</label>
              <input class="form-control" type="text" x-model="amount">
            </div></div>
            <div class="col-sm-6 col-xl-3"><div class="mb-3">
              <label class="form-label">面额 (元)</label>
              <input class="form-control" type="text" x-model="number">
            </div></div>
            <div class="col-sm-6 col-xl-3 d-flex align-items-end mb-3">
              <button class="btn btn-primary" @click="gen()" :disabled="saving"><i class="mi">add</i>生成</button>
            </div>
          </div>
          <p class="text-secondary small mb-0">码格式: 时间戳 + 8 位随机串 + 面额×100 (与旧版一致)</p>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function codeCreatePage() {
      return {
        amount: 10, number: 10, saving: false,
        gen() {
          this.saving = true;
          SPanelAPI.request('/api/v2/admin/code', {
            method: 'POST',
            body: JSON.stringify({ amount: parseInt(this.amount) || 0, number: parseFloat(this.number) || 0 })
          })
            .then(res => {
              SPUI.msg(res.msg || '生成成功', () => location.href = '/admin/codes.html');
            })
            .catch(e => SPUI.msg(e.message))
            .finally(() => { this.saving = false; });
        }
      };
    }
  </script>
</body>
</html>
