<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户列表 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="users" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">用户列表</h1></div>
    </div>
    <div class="sp-content-inner">
      <div class="sp-card sp-mb-6">
        系统中所有用户的列表。默认显示常用列, 可通过右上角「列显示」调整 (设置自动记忆)。
      </div>
      <div id="usersTable"></div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;" }[c];
      });
    }
    /* 联络方式映射 (PHP Admin\UserController::ajax 口径: 1微信 2QQ 3Google+ 默认 Telegram) */
    function imTypeName(t) { return t === 1 ? '微信' : t === 2 ? 'QQ' : t === 3 ? 'Google+' : 'Telegram'; }

    var tbl = AdminTable('#usersTable', {
      api: '/api/v2/admin/user',
      stateKey: 'adm:users',
      search: '搜索 ID/用户名/邮箱/联络方式/端口',
      defaultOrder: ['id', 'asc'],
      columns: [
        { key: 'id',                  title: 'ID', sortable: true },
        { key: 'user_name',           title: '用户名', sortable: true },
        { key: 'remark',              title: '备注', sortable: true, hide: true },
        { key: 'email',               title: '邮箱', sortable: true },
        { key: 'money',               title: '金钱', sortable: true, hide: true },
        { key: 'im_type',             title: '联络方式类型', sortable: true, hide: true,
          render: r => esc(imTypeName(r.im_type)) },
        { key: 'im_value',            title: '联络方式详情', sortable: true, hide: true,
          render: r => (r.im_type !== 1 && r.im_type !== 2 && r.im_type !== 3 && r.im_value)
            ? '<a href="https://telegram.me/' + esc(r.im_value) + '" target="_blank" rel="noopener">' + esc(r.im_value) + '</a>'
            : esc(r.im_value) },
        { key: 'node_group',          title: '群组', sortable: true, hide: true },
        { key: 'expire_in',           title: '账户过期时间', sortable: true, hide: true },
        { key: 'class',               title: '等级', sortable: true, hide: true },
        { key: 'class_expire',        title: '等级过期时间', sortable: true, hide: true },
        { key: 'passwd',              title: '连接密码', sortable: true, hide: true },
        { key: 'port',                title: '连接端口', sortable: true, hide: true },
        { key: 'method',              title: '加密方式', sortable: true, hide: true },
        { key: 'protocol',            title: '连接协议', sortable: true, hide: true },
        { key: 'obfs',                title: '连接混淆方式', sortable: true, hide: true },
        { key: 'online_ip_count',     title: '在线IP数', sortable: false, hide: true },
        { key: 'last_ss_time',        title: '上次使用时间', sortable: false, hide: true,
          render: r => r.last_ss_time ? esc(r.last_ss_time) : '<span class="sp-text-hint">从未使用</span>' },
        { key: 'used_traffic',        title: '已用流量', sortable: false, hide: true },
        { key: 'enable_traffic',      title: '总流量', sortable: false, hide: true },
        { key: 'last_checkin_time',   title: '上次签到时间', sortable: false, hide: true,
          render: r => r.last_checkin_time ? esc(r.last_checkin_time) : '<span class="sp-text-hint">从未签到</span>' },
        { key: 'today_traffic',       title: '今日流量', sortable: false, hide: true },
        { key: 'enable',              title: '是否启用', sortable: true, hide: true,
          render: r => r.enable === 1
            ? '<span class="sp-tag sp-tag-green">可用</span>'
            : '<span class="sp-tag sp-tag-red">禁用</span>' },
        { key: 'reg_date',            title: '注册时间', sortable: true, hide: true },
        { key: 'reg_ip',              title: '注册IP', sortable: true, hide: true },
        { key: 'auto_reset_day',      title: '自动重置流量日', sortable: true, hide: true },
        { key: 'auto_reset_bandwidth',title: '自动重置流量/GB', sortable: true, hide: true },
        { key: 'ref_by',              title: '邀请人ID', sortable: true, hide: true },
        { key: 'ref_by_user_name',    title: '邀请人用户名', sortable: false, hide: true },
        { key: 'top_up',              title: '累计充值', sortable: false, hide: true }
      ],
      ops: r =>
        '<a class="sp-btn sp-btn-sm" href="/admin/user-edit.html?id=' + r.id + '">编辑</a>' +
        '<button class="sp-btn sp-btn-sm" data-del="' + r.id + '" data-name="' + esc(r.user_name) + '">删除</button>' +
        '<button class="sp-btn sp-btn-sm" data-mask="' + r.id + '" data-name="' + esc(r.user_name) + '">切换用户</button>'
    });

    /* 行操作 (事件委托; 编辑/删除/切换用户 → v2 端点, 含幽灵保护与审计) */
    document.getElementById('usersTable').addEventListener('click', function (e) {
      var del = e.target.closest('[data-del]');
      var mask = e.target.closest('[data-mask]');
      if (del) {
        var uid = del.getAttribute('data-del');
        SPUI.confirm('确认要删除用户 <b>' + del.getAttribute('data-name') + '</b> (ID:' + uid + ')?<br>删除后无法恢复; 仍在服务中的用户会被拒绝删除 (幽灵账号保护)。', function () {
          SPanelAPI.request('/api/v2/admin/user/' + uid, { method: 'DELETE' })
            .then(res => { SPUI.toast(res.msg || '删除成功', 'success'); tbl.reload(); })
            .catch(err => SPUI.msg(err.message));
        }, { danger: true, okText: '删除' });
      } else if (mask) {
        var mid = mask.getAttribute('data-mask');
        SPUI.confirm('确认要切换为该用户 <b>' + mask.getAttribute('data-name') + '</b>?<br>将以该用户身份进入用户中心, 可通过「返回管理台」还原。', function () {
          SPanelAPI.request('/api/v2/admin/user/' + mid + '/masquerade', { method: 'POST' })
            .then(res => {
              localStorage.setItem('spanel_user', JSON.stringify({
                user_name: res.data.user_name, email: res.data.email, isAdmin: 0
              }));
              window.location.href = '/user/';
            })
            .catch(err => SPUI.msg(err.message));
        }, { okText: '切换' });
      }
    });
  </script>
</body>
</html>
