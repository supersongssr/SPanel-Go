<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节点列表 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="nodes" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">节点列表</h1></div>
    </div>
    <div class="sp-content-inner">
      <div class="sp-mb-6">
        <a class="sp-btn sp-btn-brand" href="/admin/node-create.html"><i class="mi">add</i>添加节点</a>
        <a class="sp-btn sp-btn-flat" href="/admin/node-ctl.html"><i class="mi">tune</i>节点调整</a>
      </div>
      <div id="nodeTable"></div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    var SORT_NAMES = { 0:'SS', 1:'VPN/Radius基础', 2:'SSH', 5:'Anyconnect', 9:'Sr-单多', 10:'Ss-中转', 11:'V2', 12:'CDN', 13:'Vl', 14:'Tr', 15:'Hy2' };
    function onoff(v) { return v === 1 ? '<span class="sp-tag sp-tag-green">启用</span>' : '<span class="sp-tag sp-tag-grey">关闭</span>'; }
    function nsColor(v) {
      if (v <= -900) return '<span class="sp-text-danger" title="IP异常哨兵"><b>' + v + '</b></span>';
      if (v <= -40) return '<span class="sp-text-danger" title="疑似故障, 建议介入"><b>' + v + '</b></span>';
      if (v < -9) return '<span style="color:#b8860b" title="很可能不能用"><b>' + v + '</b></span>';
      if (v >= 30) return '<span class="sp-text-success">' + v + '</span>';
      return esc(v);
    }
    var tbl = AdminTable('#nodeTable', {
      api: '/api/v2/admin/node',
      stateKey: 'adm:nodes',
      search: '搜索名称/配置/IP/信息',
      defaultOrder: ['id', 'asc'],
      columns: [
        { key: 'id',             title: 'ID', sortable: true },
        { key: 'name',           title: '名称', sortable: true },
        { key: 'type',           title: '显示', sortable: true, hide: true, render: r => r.type === 1 ? '显' : '隐' },
        { key: 'node_sort',      title: '健康分', sortable: true, render: r => nsColor(r.node_sort) },
        { key: 'sort',           title: '类型', sortable: true, hide: true, render: r => esc(SORT_NAMES[r.sort] || '?') },
        { key: 'status',         title: '状态', sortable: true },
        { key: 'server',         title: '节点配置', sortable: true, hide: true },
        { key: 'node_ip',        title: '节点IP', sortable: true, hide: true },
        { key: 'traffic_rate',   title: '倍率R', sortable: true },
        { key: 'node_cost',      title: '成本C', sortable: true, hide: true },
        { key: 'node_online',    title: '在线O', sortable: true, hide: true },
        { key: 'node_oncost',    title: '负载', sortable: true, hide: true },
        { key: 'node_group',     title: '组G', sortable: true, hide: true },
        { key: 'node_class',     title: '级L', sortable: true, hide: true },
        { key: 'node_speedlimit',title: '测速/Mbps', sortable: true, hide: true },
        { key: 'node_bandwidth', title: '带宽/Mbps', sortable: true, hide: true },
        { key: 'traffic_used',   title: '已用', sortable: true, hide: true },
        { key: 'traffic_limit',  title: '限制', sortable: true, hide: true },
        { key: 'info',           title: '节点信息', sortable: true },
        { key: 'traffic_reset_day', title: '流量重置日', sortable: true, hide: true },
        { key: 'node_heartbeat', title: '最后活跃', sortable: true, hide: true },
        { key: 'custom_method',  title: '自定义加密', sortable: true, hide: true, render: r => onoff(r.custom_method) },
        { key: 'custom_rss',     title: '订阅展示', sortable: true, hide: true, render: r => onoff(r.custom_rss) },
        { key: 'mu_only',        title: '单端口', sortable: true, hide: true, render: r => onoff(r.mu_only) },
      ],
      ops: r => (r.sort === 999
        ? '<button class="sp-btn sp-btn-sm" disabled>编辑</button>'
        : '<a class="sp-btn sp-btn-sm" href="/admin/node-edit.html?id=' + r.id + '">编辑</a>')
    });
  </script>
</body>
</html>
