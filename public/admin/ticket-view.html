<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工单详情 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="tickets" data-sp-active="tickets" x-data="ticketViewPage()">
  <main class="sp-content">
    <div class="page-header d-print-none">
      <div class="row align-items-center">
        <div class="col">
          <h2 class="page-title">工单 <span x-show="id" x-cloak>#<span x-text="id"></span></span></h2>
        </div>
      </div>
    </div>
    <div x-init="init()">
      <template x-if="!invalid && loaded">
        <div>
          <!-- 用户信息卡 -->
          <div class="card mb-3">
            <div class="card-header"><h3 class="card-title"><i class="mi me-2">account_box</i>发起人</h3></div>
            <div class="card-body">
              <div class="row">
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">ID</span><span class="text-break"><a :href="'/admin/user-edit.html?id=' + user.id" x-text="user.id"></a></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">用户名</span><span class="text-break" x-text="user.user_name"></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">邮箱</span><span class="text-break" x-text="user.email"></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">等级/群组</span><span class="text-break" x-text="user.class + ' / ' + user.node_group"></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">余额</span><span class="text-break" :class="parseFloat(user.money) < 0 ? 'text-danger' : ''" x-text="user.money + ' 元'"></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">状态</span><span class="text-break" x-text="user.enable === 1 ? '可用' : '禁用'"></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">等级有效期</span><span class="text-break" :class="user.class_expire && user.class_expire.indexOf('0000') === 0 ? 'text-danger' : ''" x-text="user.class_expire || '—'"></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">账号过期时间</span><span class="text-break" x-text="user.expire_in || '—'"></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">流量 (已用/总量)</span><span class="text-break"><span x-text="fmtGB(user.used_traffic)"></span> / <span x-text="fmtGB(user.transfer_enable)"></span> <span class="text-secondary" x-text="user.transfer_enable ? '(' + Math.min(100, (user.used_traffic / user.transfer_enable * 100).toFixed(1)) + '%)' : ''"></span></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">最后使用</span><span class="text-break" x-text="user.last_ss_time || '从未使用'"></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">备注</span><span class="text-break" x-text="user.remark || '—'"></span></div></div>
                <div class="col-sm-6 col-xl-3"><div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">操作</span><span><button class="btn btn-sm" @click="maskUser()" :disabled="submitting"><i class="mi">switch_account</i>切换为该用户</button></span></div></div>
              </div>
            </div>
          </div>

          <!-- 对话楼层 -->
          <div class="card mb-3">
            <div class="card-header"><h3 class="card-title"><i class="mi me-2">question_answer</i>对话</h3></div>
            <div class="card-body">
              <template x-for="t in tickets" :key="t.id">
                <div class="alert mb-2" :class="t.is_admin ? 'alert alert-info' : 'alert alert-success'">
                  <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
                    <b>
                      <i class="mi" style="font-size:16px" x-text="t.is_admin ? 'support_agent' : 'person'"></i>
                      <span x-text="t.is_admin ? '管理员' : '用户 #' + t.userid"></span>
                      <span class="text-secondary ms-2" x-text="t.datetime"></span>
                    </b>
                    <span class="text-secondary">#<span x-text="t.id"></span></span>
                  </div>
                  <div x-html="t.content" style="white-space:pre-wrap;word-break:break-word;margin-top:6px"></div>
                </div>
              </template>
            </div>
          </div>

          <!-- 回复 -->
          <div class="card mb-3">
            <div class="card-header"><h3 class="card-title"><i class="mi me-2">reply</i>处理</h3></div>
            <div class="card-body">
              <textarea class="form-control" rows="6" x-model="content" placeholder="回复内容 (markdown/纯文本)"></textarea>
              <div class="mt-2 d-flex flex-wrap gap-2">
                <button class="btn btn-primary" @click="submit('3')" :disabled="submitting"><i class="mi">send</i>回复并展示(邮件通知)</button>
                <button class="btn" @click="submit('1')" :disabled="submitting"><i class="mi">save</i>仅记录回复</button>
                <button class="btn" @click="submit('2')" :disabled="submitting"><i class="mi">skip_next</i>跳过</button>
                <button class="btn btn-danger" @click="submit('0')" :disabled="submitting"><i class="mi">close</i>关闭</button>
                <a class="btn" :href="nextId ? '/admin/ticket-view.html?id=' + nextId : '/admin/tickets.html'">
                  下一张 <i class="mi">arrow_forward</i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </template>
      <template x-if="invalid">
        <div class="alert alert-warning">
          <i class="mi">warning</i>
          <span>工单无效 (可能已被清理或发起人注销), 即将跳转下一张有效工单…</span>
        </div>
      </template>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function ticketViewPage() {
      return {
        loaded: false, invalid: false, submitting: false,
        id: new URLSearchParams(location.search).get('id') || '',
        tickets: [], user: {}, nextId: 0, content: '',
        fmtGB(b) { return ((b || 0) / 1073741824).toFixed(2) + ' GB'; },
        init() {
          if (!this.id) { SPUI.msg('缺少工单 ID'); return; }
          this.load();
        },
        load() {
          SPanelAPI.request('/api/v2/admin/ticket/' + this.id)
            .then(res => {
              if (res.data && res.data.invalid) {
                this.invalid = true;
                const nid = res.data.next_id;
                setTimeout(() => {
                  window.location.replace(nid ? '/admin/ticket-view.html?id=' + nid : '/admin/tickets.html');
                }, 1200);
                return;
              }
              this.tickets = res.data.tickets || [];
              this.user = res.data.user || {};
              this.nextId = res.data.next_id || 0;
              this.loaded = true;
            })
            .catch(e => SPUI.msg(e.message));
        },
        /* 切换为该用户 (PHP view.tpl changetouser; 后端 masquerade 会还原身份) */
        maskUser() {
          SPUI.confirm('确认切换为该用户 <b>' + (this.user.user_name || ('#' + this.user.id)) + '</b>?<br>将以该用户身份进入用户中心, 可通过「返回管理台」还原。', () => {
            SPanelAPI.request('/api/v2/admin/user/' + this.user.id + '/masquerade', { method: 'POST' })
              .then(res => {
                localStorage.setItem('spanel_user', JSON.stringify({
                  user_name: res.data.user_name, email: res.data.email, isAdmin: 0
                }));
                window.location.href = '/user/';
              })
              .catch(e => SPUI.msg(e.message));
          }, { okText: '切换' });
        },
        submit(status) {
          this.submitting = true;
          SPanelAPI.request('/api/v2/admin/ticket/' + this.id, {
            method: 'PUT',
            body: JSON.stringify({ content: this.content, status: status })
          })
            .then(res => {
              // res.nextid 由 SPanelAPI 归一化保留在顶层 (ret/msg/nextid 信封)
              const nid = res.nextid || res.data && res.data.nextid;
              SPUI.toast(res.msg || '提交成功', 'success');
              setTimeout(() => {
                if (status === '2' || status === '0') {
                  // 跳过/关闭 → 直接进队列下一张 (PHP 语义)
                  window.location.replace(nid ? '/admin/ticket-view.html?id=' + nid : '/admin/tickets.html');
                } else {
                  this.content = '';
                  this.load(); // 回复 → 刷新本单
                }
              }, 600);
            })
            .catch(e => {
              // PHP 语义: ret=0 但带 nextid (工单被清理/发起人注销) 也要继续推进队列
              const nid = e && e.data && e.data.nextid;
              if (nid) {
                SPUI.toast((e.message || '工单已失效') + '，继续下一张', 'error');
                setTimeout(() => {
                  window.location.replace('/admin/ticket-view.html?id=' + nid);
                }, 900);
                return;
              }
              SPUI.msg(e.message);
            })
            .finally(() => { this.submitting = false; });
        }
      };
    }
  </script>
</body>
</html>
