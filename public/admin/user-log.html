<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户操作记录 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="user-log">
  <main class="sp-content">
    <div class="page-header d-print-none">
      <div class="row align-items-center">
        <div class="col">
          <h2 class="page-title">用户操作记录</h2>
        </div>
      </div>
    </div>
    <!-- 过滤 (PHP user_log.tpl 过滤表单) -->
    <div class="card mb-3">
      <div class="card-header"><h3 class="card-title"><i class="mi me-2">filter_list</i>过滤</h3></div>
      <div class="card-body">
        <div class="row">
          <div class="col-sm-6 col-xl-3"><div class="mb-3">
            <label class="form-label">用户 ID</label>
            <input class="form-control" id="f-user" type="text" placeholder="user_id">
          </div></div>
          <div class="col-sm-6 col-xl-3"><div class="mb-3">
            <label class="form-label">操作者 ID</label>
            <input class="form-control" id="f-operator" type="text" placeholder="operator_id">
          </div></div>
          <div class="col-sm-6 col-xl-3"><div class="mb-3">
            <label class="form-label">级别</label>
            <select class="form-select" id="f-level">
              <option value="">全部</option>
              <option value="info">info</option>
              <option value="warning">warning</option>
              <option value="error">error</option>
            </select>
          </div></div>
          <div class="col-sm-6 col-xl-3"><div class="mb-3">
            <label class="form-label">分类</label>
            <select class="form-select" id="f-category">
              <option value="">全部</option>
              <option value="auth">auth</option><option value="profile">profile</option>
              <option value="security">security</option><option value="money">money</option>
              <option value="traffic">traffic</option><option value="ban">ban</option>
              <option value="admin">admin</option><option value="ticket">ticket</option>
              <option value="node">node</option>
            </select>
          </div></div>
          <div class="col-sm-6 col-xl-3"><div class="mb-3">
            <label class="form-label">开始日期</label>
            <input class="form-control" id="f-from" type="date">
          </div></div>
          <div class="col-sm-6 col-xl-3"><div class="mb-3">
            <label class="form-label">结束日期</label>
            <input class="form-control" id="f-to" type="date">
          </div></div>
          <div class="col-sm-6 col-xl-3 d-flex align-items-end">
            <button class="btn btn-primary btn-sm" id="f-apply"><i class="mi">search</i>应用过滤</button>
          </div>
        </div>
      </div>
    </div>
    <div id="logTable"></div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function levelTag(l) {
      const cls = l === 'error' ? 'bg-red-lt' : l === 'warning' ? 'bg-orange-lt' : 'bg-blue-lt';
      return '<span class="badge ' + cls + '">' + esc(l) + '</span>';
    }
    function fmtDetail(d) {
      if (!d) return '';
      try {
        const obj = JSON.parse(d);
        return '<details><summary class="link-primary cursor-pointer">diff</summary>' +
          '<pre class="small" style="white-space:pre-wrap;max-width:420px">' + esc(JSON.stringify(obj, null, 1)) + '</pre></details>';
      } catch (e) { return ''; }
    }

    /* URL 预填 (如 user-edit 页「查看操作记录」入口) */
    (function () {
      const p = new URLSearchParams(location.search);
      if (p.get('user_id')) document.getElementById('f-user').value = p.get('user_id');
    })();

    var tbl = AdminTable('#logTable', {
      api: '/api/v2/admin/user-log',
      stateKey: 'adm:user-log',
      pageSizes: [50, 100, 200, 0],
      search: '搜索摘要/动作/IP',
      defaultOrder: ['id', 'desc'],
      params: function () {
        return {
          user_id: document.getElementById('f-user').value.trim(),
          operator_id: document.getElementById('f-operator').value.trim(),
          level: document.getElementById('f-level').value,
          category: document.getElementById('f-category').value,
          from: document.getElementById('f-from').value,
          to: document.getElementById('f-to').value,
        };
      },
      columns: [
        { key: 'id',           title: 'ID', sortable: true },
        { key: 'created_at',   title: '时间', sortable: true },
        { key: 'level',        title: '级别', sortable: true, render: r => levelTag(r.level) },
        { key: 'category',     title: '分类', sortable: true },
        { key: 'action',       title: '动作', sortable: false },
        { key: 'message',      title: '摘要', sortable: false },
        { key: 'user_id',      title: '用户', sortable: true,
          render: r => r.user_id ? '<a href="/admin/user-edit.html?id=' + r.user_id + '">' + r.user_id + '</a>' +
            (r.user_name ? '<br><span class="text-secondary">' + esc(r.user_name) + '</span>' : '') : '—' },
        { key: 'operator_id',  title: '操作者', sortable: false,
          render: r => r.operator_id === 0 ? '系统' :
            (r.operator_id + (r.operator_name ? ' (' + esc(r.operator_name) + ')' : '')) +
            '<br><span class="text-secondary">' + ({0:'系统',1:'本人',2:'管理员',3:'API/节点'}[r.operator_type] || '') + '</span>' },
        { key: 'ip',           title: 'IP', sortable: false },
        { key: 'detail',       title: '详情', sortable: false, render: r => fmtDetail(r.detail) },
      ]
    });

    document.getElementById('f-apply').addEventListener('click', function () { tbl.reload(); });
  </script>
</body>
</html>
