<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充值与捐赠记录 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="codes">
  <main class="sp-content">
    <div class="page-header d-print-none">
      <div class="row align-items-center">
        <div class="col">
          <h2 class="page-title">充值与捐赠记录</h2>
        </div>
        <div class="col-auto ms-auto d-print-none d-flex gap-2 flex-wrap">
          <a class="btn btn-primary" href="/admin/code-create.html"><i class="mi">qr_code</i>生成充值码</a>
          <a class="btn" href="/admin/code-donate.html"><i class="mi">volunteer_activism</i>添加捐赠/支出</a>
        </div>
      </div>
    </div>
    <div id="codeTable"></div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    AdminTable('#codeTable', {
      api: '/api/v2/admin/code',
      stateKey: 'adm:codes',
      search: '搜索码/用户名/用户ID',
      defaultOrder: ['id', 'desc'],
      columns: [
        { key: 'id',     title: 'ID', sortable: true },
        { key: 'code',   title: '内容', sortable: true, tdClass: 'font-monospace' },
        { key: 'type',   title: '类型', sortable: true,
          render: r => r.type === -1 ? '<span class="badge bg-blue-lt">充值码</span>' :
            r.type === -2 ? '<span class="badge bg-orange-lt">捐赠/支出</span>' : '<span class="badge bg-secondary-lt">已废弃</span>' },
        { key: 'number', title: '金额', sortable: true,
          render: r => (r.type === -1 ? '充值 ' : r.type === -2 ? '支出 ' : '') + r.number + ' 元' },
        { key: 'isused', title: '是否已使用', sortable: true,
          render: r => r.isused === 1 ? '<span class="badge bg-green-lt">已使用</span>' : '<span class="badge bg-secondary-lt">未使用</span>' },
        { key: 'userid', title: '用户ID', sortable: true,
          render: r => r.userid === 0 ? '未使用' : '<a href="/admin/user-edit.html?id=' + r.userid + '">' + r.userid + '</a>' },
        { key: 'user_name', title: '用户名',
          render: r => r.userid === 0 || !r.user_name ? '<span class="text-secondary">未使用</span>' : r.user_name },
        { key: 'usedatetime', title: '使用时间', sortable: true,
          render: r => r.isused === 1 ? r.usedatetime : '<span class="text-secondary">未使用</span>' },
      ]
    });
  </script>
</body>
</html>
