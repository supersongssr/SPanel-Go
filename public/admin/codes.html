<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充值与捐赠记录 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="codes" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">充值与捐赠记录</h1></div>
    </div>
    <div class="sp-content-inner">
      <div class="sp-mb-6" style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="sp-btn sp-btn-brand" href="/admin/code-create.html"><i class="mi">barcode</i>生成充值码</a>
        <a class="sp-btn" href="/admin/code-donate.html"><i class="mi">volunteer_activism</i>添加捐赠/支出</a>
      </div>
      <div id="codeTable"></div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    AdminTable('#codeTable', {
      api: '/api/v2/admin/code',
      stateKey: 'adm:codes',
      search: '搜索码/用户名/用户ID',
      defaultOrder: ['id', 'desc'],
      columns: [
        { key: 'id',     title: 'ID', sortable: true },
        { key: 'code',   title: '内容', sortable: true, tdClass: 'sp-num' },
        { key: 'type',   title: '类型', sortable: true,
          render: r => r.type === -1 ? '<span class="sp-tag sp-tag-blue">充值码</span>' :
            r.type === -2 ? '<span class="sp-tag sp-tag-orange">捐赠/支出</span>' : '<span class="sp-tag sp-tag-grey">已废弃</span>' },
        { key: 'number', title: '金额', sortable: true,
          render: r => (r.type === -1 ? '充值 ' : r.type === -2 ? '支出 ' : '') + r.number + ' 元' },
        { key: 'isused', title: '是否已使用', sortable: true,
          render: r => r.isused === 1 ? '<span class="sp-tag sp-tag-green">已使用</span>' : '<span class="sp-tag sp-tag-grey">未使用</span>' },
        { key: 'userid', title: '用户ID', sortable: true,
          render: r => r.userid === 0 ? '未使用' : '<a href="/admin/user-edit.html?id=' + r.userid + '">' + r.userid + '</a>' },
        { key: 'user_name', title: '用户名',
          render: r => r.userid === 0 || !r.user_name ? '<span class="sp-text-hint">未使用</span>' : r.user_name },
        { key: 'usedatetime', title: '使用时间', sortable: true,
          render: r => r.isused === 1 ? r.usedatetime : '<span class="sp-text-hint">未使用</span>' },
      ]
    });
  </script>
</body>
</html>
