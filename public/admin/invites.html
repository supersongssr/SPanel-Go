<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邀请与返利 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="invites">
  <main class="sp-content">
    <div class="page-header d-print-none">
      <div class="row align-items-center">
        <div class="col">
          <h2 class="page-title">邀请与返利</h2>
        </div>
      </div>
    </div>
    <!-- 加邀请次数 (PHP invite.tpl 表单; 修 uid=0 崩溃: 空/0 明确报错) -->
    <div class="card mb-3" x-data="inviteAddPage()">
      <div class="card-header"><h3 class="card-title"><i class="mi me-2">loyalty</i>加邀请次数</h3></div>
      <div class="card-body">
        <div class="row align-items-end">
          <div class="col-sm-6 col-xl-4"><div class="mb-3">
            <label class="form-label">用户 ID 或邮箱</label>
            <input class="form-control" type="text" x-model="uid" placeholder="user_id / user@example.com">
          </div></div>
          <div class="col-sm-6 col-xl-3"><div class="mb-3">
            <label class="form-label">增加数量</label>
            <input class="form-control" type="text" x-model="num">
          </div></div>
          <div class="col-sm-6 col-xl-3">
            <button class="btn btn-primary" @click="add()" :disabled="saving"><i class="mi">add</i>添加</button>
          </div>
        </div>
      </div>
    </div>
    <div id="inviteTable"></div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    function inviteAddPage() {
      return {
        uid: '', num: 5, saving: false,
        add() {
          this.saving = true;
          SPanelAPI.request('/api/v2/admin/invite/add', {
            method: 'POST',
            body: JSON.stringify({ uid: this.uid.trim(), num: parseInt(this.num) || 0 })
          })
            .then(res => { SPUI.toast(res.msg || '添加成功', 'success'); this.uid = ''; })
            .catch(e => SPUI.msg(e.message))
            .finally(() => { this.saving = false; });
        }
      };
    }
    function fmtTs(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    AdminTable('#inviteTable', {
      api: '/api/v2/admin/invite',
      stateKey: 'adm:invites',
      search: '搜索用户名/ID',
      defaultOrder: ['id', 'desc'],
      columns: [
        { key: 'id',            title: 'ID', sortable: true },
        { key: 'total',         title: '订单金额', sortable: true },
        { key: 'event_user_id', title: '消费者', sortable: true,
          render: r => '<a href="/admin/user-edit.html?id=' + r.event_user_id + '">' + r.event_user_id + '</a>' +
            '<br><span class="text-secondary">' + r.event_user_name + '</span>' },
        { key: 'ref_user_id',   title: '返利获得者', sortable: true,
          render: r => '<a href="/admin/user-edit.html?id=' + r.ref_user_id + '">' + r.ref_user_id + '</a>' +
            '<br><span class="text-secondary">' + r.ref_user_name + '</span>' },
        { key: 'ref_get',       title: '返利金额', sortable: true },
        { key: 'datetime',      title: '时间', sortable: true, render: r => fmtTs(r.datetime) },
      ]
    });
  </script>
</body>
</html>
