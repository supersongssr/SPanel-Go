<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计规则编辑 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="detects" data-sp-active="detects">
  <main class="sp-content">
    <div x-data="detectFormPage()" x-init="init()">
      <div class="page-header d-print-none">
        <div class="row align-items-center">
          <div class="col">
            <h2 class="page-title" x-text="isEdit ? '规则编辑 #' + (f.id||'') : '添加审计规则'"></h2>
          </div>
        </div>
      </div>
      <div class="card" x-show="loaded || !isEdit">
        <div class="card-body">
          <div class="row">
            <div class="col-md-6"><div class="mb-3">
              <label class="form-label">名称</label>
              <input class="form-control" type="text" x-model="f.name">
            </div></div>
            <div class="col-md-6"><div class="mb-3">
              <label class="form-label">介绍</label>
              <input class="form-control" type="text" x-model="f.text">
            </div></div>
            <div class="col-md-8"><div class="mb-3">
              <label class="form-label">正则表达式</label>
              <input class="form-control" type="text" x-model="f.regex" placeholder="如 BitTorrent protocol">
            </div></div>
            <div class="col-sm-6 col-xl-4"><div class="mb-3">
              <label class="form-label">类型</label>
              <select class="form-select" x-model.number="f.type">
                <option value="1">数据包明文匹配</option>
                <option value="2">数据包 hex 匹配</option>
              </select>
            </div></div>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-2">
            <button class="btn btn-primary" @click="save()" :disabled="saving"><i class="mi">save</i>保存</button>
            <a class="btn" href="/admin/detects.html">返回列表</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function detectFormPage() {
      const id = new URLSearchParams(location.search).get('id');
      return {
        isEdit: !!id, loaded: false, saving: false,
        f: { name: '', text: '', regex: '', type: 1 },
        init() {
          if (!this.isEdit) { this.loaded = true; return; }
          SPanelAPI.request('/api/v2/admin/detect/' + id)
            .then(res => { this.f = Object.assign({}, this.f, res.data); this.loaded = true; })
            .catch(e => SPUI.msg(e.message));
        },
        save() {
          this.saving = true;
          const req = this.isEdit
            ? SPanelAPI.request('/api/v2/admin/detect/' + this.f.id, { method: 'PUT', body: JSON.stringify(this.f) })
            : SPanelAPI.request('/api/v2/admin/detect', { method: 'POST', body: JSON.stringify(this.f) });
          req.then(res => { SPUI.toast(res.msg || '保存成功', 'success'); if (!this.isEdit) setTimeout(() => location.href = '/admin/detects.html', 600); })
            .catch(e => SPUI.msg(e.message))
            .finally(() => { this.saving = false; });
        }
      };
    }
  </script>
</body>
</html>
