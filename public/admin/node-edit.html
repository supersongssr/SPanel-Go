<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节点编辑 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="nodes" data-sp-active="nodes" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading" x-text="isEdit ? '节点编辑 #' + (f.id||'') : '添加节点'"></h1></div>
    </div>
    <div class="sp-content-inner" x-data="nodeFormPage()" x-init="init()">
      <form @submit.prevent="save()" x-show="loaded || !isEdit" x-cloak>
        <div class="sp-card sp-mb-6">
          <div class="sp-card-title"><i class="mi">router</i>基本</div>
          <div class="sp-grid">
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">名称</label>
              <input class="sp-input" type="text" x-model="f.name">
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">节点配置 (地址[:端口])</label>
              <input class="sp-input" type="text" x-model="f.server">
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">节点 IP (留空 = 同节点配置)</label>
              <input class="sp-input" type="text" x-model="f.node_ip" placeholder="留空自动取 server">
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">加密方式</label>
              <input class="sp-input" type="text" x-model="f.method">
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">类型 (协议)</label>
              <select class="sp-select" x-model.number="f.sort">
                <option value="0">SS</option><option value="1">VPN/Radius基础</option>
                <option value="2">SSH</option><option value="5">Anyconnect</option>
                <option value="9">Sr-单多</option><option value="10">Ss-中转</option>
                <option value="11">V2</option><option value="12">CDN</option>
                <option value="13">Vl (VLESS)</option><option value="14">Tr (Trojan)</option>
                <option value="15">Hy2 (Hysteria2)</option>
              </select>
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">状态 (表现备注)</label>
              <input class="sp-input" type="text" x-model="f.status">
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">显示 (1 显示 / 0 不显示)</label>
              <select class="sp-select" x-model.number="f.type">
                <option value="1">显示</option><option value="0">不显示</option>
              </select>
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">节点信息 (订阅页展示)</label>
              <input class="sp-input" type="text" x-model="f.info">
            </div></div>
          </div>
        </div>

        <div class="sp-card sp-mb-6">
          <div class="sp-card-title"><i class="mi">tune</i>参数</div>
          <div class="sp-grid">
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">流量倍率 R</label>
              <input class="sp-input" type="text" x-model="f.rate">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">成本 C</label>
              <input class="sp-input" type="text" x-model.number="f.cost">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">群组 G</label>
              <input class="sp-input" type="text" x-model.number="f.group">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">等级 L</label>
              <input class="sp-input" type="text" x-model.number="f.class">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">标称带宽 Mbps</label>
              <input class="sp-input" type="text" x-model="f.node_bandwidth">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">月流量限额 GB</label>
              <input class="sp-input" type="text" x-model="f.node_bandwidth_limit">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">流量重置日 (几号)</label>
              <input class="sp-input" type="text" x-model.number="f.traffic_reset_day">
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">自定义加密 (0/1)</label>
              <select class="sp-select" x-model.number="f.custom_method">
                <option value="0">关闭</option><option value="1">启用</option>
              </select>
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">订阅展示 (0/1)</label>
              <select class="sp-select" x-model.number="f.custom_rss">
                <option value="1">启用</option><option value="0">关闭</option>
              </select>
            </div></div>
            <div class="sp-col-3"><div class="sp-form-row">
              <label class="sp-form-label">单端口 (0/1)</label>
              <select class="sp-select" x-model.number="f.mu_only">
                <option value="-1">只启用普通端口</option>
                <option value="0">普通端口与单端口并存</option>
                <option value="1">只启用单端口多用户</option>
              </select>
            </div></div>
          </div>
        </div>

        <template x-if="isEdit">
          <div class="sp-card sp-mb-6">
            <div class="sp-card-title"><i class="mi">analytics</i>遥测 (旧版编辑页数据条)</div>
            <div class="sp-grid">
              <div class="sp-col-3"><div class="sp-dl-row"><dt>克隆属性</dt><dd>
                <template x-if="f.is_clone > 0"><a :href="'/admin/node-edit.html?id=' + f.is_clone" title="跳转到主节点" style="text-decoration:underline">克隆 (主节点 #' + f.is_clone + ', 点击跳转)</a></template>
                <template x-if="!(f.is_clone > 0)"><span>否 (真实节点)</span></template>
              </dd></div></div>
              <div class="sp-col-3"><div class="sp-dl-row"><dt>已用/剩余流量</dt><dd x-text="(f.traffic_used_gb||0).toFixed(2) + ' / ' + (f.traffic_left_gb||0).toFixed(2) + ' GB'"></dd></div></div>
              <div class="sp-col-3"><div class="sp-dl-row"><dt>API Token</dt><dd><input class="sp-input sp-num" type="text" :value="f.api_token || '—'" readonly title="只读, 点击全选后可复制" @click="$el.select()" style="max-width:220px"></dd></div></div>
              <div class="sp-col-3"><div class="sp-dl-row"><dt>运行天数</dt><dd x-text="(f.server_uptime_days||0).toFixed(1) + ' 天'"></dd></div></div>
            </div>
          </div>
        </template>

        <template x-if="isEdit">
          <div class="sp-card sp-mb-6">
            <div class="sp-card-title"><i class="mi">speed</i>运行数据 (编辑专属)</div>
            <div class="sp-grid">
              <div class="sp-col-3"><div class="sp-form-row">
                <label class="sp-form-label">健康分 node_sort</label>
                <input class="sp-input" type="text" x-model.number="f.node_sort">
              </div></div>
              <div class="sp-col-3"><div class="sp-form-row">
                <label class="sp-form-label">流量校准 GB (覆盖已用)</label>
                <input class="sp-input" type="text" x-model="f.traffic_used_calibrate" :placeholder="'当前 ' + (f.traffic_used_gb||0).toFixed(2) + ' GB'">
              </div></div>
              <div class="sp-col-3"><div class="sp-form-row">
                <label class="sp-form-label">运行天数校准 (天)</label>
                <input class="sp-input" type="text" x-model="f.server_uptime_days" :placeholder="'当前 ' + (f.server_uptime_days||0).toFixed(1) + ' 天'">
              </div></div>
              <div class="sp-col-3"><div class="sp-form-row">
                <label class="sp-form-label">心跳</label>
                <input class="sp-input" type="text" :value="(f.heartbeat_ok ? '● 在线' : '○ 无心跳') + ' (' + (f.node_heartbeat||0) + ')'" readonly>
              </div></div>
            </div>
          </div>
        </template>

        <div class="sp-mb-6" style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="submit" class="sp-btn sp-btn-brand" :disabled="saving"><i class="mi">save</i>保存</button>
          <a class="sp-btn sp-btn-flat" href="/admin/nodes.html">返回列表</a>
          <button type="button" class="sp-btn sp-btn-danger sp-pull-right" x-show="isEdit && f.sort !== 999" x-cloak @click="del()"><i class="mi">delete</i>删除节点</button>
        </div>
      </form>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function nodeFormPage() {
      const id = new URLSearchParams(location.search).get('id');
      return {
        isEdit: !!id, loaded: false, saving: false,
        /* 新建默认值对齐旧版 create.tpl: method/status/info/custom_method/mu_only */
        f: { name:'', server:'', node_ip:'', method:'aes-256-cfb', sort:0, status:'可用', type:1, info:'无描述',
             rate:1, cost:0, group:0, class:0, node_bandwidth:'0', node_bandwidth_limit:0,
             traffic_reset_day:0, custom_method:1, custom_rss:1, mu_only:-1,
             node_sort:0, traffic_used_calibrate:'', server_uptime_days:'' },
        init() {
          if (!this.isEdit) { this.loaded = true; return; }
          SPanelAPI.request('/api/v2/admin/node/' + id)
            .then(res => {
              const d = res.data;
              d.traffic_used_calibrate = '';
              d.server_uptime_days = '';
              this.f = Object.assign({}, this.f, d);
              this.loaded = true;
            })
            .catch(e => SPUI.msg(e.message));
        },
        save() {
          this.saving = true;
          const p = Object.assign({}, this.f, {
            rate: parseFloat(this.f.rate) || 0,
            node_bandwidth_limit: parseFloat(this.f.node_bandwidth_limit) || 0,
            traffic_used_calibrate: this.f.traffic_used_calibrate === '' ? null : parseFloat(this.f.traffic_used_calibrate),
            server_uptime_days: this.f.server_uptime_days === '' ? null : parseFloat(this.f.server_uptime_days),
          });
          const req = this.isEdit
            ? SPanelAPI.request('/api/v2/admin/node/' + this.f.id, { method: 'PUT', body: JSON.stringify(p) })
            : SPanelAPI.request('/api/v2/admin/node', { method: 'POST', body: JSON.stringify(p) });
          req.then(res => { SPUI.toast(res.msg || '保存成功', 'success'); if (!this.isEdit) setTimeout(() => location.href = '/admin/nodes.html', 600); })
            .catch(e => SPUI.msg(e.message))
            .finally(() => { this.saving = false; });
        },
        del() {
          SPUI.confirm('确认删除节点 <b>' + this.f.name + '</b>?<br>将全量级联清理 DNS/中转/日志/克隆节点, 不可恢复。', () => {
            SPanelAPI.request('/api/v2/admin/node/' + this.f.id, { method: 'DELETE' })
              .then(res => { SPUI.toast(res.msg || '删除成功', 'success'); setTimeout(() => location.href = '/admin/nodes.html', 600); })
              .catch(e => SPUI.msg(e.message));
          }, { danger: true, okText: '删除' });
        }
      };
    }
  </script>
</body>
</html>
