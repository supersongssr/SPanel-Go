<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>添加用户 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="users" data-sp-active="users" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container">
        <h1 class="sp-content-heading">
          添加用户
          <a class="sp-btn sp-btn-sm sp-btn-flat" style="margin-left:10px;vertical-align:middle" href="/admin/users.html">返回用户列表</a>
        </h1>
      </div>
    </div>
    <div class="sp-content-inner" x-data="userCreatePage()">
      <form @submit.prevent="save()">
        <!-- 账户 -->
        <div class="sp-card sp-mb-6">
          <div class="sp-card-title"><i class="mi">person_add</i>账户</div>
          <div class="sp-grid">
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">用户名</label>
              <input class="sp-input" type="text" x-model="f.user_name" required>
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">邮箱 (唯一登录账号)</label>
              <input class="sp-input" type="email" x-model="f.email" required>
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">密码</label>
              <input class="sp-input" type="password" autocomplete="new-password" x-model="f.password" required>
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">金钱 (元)</label>
              <input class="sp-input" type="text" x-model="f.money" placeholder="0.00">
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">可用流量 (GB, 默认 100)</label>
              <input class="sp-input" type="text" x-model.number="f.transfer_gb">
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">管理员身份</label>
              <label class="sp-switch"><input type="checkbox" x-model="f.is_admin" :true-value="1" :false-value="0"><i></i></label>
            </div></div>
          </div>
        </div>

        <!-- 分组 / 等级 (PHP edit.tpl 口径) -->
        <div class="sp-card sp-mb-6">
          <div class="sp-card-title"><i class="mi">layers</i>分组与等级</div>
          <div class="sp-grid">
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">节点分组</label>
              <input class="sp-input" type="text" x-model.number="f.node_group">
              <p class="sp-text-hint">用户只能访问到组别等于这个数字或 0 的节点</p>
            </div></div>
            <div class="sp-col-6"><div class="sp-form-row">
              <label class="sp-form-label">等级</label>
              <input class="sp-input" type="text" x-model.number="f.class">
              <p class="sp-text-hint">用户只能访问到等级小于等于这个数字的节点</p>
            </div></div>
          </div>
        </div>

        <div style="display:flex;gap:10px">
          <button class="sp-btn sp-btn-brand" type="submit" :disabled="saving"><i class="mi">check</i>确认添加</button>
          <a class="sp-btn" href="/admin/users.html">取消</a>
        </div>
      </form>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function userCreatePage() {
      return {
        f: { user_name: '', email: '', password: '', money: '0.00', transfer_gb: 100, class: 0, node_group: 0, is_admin: 0 },
        saving: false,
        save() {
          if (!this.f.user_name.trim() || !this.f.email.trim() || !this.f.password) {
            SPUI.msg('请填写用户名 / 邮箱 / 密码');
            return;
          }
          this.saving = true;
          SPanelAPI.request('/api/v1/admin/user', {
            method: 'POST',
            body: JSON.stringify({
              user_name: this.f.user_name.trim(),
              email: this.f.email.trim(),
              password: this.f.password,
              money: String(this.f.money || '0.00'),
              transfer_enable: Math.round((parseFloat(this.f.transfer_gb) || 0) * 1024 * 1024 * 1024), // GB → bytes
              class: parseInt(this.f.class) || 0,
              node_group: parseInt(this.f.node_group) || 0,
              is_admin: this.f.is_admin === 1 ? 1 : 0 // v1 契约为 int, 勿传 bool
            })
          })
            .then(res => {
              SPUI.msg((res.msg || '用户创建成功') + '<br>连接密码 / 端口已自动分配, 请在用户编辑页查看。', function () {
                location.href = '/admin/users.html';
              });
            })
            .catch(e => SPUI.msg(e.message))
            .finally(() => { this.saving = false; });
        }
      };
    }
  </script>
</body>
</html>
