<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订阅请求记录 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="rss-headers">
  <main class="sp-content">
    <div class="page-header d-print-none">
      <div class="row align-items-center">
        <div class="col">
          <h2 class="page-title">订阅请求记录</h2>
        </div>
      </div>
    </div>
    <!-- 过滤 + 轮询 + 清空 (PHP rss_headers.tpl: ?user_id=&q= + 5s 自动刷新 + clear) -->
    <div class="card mb-3" x-data="{ polling: false, timer: null }"
         x-init="timer = setInterval(() => { if (polling && window.__rssTbl) window.__rssTbl.reload(); }, 5000)">
      <div class="card-body">
        <div class="row align-items-end">
          <div class="col-sm-6 col-xl-3"><div class="mb-3">
            <label class="form-label">用户 ID</label>
            <input class="form-control" id="f-user" type="text" placeholder="user_id">
          </div></div>
          <div class="col-sm-6 col-xl-3">
            <button class="btn btn-primary btn-sm" id="f-apply"><i class="mi">search</i>应用</button>
          </div>
          <div class="col-sm-6 col-xl-3">
            <label class="form-check">
              <input class="form-check-input" type="checkbox" x-model="polling">
              <span class="form-check-label">5s 自动刷新</span>
            </label>
          </div>
          <div class="col-sm-6 col-xl-3 text-end">
            <button class="btn btn-danger btn-sm" id="f-clear"><i class="mi">delete_sweep</i>清空记录</button>
          </div>
        </div>
        <p class="text-secondary small mb-0">采集开关: config.yaml rss_header_capture.enabled (当前采集 /link/:token 订阅请求)。</p>
      </div>
    </div>
    <div id="rssTable"></div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    (function () {
      const p = new URLSearchParams(location.search);
      if (p.get('user_id')) document.getElementById('f-user').value = p.get('user_id');
    })();
    window.__rssTbl = AdminTable('#rssTable', {
      api: '/api/v2/admin/rss-headers',
      stateKey: 'adm:rss-headers',
      pageSizes: [25, 50, 100, 0],
      search: '搜索邮箱/UA/链接/app/token',
      defaultOrder: ['id', 'desc'],
      params: function () {
        const uid = document.getElementById('f-user').value.trim();
        return uid ? { user_id: uid } : {};
      },
      columns: [
        { key: 'id',         title: 'ID', sortable: true },
        { key: 'created_at', title: '时间', sortable: true },
        { key: 'user_id',    title: '用户', sortable: true,
          render: r => (r.user_id
            ? '<a href="/admin/user-edit.html?id=' + r.user_id + '">' + r.user_id + '</a><br><span class="text-secondary">' + (r.email || '') + '</span>'
            : '匿名') },
        { key: 'app',        title: '客户端', sortable: false, render: r => r.app || '<span class="text-secondary">unknown</span>' },
        { key: 'ip',         title: 'IP', sortable: false, tdClass: 'font-monospace' },
        { key: 'uri',        title: '请求链接', sortable: false },
        { key: 'user_agent', title: 'UA', sortable: false, tdClass: 'text-wrap' },
      ],
      ops: r => '<a class="btn btn-sm" href="/admin/rss-header-view.html?id=' + r.id + '">详情</a>'
    });
    document.getElementById('f-apply').addEventListener('click', function () { window.__rssTbl.reload(); });
    document.getElementById('f-clear').addEventListener('click', function () {
      SPUI.confirm('确认清空全部订阅抓取记录?', function () {
        SPanelAPI.request('/api/v2/admin/rss-headers/clear', { method: 'POST' })
          .then(res => { SPUI.toast(res.msg || '已清空', 'success'); window.__rssTbl.reload(); })
          .catch(e => SPUI.msg(e.message));
      }, { danger: true, okText: '清空' });
    });
  </script>
</body>
</html>
