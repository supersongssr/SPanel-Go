<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告管理 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="announcements" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">公告管理</h1></div>
    </div>
    <div class="sp-content-inner">
      <div class="sp-mb-6">
        <a class="sp-btn sp-btn-brand" href="/admin/announcement-edit.html"><i class="mi">add</i>发布公告</a>
      </div>
      <div id="annTable"></div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    var tbl = AdminTable('#annTable', {
      api: '/api/v2/admin/announcement',
      stateKey: 'adm:anns',
      search: '搜索公告内容',
      defaultOrder: ['id', 'desc'],
      columns: [
        { key: 'id',    title: 'ID', sortable: true },
        { key: 'date',  title: '时间', sortable: true },
        { key: 'markdown', title: '内容 (markdown)', sortable: false, render: r => {
          const t = (r.markdown || r.content || '').replace(/<[^>]+>/g, '').slice(0, 80);
          return t;
        } },
      ],
      ops: r =>
        '<a class="sp-btn sp-btn-sm" href="/admin/announcement-edit.html?id=' + r.id + '">编辑</a>' +
        '<button class="sp-btn sp-btn-sm sp-btn-danger" data-del="' + r.id + '">删除</button>'
    });
    document.getElementById('annTable').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-del]');
      if (!btn) return;
      SPUI.confirm('确认删除该公告?', function () {
        SPanelAPI.request('/api/v2/admin/announcement/' + btn.getAttribute('data-del'), { method: 'DELETE' })
          .then(res => { SPUI.toast(res.msg || '删除成功', 'success'); tbl.reload(); })
          .catch(err => SPUI.msg(err.message));
      }, { danger: true, okText: '删除' });
    });
  </script>
</body>
</html>
