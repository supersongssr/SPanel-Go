<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线IP - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="audit-alive" class="sp-admin">
  <main class="sp-content">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">在线IP</h1></div>
    </div>
    <div class="sp-content-inner">
      <div id="aliveTable"></div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script src="/assets/js/admin-table.js"></script>
  <script>
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmtTs(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    AdminTable('#aliveTable', {
      api: '/api/v2/admin/audit/alive',
      stateKey: 'adm:audit-alive',
      search: '搜索 IP/用户/节点',
      defaultOrder: ['id', 'desc'],
      columns: [
        { key: 'id',        title: 'ID', sortable: true },
        { key: 'userid',    title: '用户', sortable: true,
          render: r => '<a href="/admin/user-edit.html?id=' + r.userid + '">' + r.userid + '</a><br><span class="sp-text-hint">' + esc(r.user_name) + '</span>' },
        { key: 'nodeid',    title: '节点', sortable: true,
          render: r => r.nodeid ? (esc(r.node_name || ('#' + r.nodeid))) : '—' },
        { key: 'ip',        title: 'IP', tdClass: 'sp-num' },
        { key: 'datetime',  title: '时间', sortable: true, render: r => fmtTs(r.datetime) },
        { key: 'is_node',   title: '是否为中转连接',
          render: r => r.is_node ? '<span class="sp-tag sp-tag-orange">是</span>' : '否' },
      ]
    });
  </script>
</body>
</html>
