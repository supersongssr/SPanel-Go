<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户编辑 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="users" data-sp-active="users">
  <main class="sp-content">
    <div x-data="userEditPage()" x-init="init()">
      <div class="page-header d-print-none">
        <div class="row align-items-center">
          <div class="col">
            <h2 class="page-title">用户编辑 <span x-show="f.id" x-cloak>#<span x-text="f.id"></span></span></h2>
          </div>
          <div class="col-auto ms-auto d-print-none">
            <a class="btn btn-sm" x-show="f.id" x-cloak
               :href="'/admin/user-log.html?user_id=' + f.id">查看操作记录</a>
          </div>
        </div>
      </div>
      <!-- 页头统计 (PHP edit.tpl 裸统计, 卡片化) -->
      <div class="card mb-3" x-show="loaded" x-cloak>
        <div class="card-body">
          <div class="row">
            <div class="col-md-4">
              <div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">订阅计数(今/昨)</span><span class="text-break" x-text="(f.rss_count||0) + ' / ' + (f.rss_count_lastday||0)"></span></div>
              <div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">订阅IP数(今/昨)</span><span class="text-break" x-text="(f.rss_ips_count||0) + ' / ' + (f.rss_ips_lastday||0)"></span></div>
              <div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">最近订阅IP</span><span class="text-break" x-text="f.rss_ip || '—'"></span></div>
            </div>
            <div class="col-md-4">
              <div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">t (最近上报)</span><span class="text-break" x-text="f.t || 0"></span></div>
              <div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">u / d (bytes)</span><span class="text-break" x-text="(f.u||0) + ' / ' + (f.d||0)"></span></div>
              <div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">last_day_t (昨日)</span><span class="text-break" x-text="f.last_day_t || 0"></span></div>
            </div>
            <div class="col-md-4">
              <div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">累计充值</span><span class="text-break" x-text="f.top_up ?? '—'"></span></div>
              <div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">UUID</span><span class="text-break" style="max-width:220px" x-text="f.v2ray_uuid || '—'"></span></div>
              <div class="mb-1 d-flex justify-content-between gap-3"><span class="text-secondary">积分 / 违规 / 禁用文案</span><span class="text-break" x-text="(f.score??0) + ' / ' + (f.ban_times??0) + ' / ' + (f.warming||'—')"></span></div>
            </div>
          </div>
        </div>
      </div>

      <template x-if="loaded">
        <form @submit.prevent="save()">
          <!-- 账户 -->
          <div class="card mb-3">
            <div class="card-header"><h3 class="card-title"><i class="mi me-2">account_box</i>账户</h3></div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">邮箱</label>
                  <input class="form-control" type="text" x-model="f.email">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">备注 (仅对管理员可见)</label>
                  <input class="form-control" type="text" x-model="f.remark">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">密码 (不修改请留空)</label>
                  <input class="form-control" type="password" autocomplete="new-password" x-model="f.pass" placeholder="留空则不修改">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">金钱</label>
                  <input class="form-control" type="text" x-model="f.money">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">用户启用</label>
                  <label class="form-check form-switch"><input class="form-check-input" type="checkbox" x-model="f.enable" :value="1" :true-value="1" :false-value="0"></label>
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">是否开启二次验证</label>
                  <label class="form-check form-switch"><input class="form-check-input" type="checkbox" x-model="f.ga_enable" :value="1" :true-value="1" :false-value="0"></label>
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">单端口多用户承载端口</label>
                  <select class="form-select" x-model.number="f.is_multi_user">
                    <option value="0">非单端口多用户承载端口</option>
                    <option value="1">混淆式单端口多用户承载端口</option>
                    <option value="2">协议式单端口多用户承载端口</option>
                  </select>
                </div></div>
              </div>
            </div>
          </div>

          <!-- 连接 -->
          <div class="card mb-3">
            <div class="card-header"><h3 class="card-title"><i class="mi me-2">vpn_key</i>连接</h3></div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">连接端口</label>
                  <input class="form-control" type="text" x-model="f.port">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">连接密码</label>
                  <input class="form-control" type="text" x-model="f.passwd">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">自定义加密</label>
                  <input class="form-control" type="text" x-model="f.method">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">自定义协议</label>
                  <input class="form-control" type="text" x-model="f.protocol">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">自定义协议参数</label>
                  <input class="form-control" type="text" x-model="f.protocol_param">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">自定义混淆方式</label>
                  <input class="form-control" type="text" x-model="f.obfs">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">自定义混淆参数</label>
                  <input class="form-control" type="text" x-model="f.obfs_param">
                </div></div>
              </div>
            </div>
          </div>

          <!-- 流量 -->
          <div class="card mb-3">
            <div class="card-header"><h3 class="card-title"><i class="mi me-2">data_usage</i>流量</h3></div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">总流量 (GB)</label>
                  <input class="form-control" type="text" x-model="f.transfer_enable_gb">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">已用流量 (只读)</label>
                  <input class="form-control" type="text" :value="usedTrafficText" readonly>
                  <p class="text-secondary small mt-1 mb-0">U: <span x-text="(f.u/1e9).toFixed(2)"></span>GB · D: <span x-text="(f.d/1e9).toFixed(2)"></span>GB · Limit: <span x-text="((f.transfer_limit||0)/1e9).toFixed(2)"></span></p>
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">流量限制 (bytes, 周期下行配额)</label>
                  <input class="form-control" type="text" x-model="f.transfer_limit">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">自动重置流量日 (几号, 0=不重置)</label>
                  <input class="form-control" type="text" x-model="f.auto_reset_day">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">重置流量值 (GB)</label>
                  <input class="form-control" type="text" x-model="f.auto_reset_bandwidth">
                </div></div>
              </div>
            </div>
          </div>

          <!-- 邀请与等级 -->
          <div class="card mb-3">
            <div class="card-header"><h3 class="card-title"><i class="mi me-2">loyalty</i>邀请与等级</h3></div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">可用邀请数量</label>
                  <input class="form-control" type="text" x-model="f.invite_num">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">邀请人 ID</label>
                  <input class="form-control" type="text" x-model="f.ref_by">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">用户群组</label>
                  <input class="form-control" type="text" x-model="f.node_group">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">用户级别</label>
                  <input class="form-control" type="text" x-model="f.class">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">用户等级过期时间</label>
                  <input class="form-control" type="text" placeholder="2026-01-01 00:00:00" x-model="f.class_expire">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">用户账户过期时间</label>
                  <input class="form-control" type="text" placeholder="2026-01-01 00:00:00" x-model="f.expire_in">
                </div></div>
              </div>
            </div>
          </div>

          <!-- 限制 -->
          <div class="card mb-3">
            <div class="card-header"><h3 class="card-title"><i class="mi me-2">speed</i>限制</h3></div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">用户限速 (Mbps, 每个节点)</label>
                  <input class="form-control" type="text" x-model="f.node_speedlimit">
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">用户同时连接 IP 数</label>
                  <input class="form-control" type="text" x-model="f.node_connector">
                </div></div>
              </div>
            </div>
          </div>

          <!-- 禁访 -->
          <div class="card mb-3">
            <div class="card-header"><h3 class="card-title"><i class="mi me-2">block</i>访问限制</h3></div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">禁止用户访问的 IP (一行一个)</label>
                  <textarea class="form-control" rows="4" x-model="f.forbidden_ip" placeholder="1.2.3.4&#10;5.6.7.8"></textarea>
                </div></div>
                <div class="col-md-6"><div class="mb-3">
                  <label class="form-label">禁止用户访问的端口 (一行一个)</label>
                  <textarea class="form-control" rows="4" x-model="f.forbidden_port" placeholder="25&#10;465"></textarea>
                </div></div>
              </div>
            </div>
          </div>

          <div class="d-flex flex-wrap gap-2 mb-3">
            <button type="submit" class="btn btn-primary" :disabled="saving"><i class="mi">save</i>保存修改</button>
            <a class="btn" href="/admin/users.html">返回列表</a>
          </div>
        </form>
      </template>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function userEditPage() {
      return {
        loaded: false, saving: false, f: {},
        get usedTrafficText() {
          const b = (this.f.u || 0) + (this.f.d || 0);
          return (b / 1073741824).toFixed(2) + ' GB';
        },
        init() {
          const id = new URLSearchParams(location.search).get('id');
          if (!id) { SPUI.msg('缺少用户 ID'); return; }
          SPanelAPI.request('/api/v2/admin/user/' + id)
            .then(res => {
              const d = res.data;
              d.pass = ''; // 密码留空语义
              // forbidden_* 存库为逗号分隔 → 编辑框转多行
              d.forbidden_ip = (d.forbidden_ip || '').split(',').filter(Boolean).join('\n');
              d.forbidden_port = (d.forbidden_port || '').split(',').filter(Boolean).join('\n');
              this.f = d;
              this.loaded = true;
            })
            .catch(e => SPUI.msg(e.message));
        },
        save() {
          this.saving = true;
          const payload = Object.assign({}, this.f, {
            transfer_enable: parseFloat(this.f.transfer_enable_gb) || 0,
            group: Number(this.f.node_group) || 0,
            enable: (this.f.enable == 1 || this.f.enable === true) ? 1 : 0,
            ga_enable: (this.f.ga_enable == 1 || this.f.ga_enable === true) ? 1 : 0,
            port: parseInt(this.f.port) || 0,
            invite_num: parseInt(this.f.invite_num) || 0,
            ref_by: parseInt(this.f.ref_by) || 0,
            class: parseInt(this.f.class) || 0,
            node_connector: parseInt(this.f.node_connector) || 0,
            auto_reset_day: parseInt(this.f.auto_reset_day) || 0,
            transfer_limit: parseInt(this.f.transfer_limit) || 0,
            is_multi_user: parseInt(this.f.is_multi_user) || 0,
            forbidden_ip: this.f.forbidden_ip,
            forbidden_port: this.f.forbidden_port,
            pass: this.f.pass || '',
          });
          delete payload.transfer_enable_gb;
          SPanelAPI.request('/api/v2/admin/user/' + this.f.id, { method: 'PUT', body: JSON.stringify(payload) })
            .then(res => { SPUI.toast(res.msg || '修改成功', 'success'); this.f.pass = ''; })
            .catch(e => SPUI.msg(e.message))
            .finally(() => { this.saving = false; });
        }
      };
    }
  </script>
</body>
</html>
