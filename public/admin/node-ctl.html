<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节点调整 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/css/spanel-admin.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="admin" data-sp-page="node-ctl">
  <main class="sp-content">
    <div x-data="nodeCtlPage()" x-init="load()">
      <div class="page-header d-print-none">
        <div class="row align-items-center">
          <div class="col">
            <h2 class="page-title">节点调整</h2>
          </div>
        </div>
      </div>
      <!-- 筛选 (PHP nodectl?group=&class=) -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="row align-items-end">
            <div class="col-sm-6 col-xl-3"><div class="mb-3">
              <label class="form-label">分组</label>
              <input class="form-control" type="text" x-model="group" @keydown.enter="load()">
            </div></div>
            <div class="col-sm-6 col-xl-3"><div class="mb-3">
              <label class="form-label">等级 (≤)</label>
              <input class="form-control" type="text" x-model="cls" @keydown.enter="load()">
            </div></div>
            <div class="col-sm-6 col-xl-3">
              <div class="mb-3">
                <button class="btn btn-primary" @click="load()"><i class="mi">search</i>筛选</button>
              </div>
            </div>
          </div>
          <p class="text-secondary small mb-0">
            红行 = 检测型节点(type=0) 12 小时内被探测; 黄行 = 展示节点未开订阅(custom_rss=0);
            健康分 ≤-40 红 (疑似故障建议介入) / &lt;-9 黄 (很可能不能用) / ≥30 绿 (满意)。
          </p>
        </div>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-vcenter card-table">
            <thead><tr><th>编辑</th><th>名字</th><th>节点</th><th>sort (健康分)</th><th>表现</th><th>倍率/成本</th><th>流量</th></tr></thead>
            <tbody>
              <template x-for="n in nodes" :key="n.id">
                <tr :class="rowClass(n)">
                  <td>
                    <a class="btn btn-sm" :class="btnClass(n)" :href="'/admin/node-edit.html?id=' + n.id" x-text="n.id"></a>
                  </td>
                  <td x-text="n.name"></td>
                  <td><span x-text="n.node_class + ' 级 ' + n.traffic_rate + ' 倍率 ' + n.node_online + ' 人'"></span></td>
                  <td x-html="nsColor(n.node_sort)"></td>
                  <td x-text="n.status"></td>
                  <td x-text="'R' + n.traffic_rate + ' / C' + n.node_cost + ' / 负载' + n.node_oncost"></td>
                  <td x-text="n.traffic_used_gb + ' / ' + n.traffic_limit_gb"></td>
                </tr>
              </template>
              <tr x-show="!nodes.length" x-cloak><td colspan="7"><div class="empty"><div class="empty-header"><i class="mi">inbox</i></div><div class="empty-title">该筛选下无节点</div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function nodeCtlPage() {
      return {
        group: new URLSearchParams(location.search).get('group') || '0',
        cls: new URLSearchParams(location.search).get('class') || '10',
        nodes: [],
        load() {
          SPanelAPI.request('/api/v2/admin/node/nodectl?group=' + encodeURIComponent(this.group) + '&class=' + encodeURIComponent(this.cls))
            .then(res => { this.nodes = res.data.items || []; })
            .catch(e => SPUI.msg(e.message));
        },
        rowClass(n) {
          // PHP nodectl.tpl: type=0 且 12h 内有心跳 → 红; type=1 且 custom_rss=0 → 黄
          const hbAlert = n.type === 0 && n.node_heartbeat > 0 && n.node_heartbeat > Math.floor(Date.now()/1000) - 43200;
          if (hbAlert) return 'bg-red-lt';
          if (n.type === 1 && n.custom_rss === 0) return 'bg-yellow-lt';
          return '';
        },
        btnClass(n) {
          const hbAlert = n.type === 0 && n.node_heartbeat > 0 && n.node_heartbeat > Math.floor(Date.now()/1000) - 43200;
          if (hbAlert) return 'btn-danger';
          if (n.type === 1 && n.custom_rss === 1) return 'btn-primary';
          if (n.type === 1) return 'btn-danger';
          return '';
        },
        nsColor(v) {
          if (v <= -900) return '<span class="text-danger" title="IP异常哨兵"><b>' + v + '</b></span>';
          if (v <= -40) return '<span class="text-danger" title="疑似故障, 建议介入"><b>' + v + '</b></span>';
          if (v < -9) return '<span class="text-yellow" title="很可能不能用"><b>' + v + '</b></span>';
          if (v >= 30) return '<span class="text-success">' + v + '</span>';
          return String(v);
        }
      };
    }
  </script>
</body>
</html>
