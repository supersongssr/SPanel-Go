<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品列表 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="shop">
  <main class="sp-content" x-data="shopPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">商品列表</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- ═══ 购买须知 + 余额 ═══ -->
      <div class="sp-card">
        <div class="sp-card-title"><i class="mi">shop</i>订阅套餐服务商店
          <span class="sp-extra">当前余额：<span class="sp-num" style="font-size:16px;font-weight:600;" x-text="'￥' + userMoney">￥0.00</span>
            <a class="sp-btn sp-btn-sm sp-btn-flat" href="/user/code.html"><i class="mi">attach_money</i>点此前往充值余额</a>
          </span>
        </div>
        <p>购买多个套餐时：时间叠加，流量叠加；等级、速率、客户端数量取最大值。</p>
        <p class="sp-text-muted" style="font-size:13px;">选择最适合您的大带宽高速网络加速解决方案，支持动态流量叠加或 VIP 专属线路解锁。</p>
      </div>

      <!-- ═══ 商品列表格网 ═══ -->
      <div class="sp-grid sp-mt-6">
        <template x-for="item in shops" :key="item.id">
          <div class="sp-col-4">
            <div class="sp-card" style="height:100%;display:flex;flex-direction:column;justify-content:space-between;">
              <div>
                <div style="display:flex;align-items:center;justify-content:space-between;">
                  <span class="sp-tag" :class="item.auto_renew ? 'sp-tag-orange' : 'sp-tag-grey'"
                        x-text="item.auto_renew ? '支持自动续费' : '单次购买'">单次购买</span>
                </div>

                <h3 class="sp-card-title" style="margin-top:12px;" x-text="item.name">套餐名称</h3>

                <div style="margin:16px 0;">
                  <span class="sp-text-muted">￥</span><span class="sp-num" style="font-size:32px;font-weight:600;" x-text="item.price">0.00</span><span class="sp-text-hint"> / 元</span>
                </div>

                <div class="sp-alert sp-alert-info" style="display:block;margin-bottom:0;">
                  <p style="margin:0;"><i class="mi">check_circle</i>&nbsp;<span x-text="contentSummary(item.content)"></span></p>
                  <p style="margin:6px 0 0;"><i class="mi">check_circle</i>&nbsp;<span x-text="item.auto_renew ? '支持自动续费' : '单次购买一次性结算'"></span></p>
                </div>
              </div>

              <div class="sp-mt-4">
                <button class="sp-btn sp-btn-brand sp-btn-block" @click="openCheckoutModal(item)"><i class="mi">shopping_cart</i>立即购买订阅</button>
              </div>
            </div>
          </div>
        </template>

        <template x-if="shops.length === 0">
          <div class="sp-col-12">
            <div class="sp-card">
              <div class="sp-empty"><i class="mi">shopping_cart</i>暂无可购套餐商品，管理员还未添加任何商品，请稍后再试。</div>
            </div>
          </div>
        </template>
      </div>

      <!-- ═══ 结算模态弹窗 (安全收银台) ═══ -->
      <div class="sp-modal" :class="showCheckout && 'show'">
        <div class="sp-modal-mask" @click="closeCheckoutModal"></div>
        <div class="sp-modal-dialog" style="max-width:420px;" role="dialog" aria-modal="true">
          <div class="sp-modal-inner">
            <div class="sp-card-title" style="margin-bottom:16px;"><i class="mi">credit_card</i>安全收银台</div>

            <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--sp-divider);padding-bottom:10px;margin-bottom:10px;font-size:14px;">
              <span class="sp-text-muted">所购套餐</span>
              <span style="font-weight:500;" x-text="selectedShop?.name"></span>
            </div>
            <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--sp-divider);padding-bottom:10px;margin-bottom:14px;font-size:14px;">
              <span class="sp-text-muted">套餐原价</span>
              <span class="sp-num" style="font-weight:600;" x-text="'￥' + selectedShop?.price"></span>
            </div>

            <!-- 优惠码输入 -->
            <label class="sp-form-label" style="display:block;margin-bottom:6px;">使用优惠码 (如有)</label>
            <div style="display:flex;gap:8px;">
              <input type="text" class="sp-input" style="flex:1;" x-model="couponCode" placeholder="输入折扣优惠码">
              <button class="sp-btn" @click="applyCoupon" :disabled="couponLoading">
                <span x-show="!couponLoading">应用</span>
                <span x-show="couponLoading" x-cloak><i class="mi">refresh</i></span>
              </button>
            </div>
            <p class="sp-text-success" style="font-size:12px;margin-top:6px;" x-show="couponDiscountMsg" x-cloak x-text="couponDiscountMsg"></p>

            <!-- 购买选项 -->
            <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px;">
              <label class="sp-check">
                <input type="checkbox" x-model="autoRenew">
                <span style="font-size:13px;"><i class="mi">autorenew</i> 开启自动续费 (次日自动扣款)</span>
              </label>
              <label class="sp-check">
                <input type="checkbox" x-model="disableOthers">
                <span style="font-size:13px;"><i class="mi">block</i> 关闭其他套餐的自动续费</span>
              </label>
            </div>

            <div style="display:flex;justify-content:space-between;margin-top:16px;font-weight:600;">
              <span class="sp-text-muted">应付折后总金额</span>
              <span class="sp-text-danger sp-num" style="font-size:18px;" x-text="'￥' + finalPrice">￥0.00</span>
            </div>
          </div>

          <div class="sp-modal-footer" style="display:flex;gap:8px;">
            <button class="sp-btn sp-btn-flat" style="flex:1;" @click="closeCheckoutModal">取消订单</button>
            <button class="sp-btn sp-btn-brand" style="flex:1;" @click="confirmBuy" :disabled="checkoutLoading">
              <span x-show="!checkoutLoading">确认支付并扣款</span>
              <span x-show="checkoutLoading" x-cloak><i class="mi">refresh</i>支付中...</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function shopPage() {
      return {
        shops: [],
        userMoney: '0.00',
        showCheckout: false,
        selectedShop: null,
        couponCode: '',
        couponDiscountMsg: '',
        couponCredit: 0,
        couponLoading: false,
        checkoutLoading: false,
        finalPrice: '0.00',
        autoRenew: false,
        disableOthers: false,

        async init() {
          await this.fetchUserBalance();
          await this.fetchShops();
        },

        async fetchUserBalance() {
          try {
            const profile = await SPanelAPI.request('/user/profile');
            this.userMoney = profile.data.money;
          } catch(e) {}
        },

        async fetchShops() {
          try {
            const res = await SPanelAPI.request('/user/shop');
            this.shops = res.data.items || [];
          } catch (err) {
            console.error(err.message);
          }
        },

        // 套餐 content 对象摘要 (class/bandwidth/expire 等)
        contentSummary(content) {
          if (!content || typeof content !== 'object') return '套餐权益详见购买须知';
          const parts = [];
          if (content.class) parts.push('VIP' + content.class + ' 等级');
          if (content.bandwidth) parts.push(content.bandwidth + ' GB 流量');
          if (content.expire) parts.push(content.expire + ' 天有效期');
          return parts.length > 0 ? parts.join(' · ') : '套餐权益详见购买须知';
        },

        openCheckoutModal(shop) {
          this.selectedShop = shop;
          this.couponCode = '';
          this.couponDiscountMsg = '';
          this.couponCredit = 0;
          this.finalPrice = shop.price;
          this.showCheckout = true;
        },

        closeCheckoutModal() {
          this.showCheckout = false;
          this.selectedShop = null;
        },

        async applyCoupon() {
          if (!this.couponCode.trim()) return;

          this.couponLoading = true;
          try {
            const res = await SPanelAPI.request('/user/coupon/check', {
              method: 'POST',
              body: JSON.stringify({
                coupon: this.couponCode.trim(),
                shop: this.selectedShop.id
              })
            });

            this.finalPrice = Number(res.data.final_price).toFixed(2);
            this.couponDiscountMsg = '优惠码可用！折后价 ￥' + this.finalPrice +
              (res.data.discount ? ' (优惠 ' + res.data.discount + ')' : '');
          } catch (err) {
            this.couponDiscountMsg = '';
            this.finalPrice = this.selectedShop.price;
            SPUI.msg(err.message || '优惠券校验失败，可能不支持该商品。');
          } finally {
            this.couponLoading = false;
          }
        },

        async confirmBuy() {
          this.checkoutLoading = true;
          try {
            const res = await SPanelAPI.request('/user/buy', {
              method: 'POST',
              body: JSON.stringify({
                shop: this.selectedShop.id,
                coupon: this.couponCode.trim(),
                disableothers: this.disableOthers,
                autorenew: this.autoRenew
              })
            });

            SPUI.msg(res.message || '恭喜您购买套餐成功！');
            this.closeCheckoutModal();
            await this.fetchUserBalance();
          } catch (err) {
            SPUI.msg(err.message || '扣款结账失败，请检查您的余额。');
          } finally {
            this.checkoutLoading = false;
          }
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
