<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工单 &amp; 客服 &amp; 技术支持 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="tickets">
  <main class="sp-content" x-data="ticketsPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">工单 &amp; 客服 &amp; 技术支持</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- ═══ 我的工单列表 ═══ -->
      <div class="sp-card">
        <div class="sp-card-title">
          <i class="mi">confirmation_number</i>我的工单
          <span class="sp-extra"><a class="sp-btn sp-btn-brand sp-btn-sm" href="/user/ticket-create.html"><i class="mi">add</i>创建工单</a></span>
        </div>
        <p class="sp-text-muted" style="font-size:13px;">在这里，您可以方便地查看历史发起的客服提问列表。点击对应的工单，即可进入聊天对话流进行追问。</p>

        <div class="sp-table-wrap sp-mt-4">
          <table class="sp-table">
            <thead>
              <tr>
                <th>工单编码</th>
                <th>工单主题</th>
                <th>处理状态</th>
                <th>最后活跃时间</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="tkt in tickets" :key="tkt.id">
                <tr style="cursor:pointer;" @click="goToTicket(tkt.id)">
                  <td class="sp-num" x-text="'#' + tkt.id"></td>
                  <td class="sp-wrap" x-text="tkt.title"></td>
                  <td>
                    <span class="sp-tag" :class="tkt.status === 'open' ? 'sp-tag-blue' : 'sp-tag-grey'"
                          x-text="tkt.status === 'open' ? '受理处理中' : '已结单'"></span>
                  </td>
                  <td class="sp-num" x-text="tkt.datetime"></td>
                </tr>
              </template>
              <template x-if="tickets.length === 0">
                <tr>
                  <td colspan="4">
                    <div class="sp-empty"><i class="mi">question_answer</i>您目前没有任何历史工单咨询记录。</div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ═══ 公开工单参考入口 ═══ -->
      <div class="sp-card sp-mt-6">
        <div class="sp-card-title">
          <i class="mi">public</i>公开工单
          <span class="sp-extra sp-text-hint">参考</span>
        </div>
        <p class="sp-text-muted" style="font-size:13px;">这里列举的是全站公开的工单（由站长处理并设为公开），仅展示提问与官方回复。遇到节点/服务异常时可先在此对照，自助判断是否为已知问题，无需重复提问。</p>
        <a class="sp-btn sp-mt-2" href="/user/ticket-openview.html"><i class="mi">search</i>浏览公开工单</a>
      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function ticketsPage() {
      return {
        tickets: [],

        async init() {
          await this.fetchTickets();
        },

        async fetchTickets() {
          try {
            const res = await SPanelAPI.request('/user/ticket');
            this.tickets = res.data || [];
          } catch (err) {
            console.error('拉取工单列表失败：' + err.message);
          }
        },

        goToTicket(id) {
          window.location.href = `/user/ticket-view.html?id=${id}`;
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
