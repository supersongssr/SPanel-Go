<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查看工单 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="ticket-openview" data-sp-active="tickets">
  <main class="sp-content" x-data="ticketOpenviewPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">查看工单</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- ═══ 列表模式: 公开工单 ═══ -->
      <template x-if="!detail">
        <div class="sp-card">
          <div class="sp-card-title">
            <i class="mi">public</i>公开工单
            <span class="sp-extra"><a class="sp-btn sp-btn-sm" href="/user/tickets.html"><i class="mi">confirmation_number</i>我的工单</a></span>
          </div>
          <p class="sp-text-muted" style="font-size:13px;">已公开的常见工单与官方答复，供所有用户查阅参考。</p>

          <div class="sp-table-wrap sp-mt-4">
            <table class="sp-table">
              <thead>
                <tr>
                  <th>标题</th>
                  <th style="text-align:right;">时间</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="t in tickets" :key="t.id">
                  <tr style="cursor:pointer;" @click="openDetail(t.id)">
                    <td class="sp-wrap">
                      <i class="mi" style="font-size:16px;">folder_open</i>&nbsp;<span x-text="t.title"></span>
                    </td>
                    <td class="sp-num" style="text-align:right;" x-text="t.datetime"></td>
                  </tr>
                </template>
                <template x-if="tickets.length === 0">
                  <tr>
                    <td colspan="2">
                      <div class="sp-empty"><i class="mi">inbox</i>暂无数据</div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- 分页 -->
          <div class="sp-mt-4" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;" x-show="total > 0" x-cloak>
            <span class="sp-text-hint" style="font-size:12px;">
              共 <b x-text="total">0</b> 条 · 第 <b x-text="page">1</b> 页
            </span>
            <div style="display:flex;gap:8px;">
              <button class="sp-btn sp-btn-sm" @click="changePage(page - 1)" :disabled="page <= 1"><i class="mi" style="font-size:14px;">chevron_left</i>上一页</button>
              <button class="sp-btn sp-btn-sm" @click="changePage(page + 1)" :disabled="page * 15 >= total">下一页<i class="mi" style="font-size:14px;">chevron_right</i></button>
            </div>
          </div>
        </div>
      </template>

      <!-- ═══ 详情模式: 对话气泡 (用户左 / 官方右) ═══ -->
      <template x-if="detail">
        <div class="sp-card">
          <div class="sp-card-title">
            <i class="mi">folder_open</i><span x-text="detail.title"></span>
            <span class="sp-extra">
              <button class="sp-btn sp-btn-sm" @click="backToList"><i class="mi" style="font-size:14px;">arrow_back</i>返回列表</button>
            </span>
          </div>

          <template x-for="msg in detail.chat_flow" :key="msg.id">
            <!-- 用户提问: 左侧 -->
            <div x-show="msg.role === 'user'" x-cloak
                 :style="'display:flex;flex-direction:column;max-width:82%;margin-bottom:16px;align-items:flex-start;'">
              <div class="sp-text-hint" style="font-size:12px;margin-bottom:4px;">
                <i class="mi" style="font-size:14px;">person</i> 提问用户
                &nbsp;·&nbsp;<span x-text="msg.datetime"></span>
              </div>
              <div class="sp-card" style="padding:12px 16px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;" x-text="msg.content"></div>
            </div>
            <!-- 管理员答复: 右侧 -->
            <div x-show="msg.role === 'admin'" x-cloak
                 :style="'display:flex;flex-direction:column;max-width:82%;margin-bottom:16px;align-items:flex-end;margin-left:auto;'">
              <div class="sp-text-hint" style="font-size:12px;margin-bottom:4px;">
                <i class="mi" style="font-size:14px;">support_agent</i> 官方答复
                &nbsp;·&nbsp;<span x-text="msg.datetime"></span>
              </div>
              <div class="sp-card" style="padding:12px 16px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;" x-text="msg.content"></div>
            </div>
          </template>

          <template x-if="!detail.chat_flow || detail.chat_flow.length === 0">
            <div class="sp-empty"><i class="mi">inbox</i>暂无数据</div>
          </template>
        </div>
      </template>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function ticketOpenviewPage() {
      return {
        tickets: [],
        total: 0,
        page: 1,
        detail: null,

        async init() {
          const params = new URLSearchParams(window.location.search);
          const id = params.get('id');
          if (id) {
            await this.openDetail(id);
          } else {
            await this.fetchList();
          }
        },

        async fetchList() {
          try {
            const res = await SPanelAPI.request('/user/ticket/open?page=' + this.page);
            this.tickets = res.data.items || [];
            this.total = res.data.total || 0;
          } catch (err) {
            SPUI.msg(err.message);
          }
        },

        async changePage(p) {
          if (p < 1) return;
          this.page = p;
          await this.fetchList();
        },

        async openDetail(id) {
          try {
            const res = await SPanelAPI.request('/user/ticket/open/' + id);
            this.detail = res.data;
          } catch (err) {
            SPUI.msg(err.message);
          }
        },

        async backToList() {
          this.detail = null;
          window.history.replaceState(null, '', '/user/ticket-openview.html');
          if (this.tickets.length === 0) {
            this.page = 1;
            await this.fetchList();
          }
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
