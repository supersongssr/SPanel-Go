<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计规则公示 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="detect">
  <main class="sp-content" x-data="detectPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">审计规则公示</h1></div>
    </div>

    <div class="sp-content-inner">
      <div class="sp-card sp-mb-6" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <p class="sp-text-muted" style="font-size:13px;margin:0;">本站启用的流量审计规则列表。当您的传输内容命中以下规则时，系统将记录审计日志。请合规使用网络服务。</p>
        <a href="/user/detect-log.html" class="sp-btn sp-btn-sm" style="flex:none;">
          <i class="mi">assignment_late</i>查看我的审计记录
        </a>
      </div>

      <div class="sp-card">
        <div class="sp-table-wrap" style="box-shadow:none;border-radius:0;">
          <table class="sp-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>名称</th>
                <th>匹配内容</th>
                <th>正则</th>
                <th>类型</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="rule in rules" :key="rule.id">
                <tr>
                  <td class="sp-num" x-text="rule.id"></td>
                  <td x-text="rule.name"></td>
                  <td class="sp-num sp-wrap" x-text="rule.text"></td>
                  <td class="sp-num sp-wrap" x-text="rule.regex"></td>
                  <td>
                    <span class="sp-tag" :class="rule.type === 2 ? 'sp-tag-yellow' : 'sp-tag-grey'" x-text="rule.type === 2 ? 'Hex 编码' : '明文'"></span>
                  </td>
                </tr>
              </template>
              <template x-if="rules.length === 0">
                <tr><td colspan="5"><div class="sp-empty"><i class="mi">inbox</i>暂无数据</div></td></tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- 分页 -->
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sp-text-2nd);" x-show="total > 0">
          <span>共 <b x-text="total"></b> 条 · 第 <b x-text="page"></b> 页</span>
          <div class="sp-pagination" style="padding:0;">
            <button @click="changePage(page - 1)" :disabled="page <= 1"><i class="mi">chevron_left</i>上一页</button>
            <button @click="changePage(page + 1)" :disabled="page * 15 >= total">下一页<i class="mi">chevron_right</i></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function detectPage() {
      return {
        rules: [],
        total: 0,
        page: 1,

        async init() {
          await this.fetchRules();
        },

        async fetchRules() {
          try {
            const res = await SPanelAPI.request('/user/detect?page=' + this.page);
            this.rules = res.data.items || [];
            this.total = res.data.total || 0;
          } catch (err) {
            SPUI.msg(err.message);
          }
        },

        async changePage(p) {
          if (p < 1) return;
          this.page = p;
          await this.fetchRules();
        },

        async logout() {
          SP.logout();
        }
      }
    }
  </script>
</body>
</html>
