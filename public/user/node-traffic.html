<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节点流量 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="nodes">
  <main class="sp-content" x-data="nodeTrafficPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">节点流量 - <span x-text="(result && result.node && result.node.name) ? result.node.name : (nodeId ? '节点 #' + nodeId : '全部节点')"></span></h1></div>
    </div>

    <div class="sp-content-inner">

      <div class="sp-grid">

        <!-- 左栏：查询表单 -->
        <div class="sp-col-4">
          <div class="sp-card">
            <div class="sp-card-title"><i class="mi">manage_search</i>查询条件</div>

            <div class="sp-field">
              <input type="number" x-model.number="nodeId" placeholder=" " min="1">
              <label>节点 ID（正整数）</label>
            </div>

            <div class="sp-form-row">
              <label class="sp-form-label">统计天数</label>
              <select class="sp-select" x-model.number="days">
                <option :value="7">最近 7 天</option>
                <option :value="14">最近 14 天</option>
                <option :value="30">最近 30 天</option>
              </select>
            </div>

            <button class="sp-btn sp-btn-brand sp-btn-block" @click="query" :disabled="loading">
              <span x-show="!loading"><i class="mi">bolt</i>立即查询</span>
              <span x-show="loading" x-cloak><i class="mi">refresh</i>查询中...</span>
            </button>
            <p class="sp-text-hint" style="font-size:12px;margin-top:8px;">节点 ID 可在节点列表页面查看。</p>
            <a class="sp-btn sp-btn-block sp-mt-2" href="/user/nodes.html"><i class="mi">dns</i>查看节点列表</a>
          </div>
        </div>

        <!-- 右栏：查询结果 -->
        <div class="sp-col-8">
          <div class="sp-card">
            <template x-if="result">
              <div>
                <div class="sp-card-title">
                  <i class="mi">bar_chart</i><span x-text="(result.node && result.node.name) ? result.node.name : ('节点 #' + nodeId)"></span>
                  <span class="sp-extra sp-text-hint">节点 ID: <span class="sp-num" x-text="(result.node && result.node.id !== undefined) ? result.node.id : nodeId"></span> · 最近 <span x-text="days"></span> 天</span>
                </div>

                <div class="sp-table-wrap">
                  <table class="sp-table">
                    <thead>
                      <tr>
                        <th>日期</th>
                        <th>上传 ↑</th>
                        <th>下载 ↓</th>
                        <th>合计</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="row in (result.daily || [])" :key="row.date">
                        <tr>
                          <td class="sp-num" x-text="row.date"></td>
                          <td class="sp-num" x-text="fmt(row.u)"></td>
                          <td class="sp-num" x-text="fmt(row.d)"></td>
                          <td class="sp-num" x-text="fmt((Number(row.u) || 0) + (Number(row.d) || 0))"></td>
                        </tr>
                      </template>
                      <template x-if="!result.daily || result.daily.length === 0">
                        <tr>
                          <td colspan="4"><div class="sp-empty" style="padding:24px;"><i class="mi">inbox</i>暂无数据</div></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>

            <!-- 未查询占位 -->
            <template x-if="!result && !loading">
              <div class="sp-empty">
                <i class="mi">bar_chart</i>
                输入节点 ID 并点击“立即查询”，即可查看该节点的每日流量明细。
              </div>
            </template>

            <!-- 查询中 -->
            <template x-if="loading">
              <div class="sp-empty"><i class="mi">refresh</i>正在查询流量数据...</div>
            </template>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function nodeTrafficPage() {
      return {
        nodeId: null,
        days: 7,
        result: null,
        loading: false,

        async init() {
          // 支持 URL ?id= 预填节点 ID
          const id = new URLSearchParams(window.location.search).get('id');
          if (id) {
            const parsed = parseInt(id, 10);
            this.nodeId = isNaN(parsed) ? null : parsed;
            if (this.nodeId) await this.query();
          }
        },

        async query() {
          if (this.nodeId === null || this.nodeId === undefined || this.nodeId === '' || (typeof this.nodeId === 'number' && this.nodeId <= 0)) {
            SPUI.msg('请输入有效的节点 ID（正整数）。');
            return;
          }
          this.loading = true;
          try {
            const res = await SPanelAPI.request(`/user/node/${this.nodeId}/daily?days=${this.days}`);
            this.result = res.data;
          } catch (err) {
            console.error('查询节点流量失败:', err);
            SPUI.msg('查询失败：' + (err.message || '未知错误'));
            this.result = null;
          } finally {
            this.loading = false;
          }
        },

        // 流量数值格式化 (字节 → 可读单位)
        fmt(v) {
          const n = Number(v);
          if (v === null || v === undefined || v === '' || !isFinite(n)) return '-';
          const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
          let val = n, i = 0;
          while (val >= 1024 && i < units.length - 1) { val /= 1024; i++; }
          return (val >= 100 ? val.toFixed(0) : val.toFixed(2)) + ' ' + units[i];
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
