<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虚空之地 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="disable">
  <main class="sp-content" x-data="disablePage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">虚空之地</h1></div>
    </div>

    <div class="sp-content-inner">
      <div class="sp-grid">
        <div class="sp-col-8">

          <!-- 账户保护说明 (复刻旧版 disable.tpl 信息结构) -->
          <div class="sp-card">
            <div class="sp-card-title"><i class="mi">gpp_bad</i>您被系统启用了账户保护</div>
            <p style="font-size:13px;">可能原因如下：</p>
            <ol class="sp-steps">
              <li>账号长期未使用，需要重新激活。</li>
              <li>订阅请求来源异常，疑似账号泄露，启用账号保护。</li>
              <li>账号流量异常，启用账号保护。</li>
              <li>账号ip数异常，启用账号保护。</li>
              <li>您的账号余额 &lt; 0，被系统自动禁用。</li>
              <li>其他违反注册协议的行为，疑似被盗。</li>
            </ol>
            <p style="font-size:13px;">您可以自助解除账号保护。</p>

            <!-- 禁用原因提示 (warming) -->
            <div class="sp-alert sp-alert-warn sp-mt-4">
              <i class="mi">warning</i>
              <span x-text="info.warming || '账户已被禁用，请联系客服'"></span>
            </div>
          </div>

          <!-- 账号信息 -->
          <div class="sp-card sp-mt-6">
            <div class="sp-card-title"><i class="mi">account_box</i>账号信息</div>
            <div class="sp-form-row" style="display:flex;justify-content:space-between;">
              <span class="sp-text-muted">账户邮箱</span>
              <span class="sp-break-all" x-text="info.email || '-'"></span>
            </div>
            <div class="sp-form-row" style="display:flex;justify-content:space-between;">
              <span class="sp-text-muted">用户名</span>
              <span x-text="info.user_name || '-'"></span>
            </div>
            <div class="sp-form-row" style="display:flex;justify-content:space-between;margin-bottom:0;">
              <span class="sp-text-muted">累计被封次数</span>
              <span class="sp-tag sp-tag-red" x-text="info.ban_times ?? '-'"></span>
            </div>
          </div>

          <!-- 自助解封 -->
          <div class="sp-card sp-mt-6">
            <button class="sp-btn sp-btn-brand sp-btn-block sp-btn-lg" @click="reactive" :disabled="reactiving">
              <span x-show="!reactiving"><i class="mi">lock_open</i>取消账户保护 (自助解封)</span>
              <span x-show="reactiving" x-cloak><i class="mi">refresh</i>解封中...</span>
            </button>
            <p class="sp-text-hint" style="font-size:12px;text-align:center;">
              <a href="/auth/logout.html"><i class="mi">exit_to_app</i>退出登录</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function disablePage() {
      return {
        info: {},
        reactiving: false,

        async init() {
          try {
            const res = await SPanelAPI.request('/user/disable');
            this.info = res.data || {};
          } catch (err) {
            SPUI.msg(err.message);
          }
        },

        async reactive() {
          SPUI.confirm('确定要尝试自助解封账户吗？', async () => {
            this.reactiving = true;
            try {
              const res = await SPanelAPI.request('/user/reactive', { method: 'POST' });
              SPUI.msg(res.message || '账户已解封', () => {
                window.location.href = '/user/';
              });
            } catch (err) {
              SPUI.msg(err.message);
            } finally {
              this.reactiving = false;
            }
          });
        }
      }
    }
  </script>
</body>
</html>
