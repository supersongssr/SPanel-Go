<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查看工单 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="ticket-view" data-sp-active="tickets">
  <main class="sp-content" x-data="viewTicketPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">查看工单</h1></div>
    </div>

    <div class="sp-content-inner">
      <div class="sp-grid">
        <div class="sp-col-9">

          <!-- ═══ 工单状态卡 ═══ -->
          <div class="sp-card">
            <div class="sp-card-title">
              <i class="mi">confirmation_number</i>
              <span x-text="ticket.title || '加载工单中...'">加载工单中...</span>
              <span class="sp-extra">
                <span class="sp-tag" :class="ticket.status === 'open' ? 'sp-tag-blue' : 'sp-tag-grey'"
                      x-text="ticket.status === 'open' ? '受理处理中' : '工单已结单'"></span>
              </span>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
              <span class="sp-text-hint" style="font-size:12px;">
                <i class="mi" style="font-size:14px;">tag</i>
                工单编码 <span class="sp-num" x-text="'#' + ticketId"></span>
              </span>
              <a href="/user/tickets.html" class="sp-text-hint" style="font-size:13px;"><i class="mi" style="font-size:14px;">arrow_back</i>返回工单支持中心</a>
            </div>
          </div>

          <!-- ═══ 追问会话框 ═══ -->
          <div class="sp-card sp-mt-6">
            <div class="sp-card-title"><i class="mi">forum</i>对话记录</div>

            <!-- 对话气泡: 左(官方) / 右(用户), 布局性内联 style -->
            <template x-for="chat in ticket.chat_flow" :key="chat.id">
              <div :style="'display:flex;flex-direction:column;max-width:82%;margin-bottom:16px;' + (chat.role === 'user' ? 'margin-left:auto;align-items:flex-end;' : 'align-items:flex-start;')">
                <div class="sp-text-hint" style="font-size:12px;margin-bottom:4px;">
                  <i class="mi" style="font-size:14px;" x-text="chat.role === 'user' ? 'person' : 'support_agent'">person</i>
                  <span x-text="chat.role === 'user' ? '我 (发件人)' : '系统官方网络专员'"></span>
                  &nbsp;·&nbsp;<span x-text="chat.datetime"></span>
                </div>
                <div class="sp-card" style="padding:12px 16px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;" x-text="chat.content"></div>
              </div>
            </template>

            <template x-if="!ticket.chat_flow || ticket.chat_flow.length === 0">
              <div class="sp-empty"><i class="mi">hourglass_empty</i>正在加载工单对话流水...</div>
            </template>

            <!-- 回复输入区 -->
            <div style="border-top:1px solid var(--sp-divider);padding-top:16px;margin-top:4px;">
              <template x-if="ticket.status === 'open'">
                <div>
                  <div class="sp-field" style="margin-top:4px;">
                    <textarea x-model="replyContent" rows="3" placeholder=" "></textarea>
                    <label>在此输入追加追问的具体信息...</label>
                  </div>
                  <div style="display:flex;justify-content:flex-end;">
                    <button class="sp-btn sp-btn-brand" @click="sendReply" :disabled="replyLoading">
                      <span x-show="!replyLoading"><i class="mi">reply</i>发送追加追问</span>
                      <span x-show="replyLoading" x-cloak><i class="mi">refresh</i>发送中...</span>
                    </button>
                  </div>
                </div>
              </template>

              <template x-if="ticket.status !== 'open'">
                <div class="sp-alert sp-alert-info">
                  <i class="mi">lock</i>
                  <span>本工单已被客服专员操作结单，会话流已安全锁定。如有其他技术/财务问题，请<a href="/user/ticket-create.html">提交新工单</a>。</span>
                </div>
              </template>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function viewTicketPage() {
      return {
        ticketId: '',
        ticket: {},
        replyContent: '',
        replyLoading: false,

        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          this.ticketId = urlParams.get('id');
          if (!this.ticketId) {
            SPUI.msg('工单 ID 缺失！', () => {
              window.location.replace('/user/tickets.html');
            });
            return;
          }
          await this.fetchTicketDetails();
        },

        async fetchTicketDetails() {
          try {
            const res = await SPanelAPI.request(`/user/ticket/${this.ticketId}`);
            this.ticket = res.data;
          } catch(err) {
            SPUI.msg('获取工单明细错误：' + err.message, () => {
              window.location.replace('/user/tickets.html');
            });
          }
        },

        async sendReply() {
          if (!this.replyContent.trim()) {
            SPUI.msg('请输入追加回复内容！');
            return;
          }
          this.replyLoading = true;
          try {
            const res = await SPanelAPI.request(`/user/ticket/${this.ticketId}`, {
              method: 'PUT',
              body: JSON.stringify({ content: this.replyContent.trim() })
            });
            SPUI.msg(res.message || '回复成功！');
            this.replyContent = '';
            await this.fetchTicketDetails();
          } catch(err) {
            SPUI.msg(err.message || '回复失败，请稍后再试。');
          } finally {
            this.replyLoading = false;
          }
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
