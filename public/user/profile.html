<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的账户 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="profile">
  <main class="sp-content" x-data="profilePage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">我的账户</h1></div>
    </div>

    <div class="sp-content-inner">
      <div class="sp-grid">

        <!-- ═══ 左栏: 我的帐号卡 + 2FA ═══ -->
        <div class="sp-col-4">

          <!-- 我的帐号 (复刻旧版 profile 首卡: dl 信息 + 注销账号入口) -->
          <div class="sp-card">
            <div class="sp-card-title">
              <i class="mi">account_box</i>我的帐号
              <span class="sp-extra">
                <a href="/user/kill.html" class="sp-btn sp-btn-flat sp-btn-sm"><i class="mi">not_interested</i>注销账号</a>
              </span>
            </div>
            <div class="sp-form-row" style="display:flex;justify-content:space-between;">
              <span class="sp-text-muted">用户名</span>
              <b x-text="profile.user_name || '加载中...'"></b>
            </div>
            <div class="sp-form-row" style="display:flex;justify-content:space-between;">
              <span class="sp-text-muted">邮箱</span>
              <span class="sp-break-all" x-text="profile.email"></span>
            </div>
            <div class="sp-form-row" style="display:flex;justify-content:space-between;">
              <span class="sp-text-muted">会员等级</span>
              <span class="sp-tag sp-tag-blue" x-text="'VIP ' + profile.class">VIP 0</span>
            </div>
            <div class="sp-form-row" style="display:flex;justify-content:space-between;">
              <span class="sp-text-muted">等级到期时间</span>
              <span x-text="profile.class_expire || '永久有效'"></span>
            </div>
            <div class="sp-form-row" style="display:flex;justify-content:space-between;">
              <span class="sp-text-muted">连接端口</span>
              <b x-text="profile.port || '未分配'"></b>
            </div>
            <div class="sp-form-row" style="display:flex;justify-content:space-between;margin-bottom:0;">
              <span class="sp-text-muted">注册时间</span>
              <span class="sp-text-muted" x-text="profile.reg_date"></span>
            </div>
            <div class="sp-mt-4" style="text-align:center;">
              <a href="/user/edit.html" class="sp-btn sp-btn-brand"><i class="mi">edit</i>修改资料 / 连接设置</a>
            </div>
          </div>

          <!-- 谷歌两步验证 (2FA) -->
          <div class="sp-card sp-mt-6">
            <div class="sp-card-title"><i class="mi">vpn_key</i>谷歌两步验证 (2FA)</div>

            <!-- 已开启 -->
            <template x-if="profile.ga_enable">
              <div>
                <div class="sp-alert sp-alert-success">
                  <i class="mi">check_circle</i>
                  <span>您的账户已启用双重身份验证保护，正在保障您的账户安全。</span>
                </div>
                <div class="sp-form-row">
                  <label class="sp-form-label" for="ga-disable">输入密码或动态码以关闭</label>
                  <input class="sp-input" id="ga-disable" type="password" x-model="gaDisableInput" placeholder="输入 Web 登录密码（或 6 位动态码）">
                </div>
                <button class="sp-btn sp-btn-danger sp-btn-block" @click="disable2FA" :disabled="gaLoading">
                  <span x-show="!gaLoading"><i class="mi">lock_open</i>关闭 2FA 双重身份验证</span>
                  <span x-show="gaLoading" x-cloak><i class="mi">refresh</i>处理中...</span>
                </button>
                <button class="sp-btn sp-btn-block sp-mt-2" @click="reset2FA" :disabled="gaLoading">
                  <span x-show="!gaLoading"><i class="mi">autorenew</i>重置 2FA 密钥</span>
                  <span x-show="gaLoading" x-cloak><i class="mi">refresh</i>重置中...</span>
                </button>
              </div>
            </template>

            <!-- 未开启 -->
            <template x-if="!profile.ga_enable">
              <div>
                <p class="sp-text-muted" style="font-size:13px;">双重验证为您的登录提供二次保护。开启后登录需要输入谷歌身份验证器 (Google Authenticator) 动态令牌。</p>

                <div style="text-align:center;">
                  <img :src="qrUrl" alt="2FA 绑定二维码" style="width:180px;height:180px;">
                  <div class="sp-text-hint sp-break-all" style="font-size:12px;margin-top:8px;">
                    密钥: <b x-text="profile.ga_token || '加载中...'"></b>
                  </div>
                  <p class="sp-text-hint" style="font-size:12px;">使用谷歌验证器 App 扫描上方二维码，或手动添加新账号并填入该密钥。</p>
                </div>

                <div class="sp-form-row">
                  <input class="sp-input" type="text" x-model="gaCode" placeholder="输入 App 产生的 6 位动态验证码">
                </div>
                <button class="sp-btn sp-btn-brand sp-btn-block" @click="enable2FA" :disabled="gaLoading">
                  <span x-show="!gaLoading"><i class="mi">check_circle</i>验证并开启 2FA</span>
                  <span x-show="gaLoading" x-cloak><i class="mi">refresh</i>验证绑定中...</span>
                </button>
                <button class="sp-btn sp-btn-block sp-mt-2" @click="reset2FA" :disabled="gaLoading">
                  <span x-show="!gaLoading"><i class="mi">autorenew</i>重置 2FA 密钥</span>
                  <span x-show="gaLoading" x-cloak><i class="mi">refresh</i>重置中...</span>
                </button>
              </div>
            </template>
          </div>
        </div>

        <!-- ═══ 右栏: IP 审计足迹 ═══ -->
        <div class="sp-col-8">

          <!-- 活跃在线连接 (最近 5 分钟) -->
          <div class="sp-card">
            <div class="sp-card-title"><i class="mi">wifi</i>最近 5 分钟活跃在线连接 (IP 足迹)</div>
            <p class="sp-text-muted" style="font-size:13px;">展示您在最近 5 分钟内通过各个物理节点传输流量的 IP 地址。若发现不属于您本人的陌生 IP，请及时在“连接设置”中重置连接密码与加密方法。</p>
            <div class="sp-table-wrap">
              <table class="sp-table">
                <thead>
                  <tr>
                    <th>在线 IP 归属</th>
                    <th style="text-align:right;">检测时间</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="alive in profile.alive_ips" :key="alive.ip">
                    <tr>
                      <td x-text="alive.ip"></td>
                      <td style="text-align:right;" x-text="alive.datetime"></td>
                    </tr>
                  </template>
                  <template x-if="!profile.alive_ips || profile.alive_ips.length === 0">
                    <tr>
                      <td colspan="2">
                        <div class="sp-empty"><i class="mi">inbox</i>最近 5 分钟无任何代理节点连接足迹记录。</div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- 历史登录日志 (最近 10 次) -->
          <div class="sp-card sp-mt-6">
            <div class="sp-card-title"><i class="mi">info</i>最近 10 次网页端登录历史</div>
            <p class="sp-text-muted" style="font-size:13px;">展示您近期在 Web 浏览器控制台的安全登录记录。</p>
            <div class="sp-table-wrap">
              <table class="sp-table">
                <thead>
                  <tr>
                    <th>登录 IP 终端</th>
                    <th style="text-align:right;">登录具体时刻</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="log in profile.login_ips" :key="log.datetime">
                    <tr>
                      <td x-text="log.ip"></td>
                      <td style="text-align:right;" x-text="log.datetime"></td>
                    </tr>
                  </template>
                  <template x-if="!profile.login_ips || profile.login_ips.length === 0">
                    <tr>
                      <td colspan="2">
                        <div class="sp-empty"><i class="mi">inbox</i>暂无任何历史登录足迹记录。</div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function profilePage() {
      return {
        profile: {},
        gaCode: '',
        gaDisableInput: '',
        gaLoading: false,

        get qrUrl() {
          const otpauth = 'otpauth://totp/SPanel:' + (this.profile.email || '') + '?secret=' + (this.profile.ga_token || '');
          return 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(otpauth);
        },

        async init() {
          await this.fetchProfile();
        },

        async fetchProfile() {
          try {
            const res = await SPanelAPI.request('/user/profile');
            this.profile = res.data;
          } catch(err) {
            SPUI.msg('获取个人中心资料失败：' + err.message);
          }
        },

        async enable2FA() {
          const code = this.gaCode.trim();
          if (!/^\d{6}$/.test(code)) {
            SPUI.msg('请输入谷歌身份验证器 APP 产生的 6 位数字动态验证码。');
            return;
          }
          this.gaLoading = true;
          try {
            // a) 先验证 6 位动态码
            await SPanelAPI.request('/user/ga/check', {
              method: 'POST',
              body: JSON.stringify({ code })
            });
            // b) 验证通过后正式绑定开启
            const res = await SPanelAPI.request('/user/ga/set', {
              method: 'POST',
              body: JSON.stringify({
                secret: this.profile.ga_token,
                code
              })
            });
            SPUI.msg(res.msg || res.message || '双重验证保护开启成功！');
            this.gaCode = '';
            await this.fetchProfile();
          } catch(err) {
            SPUI.msg(err.message || '2FA 验证失败，请确认您在 APP 中配置的密钥完全正确。');
          } finally {
            this.gaLoading = false;
          }
        },

        async disable2FA() {
          const val = this.gaDisableInput;
          if (!val) {
            SPUI.msg('请输入 Web 登录密码（或 6 位动态验证码）以关闭 2FA。');
            return;
          }
          SPUI.confirm('您确定要关闭该账户的 2FA 谷歌双重验证保护吗？这会降低您的账户安全性。', async () => {
            this.gaLoading = true;
            try {
              const body = /^\d{6}$/.test(val) ? { code: val } : { password: val };
              const res = await SPanelAPI.request('/user/ga/disable', {
                method: 'POST',
                body: JSON.stringify(body)
              });
              SPUI.msg(res.msg || res.message || '双重验证已关闭。');
              this.gaDisableInput = '';
              await this.fetchProfile();
            } catch(err) {
              SPUI.msg(err.message);
            } finally {
              this.gaLoading = false;
            }
          });
        },

        async reset2FA() {
          SPUI.confirm('您确定要重置 2FA 密钥吗？原密钥与二维码将立即失效，请使用新密钥重新绑定。', async () => {
            this.gaLoading = true;
            try {
              const res = await SPanelAPI.request('/user/ga/reset', {
                method: 'POST'
              });
              if (res.data && res.data.ga_token) this.profile.ga_token = res.data.ga_token;
              SPUI.msg(res.msg || res.message || '2FA 密钥已重置。');
              await this.fetchProfile();
            } catch(err) {
              SPUI.msg(err.message);
            } finally {
              this.gaLoading = false;
            }
          });
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
