<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流量记录 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="trafficlog">
  <main class="sp-content" x-data="trafficlogPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">流量记录</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- 统计范围切换 -->
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;" class="sp-mb-6">
        <p class="sp-text-muted" style="font-size:13px;margin:0;">近 24 小时连接明细、每日用量汇总与节点累计三层流量视角，单位自动换算。</p>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="sp-text-hint" style="font-size:13px;">统计范围</span>
          <select class="sp-select sp-input-sm" x-model="days" @change="reload">
            <option value="7">近 7 天</option>
            <option value="30">近 30 天</option>
            <option value="90">近 90 天</option>
            <option value="180">近 180 天</option>
          </select>
        </div>
      </div>

      <!-- ① 近 24h 明细 -->
      <div class="sp-card">
        <div class="sp-card-title"><i class="mi">schedule</i>近 24 小时连接明细</div>
        <p class="sp-text-muted sp-mb-6" style="font-size:13px;">展示最近 24 小时内各节点的流量传输明细（最多 200 条）。</p>
        <div class="sp-table-wrap">
          <table class="sp-table">
            <thead>
              <tr>
                <th>时间</th>
                <th>节点</th>
                <th>上行</th>
                <th>下行</th>
                <th>倍率</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(d, i) in details" :key="i">
                <tr>
                  <td class="sp-num" x-text="d.time"></td>
                  <td x-text="d.name || ('#' + d.node_id)"></td>
                  <td class="sp-num" x-text="formatBytes(d.u)"></td>
                  <td class="sp-num" x-text="formatBytes(d.d)"></td>
                  <td class="sp-num" x-text="'x' + (d.rate ?? 1)"></td>
                </tr>
              </template>
              <template x-if="details.length === 0">
                <tr>
                  <td colspan="5"><div class="sp-empty" style="padding:24px;"><i class="mi">inbox</i>暂无数据</div></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ② 每日用量 -->
      <div class="sp-card sp-mt-6">
        <div class="sp-card-title"><i class="mi">calendar_month</i>每日用量</div>
        <p class="sp-text-muted sp-mb-6" style="font-size:13px;">
          近 <span x-text="days"></span> 天共 <span x-text="daily.length"></span> 天有用量记录（展示最近 30 天，倒序）。
        </p>
        <div class="sp-table-wrap">
          <table class="sp-table">
            <thead>
              <tr>
                <th>日期</th>
                <th>用量 (上+下)</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in dailyLatest" :key="row.date">
                <tr>
                  <td class="sp-num" x-text="row.date"></td>
                  <td class="sp-num" x-text="formatBytes(row.u + row.d)"></td>
                </tr>
              </template>
              <template x-if="daily.length === 0">
                <tr>
                  <td colspan="2"><div class="sp-empty" style="padding:24px;"><i class="mi">inbox</i>暂无数据</div></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ③ 节点累计 -->
      <div class="sp-card sp-mt-6">
        <div class="sp-card-title"><i class="mi">dns</i>节点累计用量</div>
        <p class="sp-text-muted sp-mb-6" style="font-size:13px;">账户全部历史流量按节点累计汇总。</p>
        <div class="sp-table-wrap">
          <table class="sp-table">
            <thead>
              <tr>
                <th>节点</th>
                <th>上行</th>
                <th>下行</th>
                <th>倍率</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(n, i) in nodes" :key="i">
                <tr>
                  <td x-text="n.name || ('#' + n.node_id)"></td>
                  <td class="sp-num" x-text="formatBytes(n.u)"></td>
                  <td class="sp-num" x-text="formatBytes(n.d)"></td>
                  <td class="sp-num" x-text="'x' + (n.rate ?? 1)"></td>
                </tr>
              </template>
              <template x-if="nodes.length === 0">
                <tr>
                  <td colspan="4"><div class="sp-empty" style="padding:24px;"><i class="mi">inbox</i>暂无数据</div></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function trafficlogPage() {
      return {
        days: '90',
        details: [],
        daily: [],
        nodes: [],

        async init() {
          await this.reload();
        },

        get dailyLatest() {
          return this.daily.slice().reverse().slice(0, 30);
        },

        async reload() {
          try {
            const res = await SPanelAPI.request('/user/trafficlog?days=' + this.days);
            this.details = res.data.details || [];
            this.daily = res.data.daily || [];
            this.nodes = res.data.nodes || [];
          } catch (err) {
            SPUI.msg(err.message);
          }
        },

        formatBytes(bytes) {
          bytes = Number(bytes) || 0;
          if (bytes <= 0) return '0 B';
          const units = ['B', 'KB', 'MB', 'GB', 'TB'];
          let i = 0;
          let v = bytes;
          while (v >= 1024 && i < units.length - 1) {
            v /= 1024;
            i++;
          }
          return v.toFixed(v >= 100 ? 0 : 2) + ' ' + units[i];
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
