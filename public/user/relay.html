<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中转规则 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="relay">
  <main class="sp-content" x-data="relayPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">中转规则</h1></div>
    </div>

    <div class="sp-content-inner">

      <div class="sp-alert sp-alert-info">
        <i class="mi">info</i>
        <span>中转服务用于将国内加速入口的流量中转至国外落地节点，有助于降低延迟并提升极端网络环境下的连接稳定性。优先级越大，代表其在多个符合条件的规则并存时会被优先采用；节点不设置中转时，将以普通直连模式运行。</span>
      </div>

      <!-- ═══ 规则表 ═══ -->
      <div class="sp-card">
        <div class="sp-card-title">
          <i class="mi">compare_arrows</i>我的中转规则
          <span class="sp-extra"><button class="sp-btn sp-btn-brand sp-btn-sm" @click="openCreateDrawer"><i class="mi">add</i>添加中转规则</button></span>
        </div>

        <div class="sp-table-wrap">
          <table class="sp-table">
            <thead>
              <tr>
                <th>入口中转节点 (Source)</th>
                <th>出口落地节点 (Dist)</th>
                <th>监听端口</th>
                <th>规则优先级</th>
                <th style="text-align:right;">操作</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="rule in rules" :key="rule.id">
                <tr>
                  <td>
                    <span class="sp-dot blue"></span>
                    <span x-text="rule.source_node?.name ?? '-'"></span>
                  </td>
                  <td>
                    <span class="sp-dot red"></span>
                    <span x-text="rule.dist_node?.name ?? (rule.dist_ip || '-')"></span>
                  </td>
                  <td class="sp-num" x-text="rule.port"></td>
                  <td x-text="rule.priority || 0"></td>
                  <td style="text-align:right;">
                    <button class="sp-btn sp-btn-sm" @click="openEditDrawer(rule)"><i class="mi" style="font-size:14px;">edit</i>编辑</button>
                    <button class="sp-btn sp-btn-danger sp-btn-sm" @click="deleteRule(rule.id)"><i class="mi" style="font-size:14px;">delete</i>删除</button>
                  </td>
                </tr>
              </template>
              <template x-if="rules.length === 0">
                <tr>
                  <td colspan="5">
                    <div class="sp-empty"><i class="mi">compare_arrows</i>当前没有任何中转规则。如果没有设置规则，您的订阅节点将以普通直连模式运行。</div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- ═══ 新增 / 编辑中转规则 弹层 ═══ -->
    <div class="sp-modal" :class="showDrawer && 'show'">
      <div class="sp-modal-mask" @click="closeDrawer"></div>
      <div class="sp-modal-dialog" style="max-width:520px;max-height:calc(100vh - 120px);overflow:auto;">
        <div class="sp-modal-inner">
          <div class="sp-card-title" style="margin-bottom:16px;">
            <i class="mi">compare_arrows</i>
            <span x-text="isEdit ? '编辑中转规则' : '新增中转规则'"></span>
          </div>

          <div class="sp-form-row">
            <label class="sp-form-label">入口中转节点 (流量汇入起点)</label>
            <select class="sp-select" x-model="formData.source_node_id">
              <option value="">-- 请选择国内入口中转加速服务器 --</option>
              <template x-for="node in nodes" :key="node.id">
                <option :value="node.id" x-text="node.name"></option>
              </template>
            </select>
          </div>

          <div class="sp-form-row">
            <label class="sp-form-label">出口落地节点 (流量汇出落点)</label>
            <select class="sp-select" x-model="formData.dist_node_id">
              <option value="0">直接出口直连 (落地目标 IP)</option>
              <template x-for="node in nodes" :key="node.id">
                <option :value="node.id" x-text="node.name" :disabled="node.id == formData.source_node_id"></option>
              </template>
            </select>
          </div>

          <div class="sp-form-row" x-show="formData.dist_node_id == 0" x-cloak>
            <label class="sp-form-label">直接出口目标 IP / 域名 (dist_ip)</label>
            <input class="sp-input" type="text" x-model="formData.dist_ip" placeholder="例如: 8.8.8.8 或出口落地主机域名">
          </div>

          <div class="sp-form-row">
            <label class="sp-form-label">我的个人连接端口 (监听端口)</label>
            <input class="sp-input" type="number" x-model="formData.port" readonly>
            <div class="sp-field-hint">系统会自动锁定配置为您的个人 Shadowsocks 监听端口，确保链路中转流量对齐您个人账单。</div>
          </div>

          <div class="sp-form-row">
            <label class="sp-form-label">规则优先级 (数字越大，多条规则匹配时越优先运行)</label>
            <input class="sp-input" type="number" x-model="formData.priority" placeholder="默认为 0">
          </div>
        </div>
        <div class="sp-modal-footer">
          <button class="sp-btn sp-btn-flat" style="margin-right:8px;" @click="closeDrawer">取消</button>
          <button class="sp-btn sp-btn-brand" @click="saveRule" :disabled="saveLoading">
            <span x-show="!saveLoading">确认保存规则</span>
            <span x-show="saveLoading" x-cloak><i class="mi" style="font-size:14px;">refresh</i>正在应用配置...</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function relayPage() {
      return {
        rules: [],
        nodes: [],
        profilePort: null,

        showDrawer: false,
        isEdit: false,
        saveLoading: false,
        editingId: null,

        formData: {
          source_node_id: '',
          dist_node_id: '0',
          dist_ip: '',
          port: '',
          priority: 0
        },

        async init() {
          await this.fetchUserPort();
          await this.fetchRules(); // 列表 + 可选节点一次拉齐 (res.data.nodes)
        },

        async fetchUserPort() {
          try {
            const res = await SPanelAPI.request('/user/profile');
            this.profilePort = res.data.port;
            this.formData.port = this.profilePort;
          } catch(err) {
            console.error('获取个人端口失败：' + err.message);
          }
        },

        async fetchRules() {
          try {
            const res = await SPanelAPI.request('/user/relay');
            this.rules = res.data.items || [];
            this.nodes = res.data.nodes || [];
          } catch(err) {
            console.error('拉取中转规则出错：' + err.message);
          }
        },

        async fetchNodes() {
          try {
            const res = await SPanelAPI.request('/user/relay');
            this.nodes = res.data.nodes || [];
          } catch(err) {
            console.error('拉取节点列表出错：' + err.message);
          }
        },

        openCreateDrawer() {
          this.isEdit = false;
          this.editingId = null;
          this.formData = {
            source_node_id: '',
            dist_node_id: '0',
            dist_ip: '',
            port: this.profilePort,
            priority: 0
          };
          this.showDrawer = true;
        },

        openEditDrawer(rule) {
          this.isEdit = true;
          this.editingId = rule.id;
          this.formData = {
            source_node_id: rule.source_node ? rule.source_node.id.toString() : '',
            dist_node_id: rule.dist_node ? rule.dist_node.id.toString() : '0',
            dist_ip: rule.dist_ip || '',
            port: rule.port,
            priority: rule.priority
          };
          this.showDrawer = true;
        },

        closeDrawer() {
          this.showDrawer = false;
        },

        async saveRule() {
          if (!this.formData.source_node_id) {
            SPUI.msg('请选择中转入口节点！');
            return;
          }
          if (this.formData.dist_node_id == 0 && !this.formData.dist_ip.trim()) {
            SPUI.msg('当出口直连时，必须配置具体的 dist_ip 目标 IP 属性！');
            return;
          }

          this.saveLoading = true;
          const payload = {
            source_node_id: Number(this.formData.source_node_id),
            dist_node_id: Number(this.formData.dist_node_id),
            dist_ip: this.formData.dist_node_id == 0 ? this.formData.dist_ip.trim() : '',
            port: Number(this.formData.port),
            priority: Number(this.formData.priority || 0)
          };

          try {
            if (this.isEdit) {
              const res = await SPanelAPI.request(`/user/relay/${this.editingId}`, {
                method: 'PUT',
                body: JSON.stringify(payload)
              });
              SPUI.msg(res.message || '中转规则已安全更新！');
            } else {
              const res = await SPanelAPI.request('/user/relay', {
                method: 'POST',
                body: JSON.stringify(payload)
              });
              SPUI.msg(res.message || '中转规则已成功部署！');
            }
            this.closeDrawer();
            await this.fetchRules();
          } catch(err) {
            SPUI.msg(err.message || '应用中转规则失败，请稍后检查参数或联系管理员。');
          } finally {
            this.saveLoading = false;
          }
        },

        deleteRule(id) {
          SPUI.confirm('您确定要移除该条中转转发配置吗？对应链路的加速中转将立即断开。', async () => {
            try {
              const res = await SPanelAPI.request(`/user/relay/${id}`, {
                method: 'DELETE'
              });
              SPUI.msg(res.message || '规则已成功卸载。');
              await this.fetchRules();
            } catch(err) {
              SPUI.msg(err.message || '移除失败。');
            }
          }, { danger: true, okText: '删除' });
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
