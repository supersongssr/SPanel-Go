<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>捐赠公示 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="code">
  <main class="sp-content" x-data="donatePage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">捐赠公示</h1></div>
    </div>

    <div class="sp-content-inner">

      <div class="sp-card sp-mb-6">
        <div class="sp-card-title"><i class="mi">favorite</i>赞助明细</div>
        <p class="sp-text-muted" style="font-size:13px;">感谢每一位赞助者的慷慨支持，让站点能够持续稳定运营。您可以在 <a href="/user/code.html">充值界面</a> 进行充值，这样就等同于捐赠了。</p>
      </div>

      <!-- 加载中 -->
      <template x-if="loading">
        <div class="sp-card">
          <div class="sp-empty"><i class="mi">refresh</i>正在加载赞助数据...</div>
        </div>
      </template>

      <template x-if="!loading">
        <div>
          <!-- ═══ 收支总览 + 匿名开关 ═══ -->
          <div class="sp-grid">
            <div class="sp-col-4">
              <div class="sp-card sp-stat">
                <div class="sp-stat-head">
                  <div class="sp-stat-name">赞助总收入</div>
                  <div class="sp-stat-icon green"><i class="mi">attach_money</i></div>
                </div>
                <div class="sp-stat-value"><span class="sp-num" style="font-size:28px;font-weight:600;">￥<span x-text="data.income">0</span></span></div>
                <div class="sp-stat-foot"><span><i class="mi">savings</i>&nbsp;所有赞助收入合计</span></div>
              </div>
            </div>

            <div class="sp-col-4">
              <div class="sp-card sp-stat">
                <div class="sp-stat-head">
                  <div class="sp-stat-name">赞助总支出</div>
                  <div class="sp-stat-icon red"><i class="mi">shopping_cart</i></div>
                </div>
                <div class="sp-stat-value"><span class="sp-num" style="font-size:28px;font-weight:600;">￥<span x-text="data.expense">0</span></span></div>
                <div class="sp-stat-foot"><span><i class="mi">payments</i>&nbsp;服务器等运营支出合计</span></div>
              </div>
            </div>

            <div class="sp-col-4">
              <div class="sp-card sp-stat">
                <div class="sp-stat-head">
                  <div class="sp-stat-name">赞助榜单匿名状态</div>
                  <div class="sp-stat-icon blue"><i class="mi">visibility_off</i></div>
                </div>
                <div class="sp-stat-value" style="font-size:18px;">
                  <span x-show="isHidden()" x-cloak><i class="mi">visibility_off</i> 当前：匿名展示</span>
                  <span x-show="!isHidden()"><i class="mi">visibility</i> 当前：公开展示</span>
                </div>
                <div class="sp-stat-foot" style="gap:8px;">
                  <button class="sp-btn sp-btn-sm sp-btn-flat" @click="toggleHide" :disabled="toggling">
                    <span x-show="!toggling"><i class="mi">swap_horiz</i><span x-text="isHidden() ? '切换为公开显示' : '切换为匿名显示'"></span></span>
                    <span x-show="toggling" x-cloak><i class="mi">refresh</i>处理中...</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- ═══ 流水明细表 ═══ -->
          <div class="sp-card sp-mt-6">
            <div class="sp-card-title"><i class="mi">receipt_long</i>赞助流水明细
              <span class="sp-extra sp-text-hint">所有赞助收入与运营支出的公开收支记录</span>
            </div>
            <div class="sp-table-wrap">
              <table class="sp-table">
                <thead>
                  <tr>
                    <th>用户</th>
                    <th>类型</th>
                    <th>金额</th>
                    <th>时间</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="it in (data.items || [])" :key="it.id">
                    <tr>
                      <td><i class="mi sp-text-hint" style="font-size:14px;">person</i> <span x-text="it.user || '匿名用户'"></span></td>
                      <td><span class="sp-tag" :class="it.type === -1 ? 'sp-tag-green' : 'sp-tag-red'" x-text="typeText(it.type)"></span></td>
                      <td class="sp-num" style="font-weight:600;" :class="it.type === -1 ? 'sp-text-success' : 'sp-text-danger'"
                          x-text="(it.type === -1 ? '+￥' : '-￥') + it.number"></td>
                      <td class="sp-num sp-text-muted" x-text="it.datetime"></td>
                    </tr>
                  </template>
                  <template x-if="!data.items || data.items.length === 0">
                    <tr>
                      <td colspan="4">
                        <div class="sp-empty"><i class="mi">inbox</i>暂无数据</div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function donatePage() {
      return {
        data: { items: [], income: 0, expense: 0, is_hide: 0 },
        loading: true,
        toggling: false,

        async init() {
          await this.load();
        },

        async load() {
          this.loading = true;
          try {
            const res = await SPanelAPI.request('/user/donate');
            this.data = res.data || { items: [], income: 0, expense: 0, is_hide: 0 };
          } catch (err) {
            console.error('加载赞助数据失败:', err);
          } finally {
            this.loading = false;
          }
        },

        isHidden() {
          const h = this.data.is_hide;
          return h === 1 || h === '1' || h === true;
        },

        async toggleHide() {
          SPUI.confirm(this.isHidden() ? '确定要切换为公开显示您的赞助记录吗？' : '确定要切换为匿名显示您的赞助记录吗？', async () => {
            this.toggling = true;
            try {
              const res = await SPanelAPI.request('/user/hide', {
                method: 'POST',
                body: JSON.stringify({ hide: this.isHidden() ? 0 : 1 })
              });
              SPUI.msg(res.message || '匿名状态设置成功！');
              await this.load();
            } catch (err) {
              console.error('设置匿名状态失败:', err);
              SPUI.msg(err.message || '设置失败，请稍后再试。');
            } finally {
              this.toggling = false;
            }
          }, { danger: true, okText: '确认' });
        },

        typeText(t) {
          if (t === -1) return '收入';
          if (t === -2) return '支出';
          return '类型 ' + t;
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
