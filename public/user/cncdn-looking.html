  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="mb-8 flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">中转线路测试</h2>
        <p class="text-slate-400 text-sm mt-2">CN 中转线路状态一览与使用排行榜。需要使用中转线路的用户可在页面底部申请加入中转分组。</p>
      </div>
      <button @click="load()" class="bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 border border-indigo-500/20 px-4 py-2 rounded-xl text-xs font-semibold transition flex-shrink-0">
        <i class="fa-solid fa-rotate mr-1.5" :class="loading ? 'animate-spin' : ''"></i>刷新数据
      </button>
    </div>

    <!-- 加载中 -->
    <template x-if="loading">
      <div class="text-center py-20 text-slate-500">
        <i class="fa-solid fa-spinner animate-spin text-2xl"></i>
        <p class="mt-3 text-sm">正在加载中转线路数据...</p>
      </div>
    </template>

    <template x-if="!loading">
      <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">

        <!-- 左侧：线路列表 -->
        <div class="xl:col-span-2">
          <div class="glass-card p-6 rounded-2xl">
            <h3 class="text-lg font-medium text-white mb-2 flex items-center"><i class="fa-solid fa-tower-broadcast text-indigo-400 mr-2"></i>中转线路列表</h3>
            <p class="text-slate-400 text-xs mb-6">当前可用的国内中转线路及其实时状态。</p>

            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="border-b border-slate-800 text-slate-500 font-semibold">
                    <th class="py-3 text-left">地区</th>
                    <th class="py-3 text-left">区域 ID</th>
                    <th class="py-3 text-left">服务器</th>
                    <th class="py-3 text-right">状态</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/40">
                  <template x-for="line in lines" :key="line.id">
                    <tr class="hover:bg-slate-800/50 transition">
                      <td class="py-3.5 text-slate-200">
                        <i class="fa-solid fa-location-dot text-[10px] text-indigo-400 mr-2"></i><span x-text="line.area"></span>
                      </td>
                      <td class="py-3.5 text-slate-400 font-mono text-xs" x-text="line.areaid"></td>
                      <td class="py-3.5 text-slate-300 font-mono text-xs break-all" x-text="line.server"></td>
                      <td class="py-3.5 text-right">
                        <span class="text-[10px] px-2 py-1 rounded-full font-semibold border" :class="isOnline(line.status) ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-slate-500/10 text-slate-400 border-slate-500/20'" x-text="statusText(line.status)"></span>
                      </td>
                    </tr>
                  </template>
                  <template x-if="lines.length === 0">
                    <tr>
                      <td colspan="4" class="py-10 text-center text-slate-600 text-xs">暂无数据</td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- 页尾：申请中转分组 -->
            <div class="mt-6 pt-6 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
              <p class="text-xs text-slate-500 text-center sm:text-left"><i class="fa-solid fa-circle-info mr-1.5"></i>需要使用中转线路？点击右侧按钮申请加入中转分组，提交后等待管理员审核。</p>
              <button @click="apply" :disabled="applying" class="bg-gradient-to-r from-indigo-500 to-pink-500 text-white rounded-xl px-5 py-2.5 text-xs font-semibold hover:brightness-110 transition disabled:opacity-60 whitespace-nowrap flex-shrink-0">
                <span x-show="!applying"><i class="fa-solid fa-paper-plane mr-1.5"></i>申请中转分组</span>
                <span x-show="applying"><i class="fa-solid fa-spinner animate-spin"></i> 提交中...</span>

            </div>
          </div>
        </div>

        <!-- 右侧：使用排行榜 -->
        <div>
          <div class="glass-card p-6 rounded-2xl">
            <h3 class="text-lg font-medium text-white mb-2 flex items-center"><i class="fa-solid fa-ranking-star text-indigo-400 mr-2"></i>线路使用榜</h3>
            <p class="text-slate-400 text-xs mb-6">中转线路使用次数最多的用户排行。</p>

            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="border-b border-slate-800 text-slate-500 font-semibold">
                    <th class="py-3 text-left">名次</th>
                    <th class="py-3 text-left">用户</th>
                    <th class="py-3 text-right">使用次数</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/40">
                  <template x-for="(row, idx) in top" :key="row.name + '-' + idx">
                    <tr class="hover:bg-slate-800/50 transition">
                      <td class="py-3">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg text-xs font-bold" :class="idx === 0 ? 'bg-amber-500/15 text-amber-400 border border-amber-500/30' : idx === 1 ? 'bg-slate-400/10 text-slate-300 border border-slate-400/30' : idx === 2 ? 'bg-orange-700/15 text-orange-500 border border-orange-700/30' : 'text-slate-500'" x-text="idx + 1"></span>
                      </td>
                      <td class="py-3 text-slate-200 text-xs truncate" x-text="row.name"></td>
                      <td class="py-3 text-right text-indigo-400 font-mono font-semibold text-xs" x-text="row.count"></td>
                    </tr>
                  </template>
                  <template x-if="top.length === 0">
                    <tr>
                      <td colspan="3" class="py-10 text-center text-slate-600 text-xs">暂无数据</td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </template>
  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function cncdnLookingPage() {
      return {
        lines: [],
        top: [],
        loading: true,
        applying: false,

        async init() {
          await this.load();
        },

        async load() {
          this.loading = true;
          try {
            const res = await SPanelAPI.request('/user/cncdn/looking');
            this.lines = (res.data && res.data.lines) || [];
            this.top = (res.data && res.data.top) || [];
          } catch (err) {
            console.error('加载中转线路数据失败:', err);
          } finally {
            this.loading = false;
          }
        },

        async apply() {
          if (!confirm('确定要申请加入中转分组吗？提交申请后需等待管理员审核通过。')) return;
          this.applying = true;
          try {
            const res = await SPanelAPI.request('/user/cncdn/apply', { method: 'POST' });
            alert(res.message || '申请已提交，请等待管理员审核！');
          } catch (err) {
            // 403 + redirect 由 api.js 定向跳转处理，此处兜底提示
            console.error('申请中转分组失败:', err);
            alert(err.message || '申请失败，请稍后再试。');
          } finally {
            this.applying = false;
          }
        },

        isOnline(s) {
          return s === 1 || s === '1' || s === true || s === 'online' || s === 'available';
        },

        statusText(s) {
          if (this.isOnline(s)) return '正常运行';
          if (s === 0 || s === '0' || s === false) return '离线';
          return (s === undefined || s === null) ? '未知' : String(s);
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
