<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中转加速 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="nodes">
  <main class="sp-content" x-data="cncdnLookingPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">中转加速</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- 加载中 -->
      <template x-if="loading">
        <div class="sp-empty"><i class="mi">refresh</i>正在加载中转线路数据...</div>
      </template>

      <template x-if="!loading">
        <div class="sp-grid">

          <!-- 左侧：线路列表 -->
          <div class="sp-col-8">
            <div class="sp-card">
              <div class="sp-card-title">
                <i class="mi">cell_tower</i>中转线路列表
                <span class="sp-extra">
                  <button class="sp-btn sp-btn-sm" @click="load()" :disabled="loading">
                    <i class="mi">refresh</i><span>刷新数据</span>
                  </button>
                </span>
              </div>
              <p class="sp-text-muted sp-mb-6" style="font-size:13px;">当前可用的国内中转线路及其实时状态。网络被运营商 Qos 限速？通过中转摆脱宽带网络限速！</p>

              <div class="sp-table-wrap">
                <table class="sp-table">
                  <thead>
                    <tr>
                      <th>地区</th>
                      <th>区域 ID</th>
                      <th>服务器</th>
                      <th>状态</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="line in lines" :key="line.id">
                      <tr>
                        <td><i class="mi">place</i>&nbsp;<span x-text="line.area"></span></td>
                        <td class="sp-num" x-text="line.areaid"></td>
                        <td class="sp-num sp-wrap" x-text="line.server"></td>
                        <td>
                          <span class="sp-dot" :class="isOnline(line.status) ? 'green' : 'grey'"></span>
                          <span class="sp-tag" :class="isOnline(line.status) ? 'sp-tag-green' : 'sp-tag-grey'" x-text="statusText(line.status)"></span>
                        </td>
                      </tr>
                    </template>
                    <template x-if="lines.length === 0">
                      <tr>
                        <td colspan="4"><div class="sp-empty" style="padding:24px;"><i class="mi">inbox</i>暂无数据</div></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <!-- 页尾：申请中转分组 -->
              <div style="border-top:1px solid var(--sp-divider);margin-top:24px;padding-top:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
                <p class="sp-text-hint" style="font-size:12px;margin:0;"><i class="mi">info</i> 需要使用中转线路？点击右侧按钮申请加入中转分组，提交后等待管理员审核。</p>
                <button class="sp-btn sp-btn-brand" @click="apply" :disabled="applying">
                  <span x-show="!applying"><i class="mi">send</i>申请中转分组</span>
                  <span x-show="applying" x-cloak><i class="mi">refresh</i>提交中...</span>
                </button>
              </div>
            </div>
          </div>

          <!-- 右侧：使用排行榜 -->
          <div class="sp-col-4">
            <div class="sp-card">
              <div class="sp-card-title"><i class="mi">leaderboard</i>线路使用榜</div>
              <p class="sp-text-muted sp-mb-6" style="font-size:13px;">中转线路使用次数最多的用户排行。</p>

              <div class="sp-table-wrap">
                <table class="sp-table">
                  <thead>
                    <tr>
                      <th>名次</th>
                      <th>用户</th>
                      <th>使用次数</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(row, idx) in top" :key="row.name + '-' + idx">
                      <tr>
                        <td>
                          <span class="sp-tag" :class="idx === 0 ? 'sp-tag-orange' : (idx === 1 ? 'sp-tag-grey' : (idx === 2 ? 'sp-tag-yellow' : 'sp-tag-blue'))" x-text="idx + 1"></span>
                        </td>
                        <td class="sp-wrap" x-text="row.name"></td>
                        <td class="sp-num" x-text="row.count"></td>
                      </tr>
                    </template>
                    <template x-if="top.length === 0">
                      <tr>
                        <td colspan="3"><div class="sp-empty" style="padding:24px;"><i class="mi">inbox</i>暂无数据</div></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </template>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function cncdnLookingPage() {
      return {
        lines: [],
        top: [],
        loading: true,
        applying: false,

        async init() {
          await this.load();
        },

        async load() {
          this.loading = true;
          try {
            const res = await SPanelAPI.request('/user/cncdn/looking');
            this.lines = (res.data && res.data.lines) || [];
            this.top = (res.data && res.data.top) || [];
          } catch (err) {
            console.error('加载中转线路数据失败:', err);
          } finally {
            this.loading = false;
          }
        },

        apply() {
          SPUI.confirm('确定要申请加入中转分组吗？提交申请后需等待管理员审核通过。', async () => {
            this.applying = true;
            try {
              const res = await SPanelAPI.request('/user/cncdn/apply', { method: 'POST' });
              SPUI.msg(res.message || '申请已提交，请等待管理员审核！');
            } catch (err) {
              // 403 + redirect 由 api.js 定向跳转处理，此处兜底提示
              console.error('申请中转分组失败:', err);
              SPUI.msg(err.message || '申请失败，请稍后再试。');
            } finally {
              this.applying = false;
            }
          });
        },

        isOnline(s) {
          return s === 1 || s === '1' || s === true || s === 'online' || s === 'available';
        },

        statusText(s) {
          if (this.isOnline(s)) return '正常运行';
          if (s === 0 || s === '0' || s === false) return '离线';
          return (s === undefined || s === null) ? '未知' : String(s);
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
