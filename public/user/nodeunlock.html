<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>媒体解锁 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="nodes">
  <main class="sp-content" x-data="nodeunlockPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">媒体解锁</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- 搜索过滤 -->
      <div class="sp-card">
        <div class="sp-card-title">
          <i class="mi">movie_filter</i>解锁检测
          <span class="sp-extra">
            <button class="sp-btn sp-btn-sm" @click="load()" :disabled="loading">
              <i class="mi">refresh</i><span x-text="loading ? '加载中...' : '刷新数据'"></span>
            </button>
          </span>
        </div>
        <p class="sp-text-muted sp-mb-6" style="font-size:13px;">查看各节点对流媒体与 AI 服务的解锁检测结果，数据由系统定期自动更新。</p>
        <div style="display:flex;align-items:center;gap:8px;">
          <i class="mi">search</i>
          <input type="text" class="sp-input" x-model="filterText" placeholder="搜索节点名称或解锁项目关键词，如 Netflix、GPT...">
        </div>
      </div>

      <!-- 加载中 -->
      <template x-if="loading">
        <div class="sp-empty sp-mt-6"><i class="mi">refresh</i>正在加载解锁检测数据...</div>
      </template>

      <!-- 卡片网格 -->
      <template x-if="!loading">
        <div>
          <div class="sp-grid sp-mt-6">
            <template x-for="item in filteredItems" :key="item.id">
              <div class="sp-col-4">
                <div class="sp-card" style="height:100%;">
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px;">
                    <div class="sp-card-title" style="margin-bottom:0;">
                      <i class="mi">lock_open</i><span class="sp-break-all" x-text="item.name"></span>
                    </div>
                    <span class="sp-tag" :class="isAvailable(item.status) ? 'sp-tag-green' : 'sp-tag-red'" x-text="statusText(item.status)"></span>
                  </div>

                  <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--sp-divider);padding-bottom:8px;margin-bottom:12px;font-size:13px;">
                    <span class="sp-text-hint"><i class="mi">speed</i> 流量倍率</span>
                    <span class="sp-num" x-text="(item.traffic_rate !== undefined && item.traffic_rate !== null ? item.traffic_rate : 1) + 'x'"></span>
                  </div>

                  <div class="sp-text-hint" style="font-size:12px;margin-bottom:8px;">解锁检测详情</div>
                  <div style="display:flex;flex-direction:column;gap:6px;">
                    <template x-for="[key, val] in unlockEntries(item)" :key="key">
                      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;">
                        <span class="sp-text-muted" x-text="key"></span>
                        <span class="sp-tag" :class="isPositive(val) ? 'sp-tag-green' : (isNegative(val) ? 'sp-tag-red' : 'sp-tag-grey')" x-text="val"></span>
                      </div>
                    </template>
                    <template x-if="unlockEntries(item).length === 0">
                      <div class="sp-text-hint" style="font-size:12px;text-align:center;padding:8px 0;">暂无检测数据</div>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- 空态 -->
          <template x-if="filteredItems.length === 0">
            <div class="sp-empty"><i class="mi">inbox</i>暂无数据</div>
          </template>
        </div>
      </template>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function nodeunlockPage() {
      return {
        items: [],
        filterText: '',
        loading: true,

        async init() {
          await this.load();
        },

        async load() {
          this.loading = true;
          try {
            const res = await SPanelAPI.request('/user/node/unlock');
            this.items = (res.data && res.data.items) || [];
          } catch (err) {
            console.error('加载节点解锁检测数据失败:', err);
          } finally {
            this.loading = false;
          }
        },

        get filteredItems() {
          if (!this.filterText.trim()) return this.items;
          const kw = this.filterText.trim().toLowerCase();
          return this.items.filter(it => {
            const nameHit = (it.name || '').toLowerCase().includes(kw);
            const unlockHit = this.unlockEntries(it).some(([k, v]) => (String(k) + ' ' + String(v)).toLowerCase().includes(kw));
            return nameHit || unlockHit;
          });
        },

        // 将 unlock.data (可能是 JSON 字符串或对象) 解析为 [key, value] 数组
        unlockEntries(item) {
          try {
            let raw = item && item.unlock ? item.unlock.data : null;
            if (raw === null || raw === undefined) return [];
            if (typeof raw === 'string') raw = JSON.parse(raw);
            if (raw && typeof raw === 'object') {
              return Object.entries(raw).map(([k, v]) => [String(k), typeof v === 'object' ? JSON.stringify(v) : String(v)]);
            }
            return [['检测结果', String(raw)]];
          } catch (e) {
            const raw = item && item.unlock ? item.unlock.data : '';
            return raw ? [['检测结果', String(raw)]] : [];
          }
        },

        statusText(s) {
          if (this.isAvailable(s)) return '可用';
          if (s === 0 || s === '0' || s === false) return '维护中';
          return (s === undefined || s === null) ? '未知' : String(s);
        },

        isAvailable(s) {
          return s === 1 || s === '1' || s === true || s === 'available' || s === 'enabled';
        },

        isPositive(v) {
          const t = String(v).toLowerCase();
          return t === 'yes' || t === 'true' || t === '1' || t === 'ok' || t === 'originals' || t === 'success';
        },

        isNegative(v) {
          const t = String(v).toLowerCase();
          return t === 'no' || t === 'false' || t === '0' || t === 'failed' || t === 'error';
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
