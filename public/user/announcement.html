<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告&帮助&教程 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="announcement">
  <main class="sp-content" x-data="announcementPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">公告&帮助&教程</h1></div>
    </div>

    <div class="sp-content-inner">
      <div class="sp-card sp-mb-6" style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
        <div>
          <div class="sp-card-title" style="margin-bottom:4px;"><i class="mi">campaign</i>公告中心</div>
          <p class="sp-text-muted" style="font-size:13px;margin:0;">站点官方公告与最新动态。点击公告卡片可展开查看完整内容。</p>
        </div>
        <button @click="load()" class="sp-btn sp-btn-flat" style="flex:none;">
          <i class="mi" :class="loading ? 'sp-spin' : ''">refresh</i>刷新
        </button>
      </div>

      <!-- 加载中 -->
      <template x-if="loading">
        <div class="sp-empty"><i class="mi">refresh</i>正在加载公告数据...</div>
      </template>

      <!-- 详情模式 (?id= 直达) -->
      <template x-if="!loading && detail">
        <div class="sp-card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--sp-divider);padding-bottom:16px;margin-bottom:16px;">
            <div style="min-width:0;">
              <div class="sp-card-title" style="margin-bottom:2px;"><i class="mi">campaign</i><span class="sp-break-all" x-text="detail.title"></span></div>
              <p class="sp-text-hint" style="font-size:12px;margin:0;">发布时间：<span x-text="detail.date || '未知'"></span></p>
            </div>
            <a href="/user/announcement.html" class="sp-btn sp-btn-sm" style="flex:none;"><i class="mi">arrow_back</i>返回列表</a>
          </div>
          <div style="font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-word;" x-text="detail.markdown || detail.content || '暂无内容'"></div>
        </div>
      </template>

      <!-- 列表模式 -->
      <template x-if="!loading && !detail">
        <div>
          <template x-for="a in items" :key="a.id">
            <div class="sp-card sp-mb-6">
              <button @click="toggle(a.id)" style="display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;background:none;border:0;cursor:pointer;padding:0;text-align:left;">
                <div style="display:flex;align-items:center;gap:12px;min-width:0;">
                  <i class="mi" style="font-size:22px;color:var(--sp-primary);">campaign</i>
                  <div style="min-width:0;">
                    <div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" x-text="a.title"></div>
                    <div class="sp-text-hint" style="font-size:12px;" x-text="a.date || '未知时间'"></div>
                  </div>
                </div>
                <i class="mi" style="color:var(--sp-hint);transition:transform .2s;" :class="expanded[a.id] && 'rotate'" :style="expanded[a.id] ? 'transform:rotate(180deg)' : ''">expand_more</i>
              </button>
              <div x-show="expanded[a.id]" x-cloak style="border-top:1px solid var(--sp-divider);margin-top:14px;padding-top:14px;font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-word;" x-text="a.markdown || '暂无内容'"></div>
            </div>
          </template>

          <!-- 空态 -->
          <template x-if="items.length === 0">
            <div class="sp-card"><div class="sp-empty"><i class="mi">inbox</i>暂无数据</div></div>
          </template>
        </div>
      </template>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function announcementPage() {
      return {
        items: [],
        expanded: {},
        detail: null,
        loading: true,

        async init() {
          await this.load();
        },

        async load() {
          this.loading = true;
          try {
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) {
              // 详情模式：URL 携带 ?id= 时直接拉取公告详情
              const res = await SPanelAPI.request('/user/announcements/' + encodeURIComponent(id));
              this.detail = res.data;
              this.items = [];
            } else {
              const res = await SPanelAPI.request('/user/announcements');
              this.items = (res.data && res.data.items) || [];
              this.detail = null;
            }
          } catch (err) {
            console.error('加载公告数据失败:', err);
          } finally {
            this.loading = false;
          }
        },

        toggle(id) {
          this.expanded[id] = !this.expanded[id];
        },

        async logout() {
          SP.logout();
        }
      }
    }
  </script>
</body>
</html>
