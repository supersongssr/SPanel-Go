<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计记录查看 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="detect-log">
  <main class="sp-content" x-data="detectLogPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">审计记录查看</h1></div>
    </div>

    <div class="sp-content-inner">
      <div class="sp-card sp-mb-6" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <p class="sp-text-muted" style="font-size:13px;margin:0;">您账户触发的流量审计命中记录。若对记录有异议，请通过工单联系客服申诉。</p>
        <a href="/user/detect.html" class="sp-btn sp-btn-sm" style="flex:none;">
          <i class="mi">gavel</i>查看审计规则
        </a>
      </div>

      <div class="sp-card">
        <div class="sp-table-wrap" style="box-shadow:none;border-radius:0;">
          <table class="sp-table">
            <thead>
              <tr>
                <th>时间</th>
                <th>规则</th>
                <th>节点</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="log in logs" :key="log.id">
                <tr>
                  <td class="sp-num" x-text="log.datetime"></td>
                  <td class="sp-text-danger" x-text="log.rule || '未知规则'"></td>
                  <td x-text="log.node || '未知节点'"></td>
                </tr>
              </template>
              <template x-if="logs.length === 0">
                <tr><td colspan="3"><div class="sp-empty"><i class="mi">inbox</i>暂无数据</div></td></tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- 分页 -->
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sp-text-2nd);" x-show="total > 0">
          <span>共 <b x-text="total"></b> 条 · 第 <b x-text="page"></b> 页</span>
          <div class="sp-pagination" style="padding:0;">
            <button @click="changePage(page - 1)" :disabled="page <= 1"><i class="mi">chevron_left</i>上一页</button>
            <button @click="changePage(page + 1)" :disabled="page * 15 >= total">下一页<i class="mi">chevron_right</i></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function detectLogPage() {
      return {
        logs: [],
        total: 0,
        page: 1,

        async init() {
          await this.fetchLogs();
        },

        async fetchLogs() {
          try {
            const res = await SPanelAPI.request('/user/detect/log?page=' + this.page);
            this.logs = res.data.items || [];
            this.total = res.data.total || 0;
          } catch (err) {
            SPUI.msg(err.message);
          }
        },

        async changePage(p) {
          if (p < 1) return;
          this.page = p;
          await this.fetchLogs();
        },

        async logout() {
          SP.logout();
        }
      }
    }
  </script>
</body>
</html>
