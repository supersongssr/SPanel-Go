<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购买记录 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="bought">
  <main class="sp-content" x-data="boughtPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">购买记录</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- ═══ 说明卡 ═══ -->
      <div class="sp-card">
        <div class="sp-card-title"><i class="mi">shopping_cart</i>已购套餐
          <span class="sp-extra"><a class="sp-btn sp-btn-sm sp-btn-brand" href="/user/shop.html"><i class="mi">shop</i>继续购买</a></span>
        </div>
        <p class="sp-text-muted" style="font-size:13px;">您的订单历史与自动续费管理。套餐内容摘要展示等级 / 流量 / 有效期等核心权益。</p>
      </div>

      <!-- ═══ 订单表格 ═══ -->
      <div class="sp-card sp-mt-6">
        <div class="sp-card-title"><i class="mi">receipt_long</i>订单明细</div>
        <div class="sp-table-wrap">
          <table class="sp-table">
            <thead>
              <tr>
                <th>套餐</th>
                <th>实付</th>
                <th>购买时间</th>
                <th>自动续费</th>
                <th>内容摘要</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="item in orders" :key="item.id">
                <tr>
                  <td style="font-weight:500;" x-text="item.shop_name || ('套餐 #' + item.shop_id)"></td>
                  <td class="sp-num sp-text-success" style="font-weight:600;" x-text="'￥' + item.price"></td>
                  <td class="sp-num sp-text-muted" x-text="item.datetime"></td>
                  <td>
                    <template x-if="item.renew > 0">
                      <span style="display:inline-flex;align-items:center;gap:6px;">
                        <span class="sp-tag sp-tag-green">开启</span>
                        <button class="sp-btn sp-btn-danger sp-btn-sm" @click="closeRenew(item)">关闭</button>
                      </span>
                    </template>
                    <template x-if="!(item.renew > 0)">
                      <span class="sp-tag sp-tag-grey">关闭</span>
                    </template>
                  </td>
                  <td class="sp-text-muted" x-text="contentSummary(item.content)"></td>
                </tr>
              </template>
              <template x-if="orders.length === 0">
                <tr>
                  <td colspan="5">
                    <div class="sp-empty"><i class="mi">inbox</i>暂无数据</div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- 分页 -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:16px 16px 8px;" x-show="total > 0" x-cloak>
          <span class="sp-text-hint" style="font-size:13px;">共 <span class="sp-num" x-text="total">0</span> 条 · 第 <span class="sp-num" x-text="page">1</span> 页</span>
          <div class="sp-pagination" style="padding:0;">
            <button @click="changePage(page - 1)" :disabled="page <= 1"><i class="mi">chevron_left</i>上一页</button>
            <button @click="changePage(page + 1)" :disabled="page * 15 >= total">下一页<i class="mi">chevron_right</i></button>
          </div>
        </div>
      </div>

      <!-- ═══ 权益矫正 ═══ -->
      <div class="sp-mt-6" style="display:flex;justify-content:flex-end;">
        <button class="sp-btn" @click="relevel" :disabled="relevelLoading">
          <span x-show="!relevelLoading"><i class="mi">auto_fix_high</i>权益矫正</span>
          <span x-show="relevelLoading" x-cloak><i class="mi">refresh</i>矫正中...</span>
        </button>
      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function boughtPage() {
      return {
        orders: [],
        total: 0,
        page: 1,
        relevelLoading: false,

        async init() {
          await this.fetchOrders();
        },

        async fetchOrders() {
          try {
            const res = await SPanelAPI.request('/user/bought?page=' + this.page);
            this.orders = res.data.items || [];
            this.total = res.data.total || 0;
          } catch (err) {
            SPUI.msg(err.message);
          }
        },

        async changePage(p) {
          if (p < 1) return;
          this.page = p;
          await this.fetchOrders();
        },

        contentSummary(content) {
          if (!content || typeof content !== 'object') return '-';
          const parts = [];
          if (content.class) parts.push('等级 VIP' + content.class);
          if (content.bandwidth) parts.push('流量 ' + content.bandwidth + ' GB');
          if (content.expire) parts.push('有效期 ' + content.expire + ' 天');
          return parts.length > 0 ? parts.join(' / ') : '-';
        },

        async closeRenew(item) {
          SPUI.confirm('确定关闭该订单的自动续费吗？', async () => {
            try {
              const res = await SPanelAPI.request('/user/bought/' + item.id, { method: 'DELETE' });
              SPUI.msg(res.message || '自动续费已关闭');
              await this.fetchOrders();
            } catch (err) {
              SPUI.msg(err.message);
            }
          }, { danger: true, okText: '确认' });
        },

        async relevel() {
          SPUI.confirm('将按您的全部已购历史重新矫正套餐等级权益（只升不降），继续吗？', async () => {
            this.relevelLoading = true;
            try {
              const res = await SPanelAPI.request('/user/relevel', { method: 'POST' });
              SPUI.msg(res.message || '权益矫正完成');
            } catch (err) {
              SPUI.msg(err.message);
            } finally {
              this.relevelLoading = false;
            }
          }, { danger: true, okText: '确认' });
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
