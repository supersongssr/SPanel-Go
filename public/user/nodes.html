<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节点列表 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="nodes">
  <main class="sp-content" x-data="nodesPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">节点列表</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- 媒体解锁入口 (复刻旧版 unlock-banner) -->
      <a class="sp-alert sp-alert-info" href="/user/nodeunlock.html" style="text-decoration:none;align-items:center;">
        <i class="mi">movie_filter</i>
        <span style="flex:1;">媒体解锁查询 —— 查看各节点 Netflix / Disney+ 等流媒体解锁情况</span>
        <i class="mi">arrow_forward</i>
      </a>

      <!-- 节点列表 -->
      <div class="sp-card">
        <div class="sp-card-title">
          <i class="mi">airplanemode_active</i>全球加速代理物理节点
          <span class="sp-extra sp-text-hint">实时监控每个加速服务器的状态和负载，点击行可展开运行详情</span>
        </div>

        <div class="sp-table-wrap">
          <table class="sp-table">
            <thead>
              <tr>
                <th>状态</th>
                <th>节点</th>
                <th>国家/地区</th>
                <th>费率比例</th>
                <th>速度上限</th>
                <th>操作</th>
              </tr>
            </thead>
            <template x-for="node in nodes" :key="node.id">
              <tbody>
                <tr>
                  <td>
                    <span class="sp-dot" :class="node.online ? 'green' : 'grey'"></span>
                    <span class="sp-tag" :class="node.online ? 'sp-tag-green' : 'sp-tag-grey'" x-text="node.online ? '健康在线' : '离线维护'"></span>
                  </td>
                  <td class="sp-wrap">
                    <span style="font-weight:500;" x-text="node.name"></span>
                    <span class="sp-text-hint" style="display:block;font-size:12px;margin-top:2px;" x-text="node.info"></span>
                  </td>
                  <td>
                    <span class="sp-tag sp-tag-blue" x-text="node.country_code ? node.country_code.toUpperCase() : '—'"></span>
                  </td>
                  <td class="sp-num" x-text="node.traffic_rate + 'x'"></td>
                  <td class="sp-num" x-text="node.node_speedlimit === '0.00' ? '无限制' : node.node_speedlimit + ' Mbps'"></td>
                  <td>
                    <button class="sp-btn sp-btn-sm" @click="toggleNodeDetails(node.id)">
                      <i class="mi" x-text="nodeDetails[node.id] ? 'expand_less' : 'expand_more'"></i>
                      <span x-text="nodeDetails[node.id] ? '收起详情' : '查看详情'"></span>
                    </button>
                  </td>
                </tr>
                <!-- 展开详情 (点击展开) -->
                <tr x-show="nodeDetails[node.id]" x-cloak>
                  <td colspan="6" class="sp-wrap">
                    <div style="display:flex;flex-wrap:wrap;gap:8px 32px;font-size:13px;">
                      <span>最近心跳：<span class="sp-num" x-text="nodeDetails[node.id]?.heartbeat || '读取中...'"></span></span>
                      <span>国家代码：<span x-text="nodeDetails[node.id]?.country || '—'"></span></span>
                      <span>运行状态：<span x-text="nodeDetails[node.id]?.status || '—'"></span></span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </template>
            <tbody>
              <template x-if="nodes.length === 0">
                <tr>
                  <td colspan="6"><div class="sp-empty" style="padding:24px;"><i class="mi">inbox</i>暂无可用的物理代理服务器节点。</div></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function nodesPage() {
      return {
        nodes: [],
        nodeDetails: {},

        async init() {
          await this.fetchNodes();
        },

        async fetchNodes() {
          try {
            const res = await SPanelAPI.request('/user/node');
            this.nodes = res.data || [];
          } catch (err) {
            console.error(err.message);
          }
        },

        toggleNodeDetails(nodeId) {
          // 节点在线状态详情 (心跳/解锁等由列表接口字段承载, 无独立测速端点)
          if (this.nodeDetails[nodeId]) {
            delete this.nodeDetails[nodeId];
            return;
          }
          const n = (this.nodes || []).find(x => x.id === nodeId);
          this.nodeDetails[nodeId] = {
            heartbeat: n && n.node_heartbeat > 0 ? new Date(n.node_heartbeat * 1000).toLocaleString() : '—',
            country: (n && n.country_code) || '—',
            status: (n && n.status) || '—',
          };
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
