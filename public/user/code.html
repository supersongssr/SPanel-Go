<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充值 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="code">
  <main class="sp-content" x-data="codePage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">充值</h1></div>
    </div>

    <div class="sp-content-inner">

      <div class="sp-grid">

        <!-- ═══ 左栏：卡密兑换 ═══ -->
        <div class="sp-col-4">
          <div class="sp-card" style="height:100%;display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              <div class="sp-card-title"><i class="mi">confirmation_number</i>卡密兑换大厅</div>
              <p class="sp-text-muted" style="font-size:13px;">请输入您购买到的礼品卡、流量包或余额卡密充值码进行激活。系统将实时兑现到您的钱包余额或高速流量配额中。</p>

              <div class="sp-alert sp-alert-info sp-mt-4" style="align-items:center;margin-bottom:0;">
                <i class="mi">attach_money</i>
                <span style="flex:1;">账户余额</span>
                <b class="sp-num" style="font-size:16px;" x-text="'￥' + Number(money).toFixed(2)">￥0.00</b>
              </div>

              <div class="sp-field sp-mt-4">
                <input type="text" id="cardCode" placeholder=" " x-model="cardCode">
                <label for="cardCode">输入形如 SPanel-XXXX-XXXX 的卡密</label>
              </div>

              <div class="sp-mt-4">
                <button class="sp-btn sp-btn-brand sp-btn-block" @click="activateCard" :disabled="loading">
                  <span x-show="!loading"><i class="mi">check_circle</i>立即激活充值</span>
                  <span x-show="loading" x-cloak><i class="mi">refresh</i>正在充值兑换...</span>
                </button>
                <button class="sp-btn sp-btn-block sp-mt-2" @click="checkPayStatus" :disabled="checking">
                  <span x-show="!checking"><i class="mi">satellite_alt</i>充值到账检测</span>
                  <span x-show="checking" x-cloak><i class="mi">refresh</i>检测中 (每 5 秒轮询, 共 3 次)...</span>
                </button>
              </div>
            </div>

            <div class="sp-mt-4">
              <div class="sp-alert sp-alert-warn" style="display:block;margin-bottom:0;">
                <i class="mi">info</i>
                <div style="line-height:1.9;">
                  · 卡密一经兑换即刻失效，无法撤销或退款。<br>
                  · 流量卡会直接加算在您的总可用额度中。<br>
                  · 余额充值卡可在套餐商店中用来购买或续费订阅套餐。<br>
                  · 如在充值中遇到任何问题，请随时在“技术支持”中提交工单求助。
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══ 右栏：充值历史记录 ═══ -->
        <div class="sp-col-8">
          <div class="sp-card">
            <div class="sp-card-title"><i class="mi">history</i>卡密激活使用记录
              <span class="sp-extra sp-text-hint">展示您在本站历史上所有的已兑换卡密明细与充值流水</span>
            </div>
            <div class="sp-table-wrap">
              <table class="sp-table">
                <thead>
                  <tr>
                    <th>卡密名称</th>
                    <th>卡密属性</th>
                    <th>充值额度</th>
                    <th>激活时间</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="history in histories" :key="history.id">
                    <tr>
                      <td class="sp-num" x-text="history.code"></td>
                      <td>
                        <span class="sp-tag" :class="history.type === -1 ? 'sp-tag-green' : 'sp-tag-blue'"
                              x-text="history.type_desc || history.type"></span>
                      </td>
                      <td class="sp-num" style="font-weight:600;" x-text="amountText(history)"></td>
                      <td class="sp-num sp-text-muted" x-text="history.usedatetime"></td>
                    </tr>
                  </template>
                  <template x-if="histories.length === 0">
                    <tr>
                      <td colspan="4">
                        <div class="sp-empty"><i class="mi">inbox</i>暂无任何卡密激活充值历史流水。</div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function codePage() {
      return {
        cardCode: '',
        loading: false,
        checking: false,
        histories: [],
        money: 0,

        async init() {
          await this.fetchHistory();
        },

        async fetchHistory() {
          try {
            const res = await SPanelAPI.request('/user/code/history');
            this.histories = res.data.items || [];
            this.money = res.data.money || 0;
          } catch(err) {
            console.error('拉取卡密兑换历史出错：' + err.message);
          }
        },

        // 充值额度展示: 金额码 ￥ / 流量码 GB / 时长码 天
        amountText(history) {
          if (history.type === -1) return '￥' + Number(history.number).toFixed(2);
          if (history.type === 10001) return history.number + ' GB';
          if (history.type === 10002) return history.number + ' 天';
          return history.number;
        },

        // 充值到账检测: 每 5 秒轮询 1 次, 共 3 次; 命中 ret:1 则刷新流水
        async checkPayStatus() {
          if (this.checking) return;
          this.checking = true;
          const since = Math.floor(Date.now() / 1000);
          try {
            for (let i = 1; i <= 3; i++) {
              try {
                await SPanelAPI.request('/user/code/check?time=' + since);
                SPUI.msg('检测到新的充值已到账，已为您刷新流水。');
                await this.fetchHistory();
                return;
              } catch (err) {
                // ret:0 (暂未到账) 会走异常分支, 继续下一轮
                if (i < 3) {
                  await new Promise(r => setTimeout(r, 5000));
                }
              }
            }
            SPUI.msg('暂未检测到新的充值到账记录。');
          } finally {
            this.checking = false;
          }
        },

        async activateCard() {
          if (!this.cardCode.trim()) {
            SPUI.msg('请输入卡密充值码！');
            return;
          }
          this.loading = true;
          try {
            const res = await SPanelAPI.request('/user/code/activate', {
              method: 'POST',
              body: JSON.stringify({ code: this.cardCode.trim() })
            });
            SPUI.msg(res.message || '卡密充值激活成功！');
            this.cardCode = '';
            await this.fetchHistory();
          } catch(err) {
            SPUI.msg(err.message || '卡密充值失败，请检查卡密有效性或是否已被兑换。');
          } finally {
            this.loading = false;
          }
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
