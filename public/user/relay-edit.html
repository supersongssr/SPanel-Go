<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑中转规则 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="relay-edit">
  <main class="sp-content" x-data="relayEditPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">编辑中转规则</h1></div>
    </div>

    <div class="sp-content-inner">
      <div class="sp-grid">
        <div class="sp-col-8">

          <div class="sp-card">
            <div class="sp-card-title">
              <i class="mi">compare_arrows</i>编辑中转规则
              <span class="sp-extra">
                <span class="sp-text-hint" style="font-size:12px;">规则 <span class="sp-num" x-text="ruleId ? '#' + ruleId : ''"></span></span>
                <a class="sp-btn sp-btn-sm" href="/user/relay.html"><i class="mi" style="font-size:14px;">list</i>规则列表</a>
              </span>
            </div>
            <p class="sp-text-muted" style="font-size:13px;">调整该规则的参数，或直接删除该规则。</p>

            <template x-if="loaded">
              <div>
                <div class="sp-form-row">
                  <label class="sp-form-label">起源节点 (流量入口)</label>
                  <select class="sp-select" x-model="form.source_node_id">
                    <option value="">-- 请选择起源节点 --</option>
                    <template x-for="node in nodes" :key="node.id">
                      <option :value="node.id" x-text="node.name" :selected="node.id == form.source_node_id"></option>
                    </template>
                  </select>
                </div>

                <div class="sp-form-row">
                  <label class="sp-form-label">目标节点 (落地出口)</label>
                  <select class="sp-select" x-model="form.dist_node_id">
                    <option value="">-- 请选择目标节点 --</option>
                    <template x-for="node in nodes" :key="node.id">
                      <option :value="node.id" x-text="node.name" :disabled="node.id == form.source_node_id" :selected="node.id == form.dist_node_id"></option>
                    </template>
                  </select>
                </div>

                <div class="sp-grid" style="gap:16px;">
                  <div class="sp-col-6">
                    <div class="sp-form-row">
                      <label class="sp-form-label">端口</label>
                      <input class="sp-input" type="number" x-model="form.port">
                    </div>
                  </div>
                  <div class="sp-col-6">
                    <div class="sp-form-row">
                      <label class="sp-form-label">优先级</label>
                      <input class="sp-input" type="number" x-model="form.priority">
                    </div>
                  </div>
                </div>

                <div class="sp-form-row">
                  <label class="sp-form-label">目标 IP (选填)</label>
                  <input class="sp-input" type="text" x-model="form.dist_ip" placeholder="例如 1.2.3.4 或落地域名">
                </div>

                <div class="sp-mt-4" style="display:flex;gap:12px;">
                  <button class="sp-btn sp-btn-danger" style="flex:1;" @click="remove" :disabled="submitting">
                    <i class="mi">delete</i>删除规则
                  </button>
                  <button class="sp-btn sp-btn-brand" style="flex:1;" @click="submit" :disabled="submitting">
                    <span x-show="!submitting"><i class="mi">save</i>保存修改</span>
                    <span x-show="submitting" x-cloak><i class="mi" style="font-size:14px;">refresh</i>提交中...</span>
                  </button>
                </div>
              </div>
            </template>

            <template x-if="!loaded">
              <div class="sp-empty"><i class="mi">hourglass_empty</i>加载规则数据中...</div>
            </template>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function relayEditPage() {
      return {
        ruleId: '',
        nodes: [],
        loaded: false,
        submitting: false,
        form: {
          source_node_id: '',
          dist_node_id: '',
          port: '',
          priority: 0,
          dist_ip: ''
        },

        async init() {
          const params = new URLSearchParams(window.location.search);
          this.ruleId = params.get('id') || '';
          if (!this.ruleId) {
            SPUI.msg('缺少规则 ID 参数', () => {
              window.location.href = '/user/relay.html';
            });
            return;
          }
          await this.fetchAndPrefill();
        },

        async fetchAndPrefill() {
          try {
            const res = await SPanelAPI.request('/user/relay');
            this.nodes = res.data.nodes || [];
            const item = (res.data.items || []).find(r => String(r.id) === String(this.ruleId));
            if (!item) {
              SPUI.msg('未找到该中转规则', () => {
                window.location.href = '/user/relay.html';
              });
              return;
            }
            this.form = {
              source_node_id: item.source_node ? String(item.source_node.id) : '',
              dist_node_id: item.dist_node ? String(item.dist_node.id) : '',
              port: item.port,
              priority: item.priority || 0,
              dist_ip: item.dist_ip || ''
            };
            this.loaded = true;
          } catch (err) {
            SPUI.msg(err.message);
          }
        },

        async submit() {
          if (!this.form.source_node_id) { SPUI.msg('请选择起源节点。'); return; }
          if (!this.form.dist_node_id) { SPUI.msg('请选择目标节点。'); return; }
          if (!this.form.port || Number(this.form.port) <= 0) { SPUI.msg('请填写有效的监听端口。'); return; }
          if (this.form.source_node_id == this.form.dist_node_id) { SPUI.msg('起源节点与目标节点不能相同。'); return; }

          this.submitting = true;
          try {
            const res = await SPanelAPI.request('/user/relay/' + this.ruleId, {
              method: 'PUT',
              body: JSON.stringify({
                source_node_id: Number(this.form.source_node_id),
                dist_node_id: Number(this.form.dist_node_id),
                port: Number(this.form.port),
                priority: Number(this.form.priority || 0),
                dist_ip: (this.form.dist_ip || '').trim()
              })
            });
            SPUI.msg(res.message || '中转规则已更新', () => {
              window.location.href = '/user/relay.html';
            });
          } catch (err) {
            SPUI.msg(err.message);
          } finally {
            this.submitting = false;
          }
        },

        remove() {
          SPUI.confirm('确定删除该中转规则吗？对应链路将立即断开。', async () => {
            this.submitting = true;
            try {
              const res = await SPanelAPI.request('/user/relay/' + this.ruleId, { method: 'DELETE' });
              SPUI.msg(res.message || '规则已删除', () => {
                window.location.href = '/user/relay.html';
              });
            } catch (err) {
              SPUI.msg(err.message);
            } finally {
              this.submitting = false;
            }
          }, { danger: true, okText: '删除' });
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
