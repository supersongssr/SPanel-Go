<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>删除我的帐号 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="edit">
  <main class="sp-content" x-data="killPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">删除我的帐号</h1></div>
    </div>

    <div class="sp-content-inner">
      <div class="sp-grid">
        <div class="sp-col-6">

          <!-- 危险警示 (复刻旧版"注意！"卡) -->
          <div class="sp-card">
            <div class="sp-card-title"><i class="mi">warning</i>注意！</div>
            <p style="font-size:13px;">帐号删除后，您的所有数据都会被<b>真实地</b>删除。</p>
            <p style="font-size:13px;">如果想重新使用本网站提供的服务，您需要重新注册。</p>
            <div class="sp-alert sp-alert-danger sp-mt-4">
              <i class="mi">warning</i>
              <span>注销账户为不可逆操作：账户将被立即停用、全部订阅与登录态即刻失效。若您的账户仍在服务期内（未到期且有剩余流量），将无法自助注销，需先联系客服处理。</span>
            </div>
          </div>

          <!-- 身份验证 + 注销 -->
          <div class="sp-card sp-mt-6">
            <div class="sp-card-title"><i class="mi">person_off</i>确认注销</div>
            <p class="sp-text-muted" style="font-size:13px;">为保障账户安全，请输入您的登录密码以确认本次注销操作。</p>
            <div class="sp-form-row">
              <label class="sp-form-label" for="passwd">当前密码（必填）</label>
              <input class="sp-input" id="passwd" type="password" x-model="passwd" placeholder="输入登录密码确认身份">
            </div>
            <button class="sp-btn sp-btn-danger sp-btn-block sp-btn-lg" @click="kill" :disabled="killing">
              <span x-show="!killing"><i class="mi">delete_forever</i>确认注销账户</span>
              <span x-show="killing" x-cloak><i class="mi">refresh</i>正在注销...</span>
            </button>
            <p class="sp-text-hint" style="font-size:12px;text-align:center;">点击按钮即表示您已知晓全部后果并同意注销本账户。</p>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function killPage() {
      return {
        passwd: '',
        killing: false,

        async kill() {
          if (!this.passwd) {
            SPUI.msg('请输入登录密码以确认注销操作。');
            return;
          }
          SPUI.confirm('确定要永久注销您的账户吗？该操作不可逆！', async () => {
            this.killing = true;
            try {
              const res = await SPanelAPI.request('/user/kill', {
                method: 'POST',
                body: JSON.stringify({ passwd: this.passwd })
              });
              SPUI.msg(res.message || '账户已注销', () => {
                window.location.href = '/auth/login.html';
              });
            } catch (err) {
              SPUI.msg(err.message);
            } finally {
              this.killing = false;
            }
          }, { danger: true, okText: '删除' });
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
