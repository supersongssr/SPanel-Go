<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创建工单 - 精确描述您的问题 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="tickets" data-sp-active="tickets">
  <main class="sp-content" x-data="createTicketPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">创建工单 - 精确描述您的问题</h1></div>
    </div>

    <div class="sp-content-inner">
      <div class="sp-grid">
        <div class="sp-col-8">

          <div class="sp-card">
            <div class="sp-card-title">
              <i class="mi">confirmation_number</i>提交新客服工单
              <span class="sp-extra"><a href="/user/tickets.html" class="sp-text-hint" style="font-size:13px;"><i class="mi" style="font-size:14px;">arrow_back</i>返回工单支持中心</a></span>
            </div>
            <p class="sp-text-muted" style="font-size:13px;">当您在订阅激活、加速网络延迟排查或财务账单方面遇到疑问时，可在下方描述您遇到的障碍，我们的专员会尽快回复您。</p>

            <div class="sp-field">
              <input id="title" type="text" placeholder=" " x-model="title">
              <label for="title">工单标题 (简述您遇到的核心问题)</label>
              <div class="sp-field-hint">例如: 港澳高速节点连接超时 / 套餐余额充值未到账等</div>
            </div>

            <div class="sp-field">
              <textarea id="content" rows="12" placeholder=" " x-model="content"></textarea>
              <label for="content">详细问题描述</label>
            </div>

            <div class="sp-alert sp-alert-info">
              <i class="mi">warning</i>
              <span><b>提示:</b> 为了让网络工程师能更迅速、精准地为您分析解决障碍，请尽量提供您所使用的操作系统、代理软件全名以及对应的详细节点延迟和报错日志信息。</span>
            </div>

            <div class="sp-mt-4" style="display:flex;gap:12px;">
              <a href="/user/tickets.html" class="sp-btn" style="flex:1;">取消</a>
              <button class="sp-btn sp-btn-brand" style="flex:1;" @click="submitTicket" :disabled="loading">
                <span x-show="!loading"><i class="mi">send</i>提交工单</span>
                <span x-show="loading" x-cloak><i class="mi">refresh</i>正在安全提交中...</span>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function createTicketPage() {
      return {
        title: '',
        content: `1. 我的使用场景是什么？
: 使用平台 (Windows/macOS/iOS/Android/Linux):
: 代理软件全称及版本:
: 异常节点名称:

2. 我看到的非正常现象是？
: (如订阅连接超时、网络延迟测试报红、特定应用无法分流等)

3. 我可以提供以下报错日志或详细描述:
: `,
        loading: false,

        async submitTicket() {
          if (!this.title.trim()) {
            SPUI.msg('请输入工单标题！');
            return;
          }
          if (!this.content.trim()) {
            SPUI.msg('请提供具体的工单内容描述！');
            return;
          }
          this.loading = true;
          try {
            const res = await SPanelAPI.request('/user/ticket', {
              method: 'POST',
              body: JSON.stringify({
                title: this.title.trim(),
                content: this.content.trim()
              })
            });
            SPUI.msg(res.message || '工单已提交成功，客服会尽快处理您的诉求。', () => {
              window.location.replace('/user/tickets.html');
            });
          } catch(err) {
            SPUI.msg(err.message || '工单提交失败，请稍后再试。');
          } finally {
            this.loading = false;
          }
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
