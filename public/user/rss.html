<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订阅管理 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="rss">
  <main class="sp-content" x-data="rssPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">订阅管理</h1></div>
    </div>

    <div class="sp-content-inner">

      <div class="sp-card">
        <div class="sp-card-title">
          <i class="mi">rss_feed</i>我的订阅
          <span class="sp-extra" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <span class="sp-text-hint" style="font-size:13px;">已用 <span x-text="items.length"></span> / 上限 <span x-text="max"></span></span>
            <button class="sp-btn sp-btn-brand sp-btn-sm" @click="createRss" :disabled="opLoading">
              <span x-show="!opLoading"><i class="mi">add</i>新建订阅</span>
              <span x-show="opLoading" x-cloak><i class="mi">refresh</i>处理中...</span>
            </button>
          </span>
        </div>
        <p class="sp-text-muted" style="font-size:13px;line-height:1.7;">管理您的多个订阅 Token。客户端内填入任一订阅链接即可自动同步节点配置，每个订阅绑定一台设备的客户端，换设备/换客户端请删除旧订阅后重新创建。</p>

        <!-- 订阅列表 -->
        <div class="sp-mt-4">
          <template x-for="item in items" :key="item.id">
            <div style="border:1px solid var(--sp-divider);border-radius:var(--sp-radius);padding:12px 16px;margin-bottom:12px;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
                <span style="font-weight:500;" x-text="'订阅 #' + item.id"></span>
                <span class="sp-tag sp-tag-blue sp-num" x-text="item.token"></span>
                <span style="flex:1;"></span>
                <button class="sp-btn sp-btn-danger sp-btn-sm" @click="deleteRss(item)" :disabled="opLoading"><i class="mi">delete</i>删除</button>
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <code class="sp-text-muted sp-break-all" style="flex:1;min-width:220px;font-size:12px;" x-text="fullUrl(item)"></code>
                <button class="sp-btn sp-btn-sm" @click="copyUrl(item)"><i class="mi">content_copy</i>复制</button>
              </div>
            </div>
          </template>

          <template x-if="items.length === 0">
            <div class="sp-empty"><i class="mi">inbox</i>暂无数据</div>
          </template>
        </div>

        <!-- 上限说明 + 重置 -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;" class="sp-mt-4">
          <p class="sp-text-hint" style="font-size:13px;margin:0;">已用 <span x-text="items.length"></span> / <span x-text="max"></span> 个订阅 Token</p>
          <button class="sp-btn sp-btn-danger" @click="resetRss" :disabled="opLoading"><i class="mi">restart_alt</i>重置全部订阅</button>
        </div>
      </div>

      <!-- 底部说明 -->
      <div class="sp-alert sp-alert-info sp-mt-6">
        <i class="mi">info</i>
        <span>在任意客户端（Shadowrocket / Clash / Surge 等）的订阅地址栏中填入任一订阅链接即可完成配置同步。重置或删除 Token 后，旧链接将立即失效，请及时更新客户端。</span>
      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function rssPage() {
      return {
        items: [],
        max: 5,
        subLimit: 0,
        opLoading: false,

        async init() {
          await this.fetchList();
        },

        async fetchList() {
          try {
            const res = await SPanelAPI.request('/user/rss');
            this.items = res.data.items || [];
            this.max = res.data.max || 5;
            this.subLimit = res.data.sub_limit || 0;
          } catch (err) {
            SPUI.msg(err.message);
          }
        },

        fullUrl(item) {
          return window.location.origin + (item.url || '');
        },

        async copyUrl(item) {
          const url = this.fullUrl(item);
          try {
            await navigator.clipboard.writeText(url);
            SPUI.toast('订阅链接已复制到剪贴板。', 'success');
          } catch (e) {
            // 剪贴板 API 不可用时的兜底
            const ta = document.createElement('textarea');
            ta.value = url;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            SPUI.toast('订阅链接已复制到剪贴板。', 'success');
          }
        },

        async createRss() {
          if (this.items.length >= this.max) {
            SPUI.msg('订阅 Token 数量已达上限 (' + this.max + ')。');
            return;
          }
          this.opLoading = true;
          try {
            const res = await SPanelAPI.request('/user/rss/create', { method: 'POST' });
            SPUI.msg(res.message || '订阅已创建');
            await this.fetchList();
          } catch (err) {
            SPUI.msg(err.message);
          } finally {
            this.opLoading = false;
          }
        },

        deleteRss(item) {
          SPUI.confirm('确定删除该订阅 Token 吗？对应订阅链接将立即失效！', async () => {
            this.opLoading = true;
            try {
              const res = await SPanelAPI.request('/user/rss/delete', {
                method: 'POST',
                body: JSON.stringify({ id: item.id })
              });
              SPUI.msg(res.message || '订阅已删除');
              await this.fetchList();
            } catch (err) {
              SPUI.msg(err.message);
            } finally {
              this.opLoading = false;
            }
          }, { danger: true, okText: '删除' });
        },

        resetRss() {
          SPUI.confirm('危险操作：将删除全部现有订阅 Token 并生成新的默认订阅，所有客户端需重新配置。确定继续吗？', async () => {
            this.opLoading = true;
            try {
              const res = await SPanelAPI.request('/user/rss/reset', { method: 'POST' });
              SPUI.msg(res.message || '订阅已全部重置');
              await this.fetchList();
            } catch (err) {
              SPUI.msg(err.message);
            } finally {
              this.opLoading = false;
            }
          }, { danger: true, okText: '重置' });
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
