<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>处理中 - SPanel</title>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
</head>
<!-- 通用副作用路由壳 (方案 §5.3, D5):
     旧 GET 副作用路径 (logout/gareset/telegram_reset/url_reset/inviteurl_reset/backtoadmin)
     由服务端直接返回本页, JS 按 path 调对应 API 后跳转。 -->
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;">
  <div class="sp-card" style="max-width:380px;width:100%;text-align:center;">
    <div style="padding:24px 0 8px;">
      <i id="icon" class="mi" style="font-size:44px;">sync</i>
    </div>
    <p id="msg" class="sp-text-muted" style="font-size:14px;">正在处理您的请求...</p>
    <p style="margin-top:16px;">
      <a id="link" href="/user/" class="sp-btn sp-btn-brand" style="display:none;">点此手动继续</a>
    </p>
  </div>
  <script src="/assets/js/api.js"></script>
  <script>
    (async function () {
      const path = window.location.pathname.replace(/\/+$/, '');
      const msg = document.getElementById('msg');
      const icon = document.getElementById('icon');
      const link = document.getElementById('link');

      const MAP = {
        '/user/logout':         { api: null,                              to: '/auth/login.html' },
        '/user/gareset':        { api: ['POST', '/user/ga/reset'],        to: '/user/edit.html' },
        '/user/telegram_reset': { api: ['POST', '/user/telegram/reset'],  to: '/user/edit.html' },
        '/user/url_reset':      { api: ['POST', '/user/rss/reset'],       to: '/user/rss.html' },
        '/user/inviteurl_reset':{ api: ['POST', '/user/invite/reset'],    to: '/user/invite.html' },
        '/user/backtoadmin':    { api: ['POST', '/user/back-to-admin'],   to: '/admin/dashboard.html' },
      };

      const item = MAP[path];
      if (!item) {
        msg.textContent = '未知的操作路径';
        return;
      }

      try {
        if (item.api) {
          const res = await SPanelAPI.request(item.api[1], { method: item.api[0] });
          msg.textContent = res.msg || '操作成功';
          // backtoadmin 需更新本地摘要为管理员身份
          if (path === '/user/backtoadmin' && res.data && res.data.user) {
            localStorage.setItem('spanel_user', JSON.stringify(res.data.user));
          }
        } else {
          // logout: 服务端清 cookie + 本地清摘要
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          msg.textContent = '已安全退出';
        }
        icon.className = 'mi sp-text-success';
        icon.textContent = 'check_circle';
        link.href = item.to;
        setTimeout(() => { window.location.replace(item.to); }, 900);
      } catch (err) {
        msg.textContent = err.message || '操作失败';
        icon.className = 'mi sp-text-danger';
        icon.textContent = 'error';
        link.style.display = 'inline-flex';
        link.textContent = '返回上一页';
        link.href = document.referrer || '/user/';
      }
    })();
  </script>
</body>
</html>
