<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>处理中 - SPanel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif}</style>
</head>
<!-- 通用副作用路由壳 (方案 §5.3, D5):
     旧 GET 副作用路径 (logout/gareset/telegram_reset/url_reset/inviteurl_reset/backtoadmin)
     由服务端直接返回本页, JS 按 path 调对应 API 后跳转。 -->
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 flex items-center justify-center px-4">
  <div class="text-center space-y-4 max-w-md">
    <i id="icon" class="fa-solid fa-spinner animate-spin text-4xl text-indigo-400"></i>
    <p id="msg" class="text-sm text-slate-400">正在处理您的请求...</p>
    <a id="link" href="/user/dashboard.html" class="hidden text-indigo-400 text-sm font-semibold hover:text-indigo-300 transition">点此手动继续</a>
  </div>
  <script src="/assets/js/api.js"></script>
  <script>
    (async function () {
      const path = window.location.pathname.replace(/\/+$/, '');
      const msg = document.getElementById('msg');
      const icon = document.getElementById('icon');
      const link = document.getElementById('link');

      const MAP = {
        '/user/logout':         { api: null,                              to: '/auth/login.html' },
        '/user/gareset':        { api: ['POST', '/user/ga/reset'],        to: '/user/edit.html' },
        '/user/telegram_reset': { api: ['POST', '/user/telegram/reset'],  to: '/user/edit.html' },
        '/user/url_reset':      { api: ['POST', '/user/rss/reset'],       to: '/user/rss.html' },
        '/user/inviteurl_reset':{ api: ['POST', '/user/invite/reset'],    to: '/user/invite.html' },
        '/user/backtoadmin':    { api: ['POST', '/user/back-to-admin'],   to: '/admin/dashboard.html' },
      };

      const item = MAP[path];
      if (!item) {
        msg.textContent = '未知的操作路径';
        return;
      }

      try {
        if (item.api) {
          const res = await SPanelAPI.request(item.api[1], { method: item.api[0] });
          msg.textContent = res.msg || '操作成功';
          // backtoadmin 需更新本地摘要为管理员身份
          if (path === '/user/backtoadmin' && res.data && res.data.user) {
            localStorage.setItem('spanel_user', JSON.stringify(res.data.user));
          }
        } else {
          // logout: 服务端清 cookie + 本地清摘要
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          msg.textContent = '已安全退出';
        }
        icon.className = 'fa-solid fa-circle-check text-4xl text-emerald-400';
        link.href = item.to;
        setTimeout(() => { window.location.replace(item.to); }, 900);
      } catch (err) {
        msg.textContent = err.message || '操作失败';
        icon.className = 'fa-solid fa-circle-exclamation text-4xl text-rose-400';
        link.classList.remove('hidden');
        link.textContent = '返回上一页';
        link.href = document.referrer || '/user/dashboard.html';
      }
    })();
  </script>
</body>
</html>
