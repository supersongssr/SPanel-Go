<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网速优化 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="nodes">
  <main class="sp-content" x-data="cfcdnLookingPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">网速优化</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- 说明卡片 -->
      <div class="sp-card">
        <div class="sp-card-title"><i class="mi">cloud</i>什么是优选 IP？</div>
        <p class="sp-text-muted" style="font-size:13px;line-height:1.8;">Cloudflare 优选 IP 是指在 Cloudflare CDN 节点中经实测延迟低、速率表现优异的 IP 地址。使用优选 IP 建立连接可显著提升链路质量与传输速度。参考上榜 IP 可帮助您挑选连接质量更佳的 Cloudflare 节点，优选 IP 可在<a href="/user/edit.html">个人设定</a>中进行配置。</p>
      </div>

      <div class="sp-card sp-mt-6">
        <div class="sp-card-title">
          <i class="mi">leaderboard</i>优选 IP 使用榜
          <span class="sp-extra">
            <button class="sp-btn sp-btn-sm" @click="load()" :disabled="loading">
              <i class="mi">refresh</i><span x-text="loading ? '加载中...' : '刷新榜单'"></span>
            </button>
          </span>
        </div>
        <p class="sp-text-muted sp-mb-6" style="font-size:13px;">按使用次数统计的用户优选 IP 排行。</p>

        <!-- 加载中 -->
        <template x-if="loading">
          <div class="sp-empty"><i class="mi">refresh</i>正在加载榜单数据...</div>
        </template>

        <template x-if="!loading">
          <div class="sp-table-wrap">
            <table class="sp-table">
              <thead>
                <tr>
                  <th>名次</th>
                  <th>用户</th>
                  <th>优选 IP</th>
                  <th>使用次数</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(row, idx) in top" :key="(row.name || '') + '-' + idx">
                  <tr>
                    <td>
                      <span class="sp-tag" :class="idx === 0 ? 'sp-tag-orange' : (idx === 1 ? 'sp-tag-grey' : (idx === 2 ? 'sp-tag-yellow' : 'sp-tag-blue'))" x-text="idx + 1"></span>
                    </td>
                    <td><i class="mi">person</i>&nbsp;<span x-text="row.name"></span></td>
                    <td class="sp-num sp-wrap" x-text="row.ip"></td>
                    <td class="sp-num" x-text="row.count"></td>
                  </tr>
                </template>
                <!-- 空态 -->
                <template x-if="top.length === 0">
                  <tr>
                    <td colspan="4"><div class="sp-empty" style="padding:24px;"><i class="mi">inbox</i>暂无数据</div></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function cfcdnLookingPage() {
      return {
        top: [],
        loading: true,

        async init() {
          await this.load();
        },

        async load() {
          this.loading = true;
          try {
            const res = await SPanelAPI.request('/user/cfcdn/looking');
            this.top = (res.data && res.data.top) || [];
          } catch (err) {
            console.error('加载优选 IP 榜单数据失败:', err);
          } finally {
            this.loading = false;
          }
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
