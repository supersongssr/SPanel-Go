<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用教程 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="tutorial">
  <main class="sp-content" x-data="tutorialPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">使用教程</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- 三步引导 (复刻旧版教程页引导文案) -->
      <div class="sp-alert sp-alert-info">
        <i class="mi">info</i>
        <span>已按您的设备自动定位系统。三步完成配置：<b>① 下载软件 → ② 添加订阅 → ③ 更新同步节点</b>。订阅地址在「订阅节点」页面复制，节点信息由订阅自动下发，无需任何手动配置。</span>
      </div>

      <div class="sp-card sp-mt-6">
        <div class="sp-card-title">
          <i class="mi">checklist</i>配置步骤
          <span class="sp-extra"><a class="sp-btn sp-btn-sm" href="/user/nodes.html"><i class="mi">link</i>获取订阅链接</a></span>
        </div>
        <ol class="sp-steps" style="font-size:13px;line-height:1.9;">
          <li>根据当前平台选择下方推荐客户端，点击「前往下载」进入官方渠道获取最新版本并安装。</li>
          <li>进入「节点列表」页面复制您的专属订阅链接。</li>
          <li>打开客户端，选择「订阅 → 添加订阅」并粘贴链接，更新订阅即可自动同步全部节点。若连接异常，请尝试切换客户端内核或更新至最新版本。</li>
        </ol>
      </div>

      <!-- 平台切换 -->
      <div class="sp-tabs sp-mt-6">
        <template x-for="tab in tabs" :key="tab.key">
          <button class="sp-tab" :class="activeTab === tab.key && 'active'" @click="activeTab = tab.key">
            <i class="mi" x-text="tab.icon"></i><span x-text="tab.label"></span>
          </button>
        </template>
      </div>

      <!-- 加载中 -->
      <template x-if="loading">
        <div class="sp-empty"><i class="mi">refresh</i>正在加载客户端数据...</div>
      </template>

      <!-- 客户端卡片矩阵 -->
      <template x-if="!loading">
        <div>
          <div class="sp-grid sp-mt-6">
            <template x-for="app in (data[activeTab] || [])" :key="app.name">
              <div class="sp-col-4">
                <div class="sp-card" style="height:100%;display:flex;flex-direction:column;justify-content:space-between;">
                  <div>
                    <div class="sp-card-title">
                      <i class="mi">get_app</i><span x-text="app.name"></span>
                      <span class="sp-extra"><span class="sp-tag sp-tag-blue" x-text="tabLabel(activeTab) + ' 平台'"></span></span>
                    </div>
                    <p class="sp-text-muted" style="font-size:13px;line-height:1.7;" x-text="app.desc"></p>
                  </div>
                  <div class="sp-mt-4">
                    <a class="sp-btn sp-btn-brand sp-btn-block" :href="app.url" target="_blank" rel="noopener noreferrer"><i class="mi">get_app</i>前往下载</a>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- 空态 -->
          <template x-if="(data[activeTab] || []).length === 0">
            <div class="sp-empty"><i class="mi">inbox</i>暂无数据</div>
          </template>
        </div>
      </template>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function tutorialPage() {
      return {
        data: {},
        loading: true,
        activeTab: 'windows',
        tabs: [
          { key: 'windows', label: 'Windows', icon: 'desktop_windows' },
          { key: 'macos', label: 'macOS', icon: 'laptop_mac' },
          { key: 'ios', label: 'iOS', icon: 'phone_iphone' },
          { key: 'android', label: 'Android', icon: 'android' },
          { key: 'linux', label: 'Linux', icon: 'dns' },
        ],

        async init() {
          this.detectPlatform();
          await this.load();
        },

        // 根据 User-Agent 判定默认展示的平台 Tab
        detectPlatform() {
          const ua = navigator.userAgent;
          if (ua.includes('iPhone') || ua.includes('iPad')) this.activeTab = 'ios';
          else if (ua.includes('Android')) this.activeTab = 'android';
          else if (ua.includes('Windows')) this.activeTab = 'windows';
          else if (ua.includes('Mac')) this.activeTab = 'macos';
          else if (ua.includes('Linux')) this.activeTab = 'linux';
        },

        async load() {
          try {
            const res = await fetch('/assets/data/tutorial.json');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            this.data = await res.json();
            // 若当前默认 Tab 无数据则回退到第一个有数据的平台
            if (!this.data[this.activeTab] || this.data[this.activeTab].length === 0) {
              const first = Object.keys(this.data).find(k => Array.isArray(this.data[k]) && this.data[k].length > 0);
              if (first) this.activeTab = first;
            }
          } catch (err) {
            console.error('加载客户端教程数据失败:', err);
          } finally {
            this.loading = false;
          }
        },

        tabLabel(key) {
          const tab = this.tabs.find(t => t.key === key);
          return tab ? tab.label : key;
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
