<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户端下载与配置教程 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="tutorialPage()">

  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50" x-data="{ mobileMenuOpen: false, open: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo 区域 -->
        <div class="flex items-center space-x-3">
          <a href="/user/dashboard.html" class="font-outfit text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SPanel</a>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20">Member</span>
        </div>

        <!-- 桌面端导航链接 (md 级别以上显示) -->
        <div class="hidden md:flex items-center space-x-6 text-sm">
          <a href="/user/dashboard.html" class="transition font-medium whitespace-nowrap" :class="window.location.pathname.includes('dashboard') ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-indigo-400'"><i class="fa-solid fa-chart-line mr-1.5"></i>控制台</a>
          <a href="/user/nodes.html" class="transition font-medium whitespace-nowrap" :class="window.location.pathname.includes('nodes') ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-indigo-400'"><i class="fa-solid fa-server mr-1.5"></i>节点列表</a>
          <a href="/user/relay.html" class="transition font-medium whitespace-nowrap" :class="window.location.pathname.includes('relay') ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-indigo-400'"><i class="fa-solid fa-route mr-1.5"></i>中转规则</a>
          <a href="/user/shop.html" class="transition font-medium whitespace-nowrap" :class="window.location.pathname.includes('shop') ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-indigo-400'"><i class="fa-solid fa-store mr-1.5"></i>套餐商店</a>
          <a href="/user/code.html" class="transition font-medium whitespace-nowrap" :class="window.location.pathname.includes('code.html') ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-indigo-400'"><i class="fa-solid fa-credit-card mr-1.5"></i>卡密充值</a>
          <a href="/user/invite.html" class="transition font-medium whitespace-nowrap" :class="window.location.pathname.includes('invite') ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-indigo-400'"><i class="fa-solid fa-gift mr-1.5"></i>推广联盟</a>
          <a href="/user/tickets.html" class="transition font-medium whitespace-nowrap" :class="window.location.pathname.includes('ticket') ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-indigo-400'"><i class="fa-solid fa-ticket mr-1.5"></i>工单支持</a>

          <!-- 用户下拉子菜单 -->
          <div class="relative" @click.away="open = false">
            <button @click="open = !open" class="transition font-medium whitespace-nowrap focus:outline-none flex items-center" :class="(window.location.pathname.includes('profile') || window.location.pathname.includes('edit')) ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-indigo-400'">
              <i class="fa-solid fa-user-gear mr-1.5"></i>我的账户<i class="fa-solid fa-chevron-down text-[10px] ml-1 transition" :class="open ? 'rotate-180' : ''"></i>
            </button>
            <div class="absolute right-0 mt-2 w-40 rounded-xl bg-slate-900 border border-slate-800 shadow-xl py-1 z-50" x-show="open" x-transition>
              <template x-if="typeof isAdmin !== 'undefined' ? isAdmin : (localStorage.getItem('spanel_user') && (JSON.parse(localStorage.getItem('spanel_user')).isAdmin || JSON.parse(localStorage.getItem('spanel_user')).is_admin === 1))">
                <a href="/admin/dashboard.html" class="block px-4 py-2 text-xs text-indigo-400 hover:bg-indigo-950/30 hover:text-indigo-300 transition font-semibold"><i class="fa-solid fa-gauge mr-2"></i>管理后台</a>
              </template>
              <template x-if="typeof isAdmin !== 'undefined' ? isAdmin : (localStorage.getItem('spanel_user') && (JSON.parse(localStorage.getItem('spanel_user')).isAdmin || JSON.parse(localStorage.getItem('spanel_user')).is_admin === 1))">
                <hr class="border-slate-800 my-1">
              </template>
              <a href="/user/profile.html" class="block px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 transition"><i class="fa-solid fa-user mr-2"></i>个人中心</a>
              <a href="/user/edit.html" class="block px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 transition"><i class="fa-solid fa-shield-halved mr-2"></i>安全设置</a>
              <hr class="border-slate-800 my-1">
              <button @click="logout" class="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-rose-950/20 transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>退出登录</button>
            </div>
          </div>
        </div>

        <!-- 移动端汉堡包按钮 (md 以下显示) -->
        <div class="flex items-center md:hidden">
          <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-slate-400 hover:text-indigo-400 transition focus:outline-none">
            <i class="fa-solid text-xl" :class="mobileMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 移动端下拉面板 (md 以下显示) -->
    <div class="md:hidden bg-slate-950/95 border-b border-slate-800" x-show="mobileMenuOpen" x-transition>
      <div class="px-4 pt-2 pb-4 space-y-1">
        <a href="/user/dashboard.html" class="block px-3 py-2 rounded-xl text-sm font-medium transition" :class="window.location.pathname.includes('dashboard') ? 'bg-slate-900 text-indigo-400 font-semibold' : 'text-slate-300 hover:bg-slate-900 hover:text-indigo-400'"><i class="fa-solid fa-chart-line mr-2"></i>控制台</a>
        <a href="/user/nodes.html" class="block px-3 py-2 rounded-xl text-sm font-medium transition" :class="window.location.pathname.includes('nodes') ? 'bg-slate-900 text-indigo-400 font-semibold' : 'text-slate-300 hover:bg-slate-900 hover:text-indigo-400'"><i class="fa-solid fa-server mr-2"></i>节点列表</a>
        <a href="/user/relay.html" class="block px-3 py-2 rounded-xl text-sm font-medium transition" :class="window.location.pathname.includes('relay') ? 'bg-slate-900 text-indigo-400 font-semibold' : 'text-slate-300 hover:bg-slate-900 hover:text-indigo-400'"><i class="fa-solid fa-route mr-2"></i>中转规则</a>
        <a href="/user/shop.html" class="block px-3 py-2 rounded-xl text-sm font-medium transition" :class="window.location.pathname.includes('shop') ? 'bg-slate-900 text-indigo-400 font-semibold' : 'text-slate-300 hover:bg-slate-900 hover:text-indigo-400'"><i class="fa-solid fa-store mr-2"></i>套餐商店</a>
        <a href="/user/code.html" class="block px-3 py-2 rounded-xl text-sm font-medium transition" :class="window.location.pathname.includes('code.html') ? 'bg-slate-900 text-indigo-400 font-semibold' : 'text-slate-300 hover:bg-slate-900 hover:text-indigo-400'"><i class="fa-solid fa-credit-card mr-2"></i>卡密充值</a>
        <a href="/user/invite.html" class="block px-3 py-2 rounded-xl text-sm font-medium transition" :class="window.location.pathname.includes('invite') ? 'bg-slate-900 text-indigo-400 font-semibold' : 'text-slate-300 hover:bg-slate-900 hover:text-indigo-400'"><i class="fa-solid fa-gift mr-2"></i>推广联盟</a>
        <a href="/user/tickets.html" class="block px-3 py-2 rounded-xl text-sm font-medium transition" :class="window.location.pathname.includes('ticket') ? 'bg-slate-900 text-indigo-400 font-semibold' : 'text-slate-300 hover:bg-slate-900 hover:text-indigo-400'"><i class="fa-solid fa-ticket mr-2"></i>工单支持</a>

        <hr class="border-slate-800 my-2">

        <div class="px-3 py-1 text-xs font-semibold text-slate-500 uppercase">我的账户</div>
        <template x-if="localStorage.getItem('spanel_user') && (JSON.parse(localStorage.getItem('spanel_user')).isAdmin || JSON.parse(localStorage.getItem('spanel_user')).is_admin === 1)">
          <a href="/admin/dashboard.html" class="block px-3 py-2 rounded-xl text-sm font-medium text-indigo-400 hover:bg-slate-900 transition"><i class="fa-solid fa-gauge mr-2"></i>管理后台</a>
        </template>
        <a href="/user/profile.html" class="block px-3 py-2 rounded-xl text-sm font-medium transition" :class="window.location.pathname.includes('profile') ? 'bg-slate-900 text-indigo-400 font-semibold' : 'text-slate-300 hover:bg-slate-900 hover:text-indigo-400'"><i class="fa-solid fa-user mr-2"></i>个人中心</a>
        <a href="/user/edit.html" class="block px-3 py-2 rounded-xl text-sm font-medium transition" :class="window.location.pathname.includes('edit') ? 'bg-slate-900 text-indigo-400 font-semibold' : 'text-slate-300 hover:bg-slate-900 hover:text-indigo-400'"><i class="fa-solid fa-shield-halved mr-2"></i>安全设置</a>
        <button @click="logout" class="w-full text-left px-3 py-2 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-950/20 transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>退出登录</button>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="mb-8 flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">客户端下载与配置教程</h2>
        <p class="text-slate-400 text-sm mt-2">各平台推荐客户端与官方下载渠道一览。购买套餐后，在节点列表页面复制订阅链接，粘贴到任意客户端即可一键导入全部节点。</p>
      </div>
      <a href="/user/nodes.html" class="bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 border border-indigo-500/20 px-4 py-2 rounded-xl text-xs font-semibold transition flex-shrink-0">
        <i class="fa-solid fa-link mr-1.5"></i>获取订阅链接
      </a>
    </div>

    <!-- 平台 Tab -->
    <div class="glass-card p-2 rounded-2xl mb-6 flex flex-wrap gap-2">
      <template x-for="tab in tabs" :key="tab.key">
        <button @click="activeTab = tab.key" class="px-4 py-2 rounded-xl text-sm font-medium transition border" :class="activeTab === tab.key ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30' : 'text-slate-400 border-transparent hover:bg-slate-800/60 hover:text-indigo-400'">
          <i :class="tab.icon" class="mr-1.5"></i><span x-text="tab.label"></span>
        </button>
      </template>
    </div>

    <!-- 加载中 -->
    <template x-if="loading">
      <div class="text-center py-20 text-slate-500">
        <i class="fa-solid fa-spinner animate-spin text-2xl"></i>
        <p class="mt-3 text-sm">正在加载客户端数据...</p>
      </div>
    </template>

    <!-- 客户端卡片矩阵 -->
    <template x-if="!loading">
      <div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
          <template x-for="app in (data[activeTab] || [])" :key="app.name">
            <div class="glass-card p-6 rounded-2xl flex flex-col hover:border-indigo-500/30 transition">
              <div class="flex items-center space-x-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 flex-shrink-0">
                  <i class="fa-solid fa-download"></i>
                </div>
                <div class="min-w-0">
                  <h3 class="font-semibold text-white text-sm truncate" x-text="app.name"></h3>
                  <p class="text-[10px] text-slate-500 mt-0.5"><span x-text="tabLabel(activeTab)"></span> 平台客户端</p>
                </div>
              </div>

              <p class="text-xs text-slate-400 leading-relaxed flex-1" x-text="app.desc"></p>

              <a :href="app.url" target="_blank" rel="noopener noreferrer" class="mt-4 inline-flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-500 to-pink-500 text-white rounded-xl py-2.5 text-xs font-semibold hover:brightness-110 transition">
                <i class="fa-solid fa-arrow-down-to-line"></i>前往下载
              </a>
            </div>
          </template>
        </div>

        <!-- 空态 -->
        <template x-if="(data[activeTab] || []).length === 0">
          <div class="glass-card p-6 rounded-2xl text-center py-16 text-slate-600">
            <i class="fa-solid fa-inbox text-2xl mb-3"></i>
            <p class="text-sm">暂无数据</p>
          </div>
        </template>

        <!-- 使用提示 -->
        <div class="glass-card p-6 rounded-2xl mt-6 flex items-start space-x-4">
          <div class="w-10 h-10 rounded-xl bg-pink-600/20 border border-pink-500/30 flex items-center justify-center text-pink-400 flex-shrink-0">
            <i class="fa-solid fa-circle-info"></i>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-white mb-1">如何导入订阅？</h3>
            <p class="text-xs text-slate-400 leading-relaxed">进入「节点列表」页面复制您的专属订阅链接，打开客户端后选择「订阅 → 添加订阅」并粘贴链接，更新订阅即可自动同步全部节点。若连接异常，请尝试切换客户端内核或更新至最新版本。</p>
          </div>
        </div>
      </div>
    </template>
  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function tutorialPage() {
      return {
        data: {},
        loading: true,
        activeTab: 'windows',
        tabs: [
          { key: 'windows', label: 'Windows', icon: 'fa-brands fa-windows' },
          { key: 'macos', label: 'macOS', icon: 'fa-brands fa-apple' },
          { key: 'ios', label: 'iOS', icon: 'fa-solid fa-mobile-screen-button' },
          { key: 'android', label: 'Android', icon: 'fa-brands fa-android' },
          { key: 'linux', label: 'Linux', icon: 'fa-brands fa-linux' },
        ],

        async init() {
          this.detectPlatform();
          await this.load();
        },

        // 根据 User-Agent 判定默认展示的平台 Tab
        detectPlatform() {
          const ua = navigator.userAgent;
          if (ua.includes('iPhone') || ua.includes('iPad')) this.activeTab = 'ios';
          else if (ua.includes('Android')) this.activeTab = 'android';
          else if (ua.includes('Windows')) this.activeTab = 'windows';
          else if (ua.includes('Mac')) this.activeTab = 'macos';
          else if (ua.includes('Linux')) this.activeTab = 'linux';
        },

        async load() {
          try {
            const res = await fetch('/assets/data/tutorial.json');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            this.data = await res.json();
            // 若当前默认 Tab 无数据则回退到第一个有数据的平台
            if (!this.data[this.activeTab] || this.data[this.activeTab].length === 0) {
              const first = Object.keys(this.data).find(k => Array.isArray(this.data[k]) && this.data[k].length > 0);
              if (first) this.activeTab = first;
            }
          } catch (err) {
            console.error('加载客户端教程数据失败:', err);
          } finally {
            this.loading = false;
          }
        },

        tabLabel(key) {
          const tab = this.tabs.find(t => t.key === key);
          return tab ? tab.label : key;
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
