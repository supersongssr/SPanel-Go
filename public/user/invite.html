<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邀请 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="invite">
  <main class="sp-content" x-data="invitePage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">邀请</h1></div>
    </div>

    <div class="sp-content-inner">

      <div class="sp-grid">

        <!-- ═══ 专属推广链接 ═══ -->
        <div class="sp-col-8">
          <div class="sp-card" style="height:100%;display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              <div class="sp-card-title"><i class="mi">link</i>专属推广注册链接</div>
              <p class="sp-text-muted" style="font-size:13px;">邀请您的朋友来到 SPanel，当他们通过该链接注册并完成套餐购买后，您将获得由平台返还的丰厚消费佣金奖励！</p>
            </div>
            <div class="sp-mt-4">
              <div class="sp-alert sp-alert-info" style="align-items:center;">
                <i class="mi">link</i>
                <span class="sp-break-all sp-num" style="flex:1;font-size:12px;" x-text="inviteUrl">生成中...</span>
                <button class="sp-btn sp-btn-brand" @click="copyLink"><i class="mi">content_copy</i>复制推广链接</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══ 累计已赚佣金 ═══ -->
        <div class="sp-col-4">
          <div class="sp-card sp-stat">
            <div class="sp-stat-head">
              <div class="sp-stat-name">累计已赚佣金</div>
              <div class="sp-stat-icon green"><i class="mi">attach_money</i></div>
            </div>
            <div class="sp-stat-value"><span class="sp-num" style="font-size:28px;font-weight:600;" x-text="'￥' + totalEarned">￥0.00</span></div>
            <div class="sp-stat-foot"><span><i class="mi">loyalty</i>&nbsp;<span x-text="'可生成邀请码配额上限: ' + inviteNum + ' 次'">可生成邀请码配额上限: 0 次</span></span></div>
          </div>
        </div>

        <!-- ═══ 成功邀请的下线伙伴 ═══ -->
        <div class="sp-col-6">
          <div class="sp-card">
            <div class="sp-card-title"><i class="mi">group</i>成功邀请的下线伙伴
              <span class="sp-extra sp-text-hint">通过专属推广链接成功注册的下线用户</span>
            </div>
            <div class="sp-table-wrap">
              <table class="sp-table">
                <thead>
                  <tr>
                    <th>用户 UID</th>
                    <th>脱敏邮箱</th>
                    <th>注册时间</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="friend in downlines" :key="friend.id">
                    <tr>
                      <td class="sp-num sp-text-muted" x-text="'#' + friend.id"></td>
                      <td class="sp-num" x-text="friend.email"></td>
                      <td class="sp-num sp-text-muted" x-text="friend.reg_date"></td>
                    </tr>
                  </template>
                  <template x-if="downlines.length === 0">
                    <tr>
                      <td colspan="3">
                        <div class="sp-empty"><i class="mi">inbox</i>暂无任何下线伙伴注册记录，快分享推广链接吧！</div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- ═══ 返利佣金流水账单 ═══ -->
        <div class="sp-col-6">
          <div class="sp-card">
            <div class="sp-card-title"><i class="mi">history</i>返利佣金流水账单
              <span class="sp-extra sp-text-hint">受荐伙伴消费时产生的返佣对账流水</span>
            </div>
            <div class="sp-table-wrap">
              <table class="sp-table">
                <thead>
                  <tr>
                    <th>受荐消费者</th>
                    <th>购买总价</th>
                    <th>返利提成</th>
                    <th>发放时间</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="rebate in rebates" :key="rebate.id">
                    <tr>
                      <td class="sp-num" x-text="rebate.consumer.email"></td>
                      <td class="sp-num sp-text-muted" x-text="'￥' + Number(rebate.total).toFixed(2)"></td>
                      <td class="sp-num sp-text-success" style="font-weight:600;" x-text="'+￥' + Number(rebate.ref_get).toFixed(2)"></td>
                      <td class="sp-num sp-text-muted" x-text="rebate.datetime"></td>
                    </tr>
                  </template>
                  <template x-if="rebates.length === 0">
                    <tr>
                      <td colspan="4">
                        <div class="sp-empty"><i class="mi">inbox</i>暂无任何推广提成发放账单记录。</div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function invitePage() {
      return {
        inviteNum: 0,
        totalEarned: '0.00',
        inviteUrl: '',
        downlines: [],
        rebates: [],

        async init() {
          await this.fetchInviteData();
        },

        async fetchInviteData() {
          try {
            const res = await SPanelAPI.request('/user/invite');
            const data = res.data;
            this.inviteNum = data.invite_num;
            this.totalEarned = Number(data.total_earned).toFixed(2);
            // 确保生成全路径 URL，如果后端返回相对路径或含 window 处理
            if (data.invite_url) {
              if (data.invite_url.startsWith('http')) {
                this.inviteUrl = data.invite_url;
              } else {
                this.inviteUrl = `${window.location.origin}${data.invite_url}`;
              }
            } else {
              // 自动兜底
              const storedUser = localStorage.getItem('spanel_user');
              if (storedUser) {
                const u = JSON.parse(storedUser);
                this.inviteUrl = `${window.location.origin}/auth/register.html?ref=${u.id}`;
              }
            }
            this.downlines = data.downlines || [];
            this.rebates = data.rebates || [];
          } catch(err) {
            console.error('获取推广数据错误：' + err.message);
          }
        },

        async copyLink() {
          if (!this.inviteUrl) return;
          try {
            await navigator.clipboard.writeText(this.inviteUrl);
            SPUI.toast('专属推广链接已复制，快分享给您的伙伴们吧！', 'success');
          } catch(e) {
            SPUI.msg('复制失败，请手动双击输入框进行复制！');
          }
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
