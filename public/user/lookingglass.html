<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网速监控 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/css/material-icons.css">
  <link rel="stylesheet" href="/assets/css/spanel.css">
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body data-sp-area="user" data-sp-page="nodes">
  <main class="sp-content" x-data="lookingglassPage()">
    <div class="sp-content-header">
      <div class="sp-container"><h1 class="sp-content-heading">网速监控</h1></div>
    </div>

    <div class="sp-content-inner">

      <!-- 说明 (复刻旧版提示文案) -->
      <div class="sp-alert sp-alert-info">
        <i class="mi">info</i>
        <span>各节点三网（电信 / 联通 / 移动）延迟与上下行速率实测数据，可作为选择节点的参考依据。测试节点来自 <a href="http://speedtest.net" target="_blank" rel="noopener noreferrer">Speedtest</a>，数据仅供参考~</span>
      </div>

      <div class="sp-card sp-mt-6">
        <div class="sp-card-title">
          <i class="mi">speed</i>三网延迟和测速
          <span class="sp-extra">
            <button class="sp-btn sp-btn-sm" @click="load()" :disabled="loading">
              <i class="mi">refresh</i><span x-text="loading ? '加载中...' : '刷新数据'"></span>
            </button>
          </span>
        </div>

        <!-- 加载中 -->
        <template x-if="loading">
          <div class="sp-empty"><i class="mi">refresh</i>正在加载 Looking Glass 数据...</div>
        </template>

        <template x-if="!loading">
          <div class="sp-table-wrap">
            <table class="sp-table">
              <thead>
                <tr>
                  <th>节点</th>
                  <th>测试时间</th>
                  <th>电信</th>
                  <th>联通</th>
                  <th>移动</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in items" :key="item.id">
                  <tr>
                    <td><i class="mi">dns</i>&nbsp;<span x-text="item.node"></span></td>
                    <td class="sp-num" x-text="item.time"></td>
                    <td>
                      <template x-if="item.telecom">
                        <div style="font-size:13px;line-height:1.7;">
                          <div><span class="sp-text-hint">延迟 </span><span class="sp-num" x-text="item.telecom.ping"></span></div>
                          <div><span class="sp-text-hint">↑ </span><span class="sp-num" x-text="item.telecom.up"></span>&nbsp;&nbsp;<span class="sp-text-hint">↓ </span><span class="sp-num" x-text="item.telecom.down"></span></div>
                        </div>
                      </template>
                      <template x-if="!item.telecom">
                        <span class="sp-text-hint">暂无数据</span>
                      </template>
                    </td>
                    <td>
                      <template x-if="item.unicom">
                        <div style="font-size:13px;line-height:1.7;">
                          <div><span class="sp-text-hint">延迟 </span><span class="sp-num" x-text="item.unicom.ping"></span></div>
                          <div><span class="sp-text-hint">↑ </span><span class="sp-num" x-text="item.unicom.up"></span>&nbsp;&nbsp;<span class="sp-text-hint">↓ </span><span class="sp-num" x-text="item.unicom.down"></span></div>
                        </div>
                      </template>
                      <template x-if="!item.unicom">
                        <span class="sp-text-hint">暂无数据</span>
                      </template>
                    </td>
                    <td>
                      <template x-if="item.cmcc">
                        <div style="font-size:13px;line-height:1.7;">
                          <div><span class="sp-text-hint">延迟 </span><span class="sp-num" x-text="item.cmcc.ping"></span></div>
                          <div><span class="sp-text-hint">↑ </span><span class="sp-num" x-text="item.cmcc.up"></span>&nbsp;&nbsp;<span class="sp-text-hint">↓ </span><span class="sp-num" x-text="item.cmcc.down"></span></div>
                        </div>
                      </template>
                      <template x-if="!item.cmcc">
                        <span class="sp-text-hint">暂无数据</span>
                      </template>
                    </td>
                  </tr>
                </template>
                <!-- 空态 -->
                <template x-if="items.length === 0">
                  <tr>
                    <td colspan="5"><div class="sp-empty" style="padding:24px;"><i class="mi">inbox</i>暂无数据</div></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/sp-ui.js"></script>
  <script src="/assets/js/sp-shell.js"></script>
  <script>
    function lookingglassPage() {
      return {
        items: [],
        loading: true,

        async init() {
          await this.load();
        },

        async load() {
          this.loading = true;
          try {
            const res = await SPanelAPI.request('/user/lookingglass');
            this.items = (res.data && res.data.items) || [];
          } catch (err) {
            console.error('加载 Looking Glass 数据失败:', err);
          } finally {
            this.loading = false;
          }
        },

        async logout() {
          try { await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
